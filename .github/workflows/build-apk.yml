name: Build Ledgerbook APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Restore signing key from GitHub Secrets (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/ledgerbook-release.jks
            printf 'storeFile=ledgerbook-release.jks\nstorePassword=%s\nkeyAlias=ledgerbook\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > app/keystore.properties
          else
            echo "::notice::No signing key in Secrets; the release APK is left unsigned for signing outside GitHub"
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/Ledgerbook.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk out/Ledgerbook-unsigned.apk
          fi
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ledgerbook-APK
          path: out/*.apk

      - name: Publish release (when a v* tag is pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
