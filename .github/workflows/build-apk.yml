name: Build Ledgerbook (Android APK + Windows EXE)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK (preinstalled on GitHub's Ubuntu 24.04 runners)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restore signing key from GitHub Secrets (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/ledgerbook-release.jks
            printf 'storeFile=ledgerbook-release.jks\nstorePassword=%s\nkeyAlias=ledgerbook\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > app/keystore.properties
          else
            echo "::notice::No signing key in Secrets; the release APK is left unsigned for signing outside GitHub"
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/Ledgerbook.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk out/Ledgerbook-unsigned.apk
          fi
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Ledgerbook-APK
          path: out/*.apk

      - name: Save APK to the 'builds' branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd out
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds

      - name: Publish release (when a v* tag is pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build Windows installer
        working-directory: desktop
        run: |
          rm -rf www && cp -r ../app/src/main/assets/www www
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never
          ls -la dist

      - name: Save installer to the 'builds-exe' branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out && cp desktop/dist/Ledgerbook-Setup-*.exe out/
          cd out
          git init -q -b builds-exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Windows installer from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds-exe
