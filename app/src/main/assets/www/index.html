/* ---------- trial balance ---------- */
function tbRows(bk){
  const out=[];
  for(const [g,n] of GROUPS){const ls=bk.list.filter(l=>l.group===g&&Math.abs(l.close)>0.004).sort((a,b)=>a.name.localeCompare(b.name));if(!ls.length)continue;
    out.push({group:n,ls})}
  return out;
}
function aTB(){
  const range=acctRange();const bk=books(sub.from,sub.to);const G=tbRows(bk);
  let dr=0,cr=0;const line=(name,v)=>{if(v>=0)dr+=v;else cr+=-v};
  for(const g of G)for(const l of g.ls)line(l.name,l.close);
  if(bk.OS)line("Opening Stock",bk.OS);if(Math.abs(bk.P0)>0.004)line("P&L",-bk.P0);if(Math.abs(bk.diff)>0.004)line("Diff",-bk.diff);
  dr=r2(dr);cr=r2(cr);
  const sheetRows=[];for(const g of G){const t=r2(g.ls.reduce((a,l)=>a+l.close,0));sheetRows.push([g.group,"",t>0?t:"",t<0?-t:""]);for(const l of g.ls)sheetRows.push(["",l.name,l.close>0?l.close:"",l.close<0?-l.close:""])}
  if(bk.OS)sheetRows.push(["Opening Stock","",bk.OS,""]);if(Math.abs(bk.P0)>0.004)sheetRows.push(["Profit & Loss A/c (previous periods)","",bk.P0<0?-bk.P0:"",bk.P0>0?bk.P0:""]);
  if(Math.abs(bk.diff)>0.004)sheetRows.push(["Difference in opening balances","",bk.diff<0?-bk.diff:"",bk.diff>0?bk.diff:""]);
  sub._exportDoc=()=>({title:"Trial Balance",subtitle:`${fmtDate(sub.from)} to ${fmtDate(sub.to)}`,sheets:[{name:"Trial Balance",head:["Group","Ledger","Debit","Credit"],rows:sheetRows,foot:["Total","",dr,cr],bold:r=>sheetRows[r]&&sheetRows[r][1]===""}]});
  return range+`<div class="row" style="margin-bottom:10px">${Math.abs(dr-cr)<0.01?`<span class="paid-stamp">${ic("check")} Debit equals credit · ${money(dr)}</span>`:`<span class="chip bad">Out by ${money(dr-cr)}</span>`}<span class="hint">Closing stock on ${fmtDate(sub.to)}: ${money(bk.CS)} (shown in P&amp;L and balance sheet)</span></div>
  <div class="tablewrap"><table><thead><tr><th>Particulars</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody>
  ${G.map(g=>{const t=r2(g.ls.reduce((a,l)=>a+l.close,0));return `<tr><td style="background:var(--sunk);font-weight:600">${esc(g.group)}</td><td class="num" style="background:var(--sunk);font-weight:600">${t>0?amt(t):""}</td><td class="num" style="background:var(--sunk);font-weight:600">${t<0?amt(-t):""}</td></tr>`+g.ls.map(l=>`<tr><td style="padding-left:26px"><button class="link" data-stmt="${esc(l.id)}">${esc(l.name)}</button></td><td class="num">${l.close>0?amt(l.close):""}</td><td class="num">${l.close<0?amt(-l.close):""}</td></tr>`).join("")}).join("")}
  ${bk.OS?`<tr><td style="font-weight:600">Opening Stock</td><td class="num">${amt(bk.OS)}</td><td></td></tr>`:""}
  ${Math.abs(bk.P0)>0.004?`<tr><td style="font-weight:600">Profit &amp; Loss A/c (previous periods)</td><td class="num">${bk.P0<0?amt(-bk.P0):""}</td><td class="num">${bk.P0>0?amt(bk.P0):""}</td></tr>`:""}
  ${Math.abs(bk.diff)>0.004?`<tr><td style="font-weight:600;color:var(--warn)">Difference in opening balances</td><td class="num">${bk.diff<0?amt(-bk.diff):""}</td><td class="num">${bk.diff>0?amt(bk.diff):""}</td></tr>`:""}
  </tbody><tfoot><tr><td>Grand total</td><td class="num">${amt(dr)}</td><td class="num">${amt(cr)}</td></tr></tfoot></table></div>
  ${Math.abs(bk.diff)>0.004?`<p class="hint" style="margin-top:8px">The opening balances you entered (including opening stock of ${money(bk.OS_init)}) don't balance by ${money(Math.abs(bk.diff))}. Usually the owner's capital opening balance makes up the difference: set it in Ledgers → Capital Account → Edit.</p>`:""}`;
}

function tSide(items){return items.filter(Boolean)}
function tTable(left,right,lh,rh){
  const n=Math.max(left.length,right.length),cell=(r,side)=>r?`<td style="${side==="r"?"border-left:2px solid var(--line);":""}${r.ind?"padding-left:28px;":""}${r.b?"font-weight:600;":""}${r.hl?"color:var(--accent);":""}">${r.link?`<button class="link" data-stmt="${esc(r.link)}">${esc(r.t)}</button>`:esc(r.t)}</td><td class="num" style="${r.b?"font-weight:600;":""}">${r.sub!=null?`<span class="muted">${neg(r.sub)}</span>`:""}</td><td class="num" style="${r.b?"font-weight:600;":""}${r.hl?"color:var(--accent);":""}">${r.v!=null?neg(r.v):""}</td>`:`<td${side==="r"?' style="border-left:2px solid var(--line)"':""}></td><td></td><td></td>`;
  let h=`<div class="tablewrap"><table><thead><tr><th>${lh}</th><th></th><th class="num">Amount</th><th style="border-left:2px solid var(--line)">${rh}</th><th></th><th class="num">Amount</th></tr></thead><tbody>`;
  for(let i=0;i<n;i++)h+=`<tr>${cell(left[i],"l")}${cell(right[i],"r")}</tr>`;
  return h+`</tbody></table></div>`;
}
const tRowsToSheet=(left,right)=>{const n=Math.max(left.length,right.length),rows=[];for(let i=0;i<n;i++){const a=left[i],b=right[i];rows.push([a?(a.ind?"   ":"")+a.t:"",a?.sub??"",a?.v??"",b?(b.ind?"   ":"")+b.t:"",b?.sub??"",b?.v??""])}
  rows.bold=(r,c)=>{const x=c<3?left[r]:right[r];return !!(x&&!x.ind)};return rows};
function tSheet(name,head,L,R){const rows=tRowsToSheet(L,R);return {name,head,rows,bold:rows.bold}}
function groupRows(ls,f,title){if(!ls.length)return [];const t=r2(ls.reduce((a,l)=>a+f(l),0));return [{t:title,v:t,b:1},...ls.map(l=>({t:l.name,sub:r2(f(l)),ind:1,link:l.id}))]}
function plT(bk,pf){
  const L=[],R=[];
  L.push({t:"Opening Stock",v:bk.OS,b:1});L.push(...groupRows(pf.purch,pf.expAmt,"Purchase Accounts"));L.push(...groupRows(pf.direxp,pf.expAmt,"Direct Expenses"));
  R.push(...groupRows(pf.sales,pf.incAmt,"Sales Accounts"));R.push(...groupRows(pf.dirinc,pf.incAmt,"Direct Incomes"));R.push({t:"Closing Stock",v:bk.CS,b:1});
  if(pf.GP>=0)L.push({t:"Gross Profit c/o",v:pf.GP,b:1,hl:1});else R.push({t:"Gross Loss c/o",v:-pf.GP,b:1,hl:1});
  const n=Math.max(L.length,R.length);while(L.length<n)L.push(null);while(R.length<n)R.push(null);
  const tradeTot=r2(Math.max(pf.tradeDr+Math.max(pf.GP,0),pf.tradeCr+Math.max(-pf.GP,0)));
  L.push({t:"Total",v:tradeTot,b:1});R.push({t:"Total",v:tradeTot,b:1});
  const L2=[],R2=[];
  if(pf.GP<0)L2.push({t:"Gross Loss b/f",v:-pf.GP,b:1});else R2.push({t:"Gross Profit b/f",v:pf.GP,b:1});
  L2.push(...groupRows(pf.indexp,pf.expAmt,"Indirect Expenses"));R2.push(...groupRows(pf.indinc,pf.incAmt,"Indirect Incomes"));
  if(pf.NP>=0)L2.push({t:"Net Profit",v:pf.NP,b:1,hl:1});else R2.push({t:"Net Loss",v:-pf.NP,b:1,hl:1});
  const n2=Math.max(L2.length,R2.length);while(L2.length<n2)L2.push(null);while(R2.length<n2)R2.push(null);
  const t2=r2(Math.max(pf.GP,0)+pf.tot(pf.indinc,pf.incAmt)+Math.max(-pf.NP,0));
  L2.push({t:"Total",v:t2,b:1});R2.push({t:"Total",v:t2,b:1});
  return {L,R,L2,R2};
}
function aPL(){
  const range=acctRange();const bk=books(sub.from,sub.to),pf=plFigures(bk),t=plT(bk,pf);
  sub._exportDoc=()=>({title:"Profit & Loss Account",subtitle:`${fmtDate(sub.from)} to ${fmtDate(sub.to)}`,landscape:true,sheets:[

/* ---------- balance sheet ---------- */
function bsData(bk,pf){
  const by=g=>bk.list.filter(l=>l.group===g&&Math.abs(l.close)>0.004).sort((a,b)=>a.name.localeCompare(b.name));
  const cr=l=>-l.close,dr=l=>l.close;
  const L=[],A=[];
  const cap=by("capital");const capTot=r2(cap.reduce((a,l)=>a+cr(l),0));
  L.push({t:"Capital Account",v:capTot,b:1},...cap.map(l=>({t:l.name,sub:r2(cr(l)),ind:1,link:l.id})));
  const plTot=r2(bk.P0+pf.NP);
  L.push({t:"Profit & Loss A/c",v:plTot,b:1},{t:"Opening balance",sub:bk.P0,ind:1},{t:"Current period",sub:pf.NP,ind:1});
  for(const g of ["reserves","loans","creditors","curliab","suspense"])L.push(...groupRows(by(g),cr,GRP[g].n));
  const duties=by("duties"),dCr=duties.filter(l=>l.close<0),dDr=duties.filter(l=>l.close>0);
  L.push(...groupRows(dCr,cr,"Duties & Taxes (payable)"));
  if(Math.abs(bk.diff)>0.004&&bk.diff>0)L.push({t:"Difference in opening balances",v:bk.diff,b:1});
  for(const g of ["fixed","invest"])A.push(...groupRows(by(g),dr,GRP[g].n));
  A.push({t:"Closing Stock",v:bk.CS,b:1});
  for(const g of ["debtors","cash","bank","advances","curassets"])A.push(...groupRows(by(g),dr,GRP[g].n));
  A.push(...groupRows(dDr,dr,"Duties & Taxes (input credit)"));
  if(Math.abs(bk.diff)>0.004&&bk.diff<0)A.push({t:"Difference in opening balances",v:-bk.diff,b:1});
  const tl=r2(L.reduce((a,r)=>a+(r&&r.v!=null&&!r.ind?r.v:0),0)),ta=r2(A.reduce((a,r)=>a+(r&&r.v!=null&&!r.ind?r.v:0),0));
  return {L,A,tl,ta};
}
function aBS(){

const SRV_KEY="lb_server";

const DEVICE_NAME=DESKTOP?"Windows app":NATIVE?"Android app":"Web browser";
const normUrl=u=>{u=String(u||"").trim().replace(/\/+$/,"");if(!u)return "";if(!/^https?:\/\//i.test(u))u="http://"+u;try{const x=new URL(u);if(x.protocol==="http:"&&!x.port&&(/^\d+\.\d+\.\d+\.\d+$/.test(x.hostname)||x.hostname==="localhost"))x.port="8787";return x.origin}catch(e){return u}};
async function api(path,{method="GET",body,url,token}={}){
  const base=normUrl(url||SRV.url),headers={"X-LB-Device":DEVICE_NAME},tk=token!==undefined?token:SRV&&SRV.token;
  if(body!==undefined)headers["Content-Type"]="application/json";if(tk)headers.Authorization="Bearer "+tk;
  let r;try{r=await fetch(base+path,{method,headers,body:body!==undefined?JSON.stringify(body):undefined})}catch(e){throw Object.assign(new Error("Can't reach the server. Check the address, the Wi-Fi/internet connection, and that the server is running."),{code:"network"})}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const err=Object.assign(new Error(j.error||("Server error "+r.status)),{status:r.status,code:r.status===409?"conflict":r.status===403?"forbidden":r.status===401?"auth":"server",current:j.current});if(r.status===401&&!url&&SRV&&SRV.token)onAuthLost();throw err}
  return j;
}
function serverBackend(){
  const upd=(coll,doc)=>{const i=S[coll].findIndex(x=>x.id===doc.id);if(i>=0)S[coll][i]=doc;else S[coll].push(doc)};
  let es=null,alive=false;
  async function loadAll(){const d=await api("/api/data");for(const c of COLLS)S[c]=d.colls[c]||[];S.settings=d.settings||{};S.counters=d.counters||{}}
  const connect=()=>{try{es&&es.close()}catch(e){}
    es=new EventSource(normUrl(SRV.url)+"/api/events?token="+encodeURIComponent(SRV.token));
    es.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
      if(m.type==="hello"){if(!alive){alive=true;if(es._seen)loadAll().then(()=>{setConn(true);scheduleRender()});else{es._seen=true;setConn(true)}}}
      else if(m.type==="put"){upd(m.coll,m.doc);scheduleRender()}
      else if(m.type==="del"){S[m.coll]=S[m.coll].filter(x=>x.id!==m.id);scheduleRender()}
      else if(m.type==="settings"){S.settings=m.doc;scheduleRender()}
      else if(m.type==="counters"){S.counters=m.counters}
      else if(m.type==="reload"){loadAll().then(scheduleRender)}
      else if(m.type==="audit"){if(view==="audit"&&!$("#modalRoot").firstChild){auditCache=null;scheduleRender()}}
      else if(m.type==="users"){refreshMe()}};
    es.onerror=()=>{if(alive){alive=false;setConn(false)}};
  };
  return {kind:"server",loadAll,
    async init(){await loadAll();connect()},
    async put(coll,obj){const ex=S[coll].find(x=>x.id===obj.id);
      const r=await api(`/api/doc/${coll}/${encodeURIComponent(obj.id)}`,{method:"PUT",body:{doc:obj,baseRev:ex?._rev||0}}).catch(e=>{if(e.code==="conflict"){if(e.current)upd(coll,e.current);else S[coll]=S[coll].filter(x=>x.id!==obj.id);scheduleRender()}throw e});
      upd(coll,r.doc);scheduleRender();return r.doc},
    async remove(coll,id){const ex=S[coll].find(x=>x.id===id);await api(`/api/doc/${coll}/${encodeURIComponent(id)}?baseRev=${ex?._rev||0}`,{method:"DELETE"});S[coll]=S[coll].filter(x=>x.id!==id);scheduleRender()},
    async saveSettings(o){const r=await api("/api/settings",{method:"PUT",body:{doc:o,baseRev:S.settings._rev||0}}).catch(e=>{if(e.code==="conflict"&&e.current){S.settings=e.current;scheduleRender()}throw e});S.settings=r.doc;scheduleRender()},
    async nextSeq(fy,floor){return (await api("/api/seq",{method:"POST",body:{fy,floor}})).n},
    async resetCounters(map){await api("/api/counters",{method:"POST",body:{map}});S.counters=map},
    close(){try{es&&es.close()}catch(e){}}};
}

async function readLocalStore(){
  const out={settings:{},counters:{}};for(const c of COLLS)out[c]=[];
  const idb=await idbOpen();
  const all=await new Promise((res,rej)=>{const o=[];const c=idb.transaction("kv","readonly").objectStore("kv").openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){o.push([cur.key,cur.value]);cur.continue()}else res(o)};c.onerror=()=>rej(c.error)});
  for(const [k,v] of all){const [coll]=String(k).split("/");if(COLLS.includes(coll))out[coll].push(v);else if(k==="settings")out.settings=v;else if(k==="counters")out.counters=v}
  return out;
}

/* ---------- GSTIN checksum (mod-36) ---------- */
function gstinChecksumOk(g){
  g=String(g||"").toUpperCase();if(!GSTIN_RE.test(g))return false;
  const cs="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";let sum=0;
  for(let i=0;i<14;i++){const v=cs.indexOf(g[i]),p=v*(i%2?2:1);sum+=Math.floor(p/36)+(p%36)}
  return cs[(36-(sum%36))%36]===g[14];
}

    toGstin:p.gstin||"URP",toTrdName:p.name||"",toAddr1:(ship.line||bill.line||"").slice(0,120),toAddr2:"",toPlace:(ship.city||bill.city||"").slice(0,50),toPincode:+(String(e.toPin||ship.pin||bill.pin||"").replace(/\D/g,""))||0,actToStateCode:+(ship.state||s.pos)||0,toStateCode:+(s.pos||bill.state)||0,
    transactionType:sameShip?1:2,otherValue:r2(c.grand-c.taxable-c.tax),totalValue:c.taxable,cgstValue:c.cgst,sgstValue:c.sgst,igstValue:c.igst,cessValue:0,cessNonAdvolValue:0,totInvValue:c.grand,
    transporterId:e.transId||"",transporterName:e.transName||"",transDocNo:e.transDocNo||"",transMode:String(e.mode||"1"),transDistance:String(e.km||"0"),transDocDate:dmy(e.transDocDate||""),vehicleNo:(e.vehicle||"").replace(/\s|-/g,"").toUpperCase(),vehicleType:"R",mainHsnCode:+main?.hsn||0,
    itemList:items.map((it,i)=>({itemNo:i+1,productName:it.name.slice(0,100),productDesc:it.desc.slice(0,100),hsnCode:+it.hsn||0,quantity:r2(it.q),qtyUnit:String(it.unit).slice(0,3).toUpperCase(),taxableAmount:r2(it.tx),sgstRate:s.inter?0:it.g/2,cgstRate:s.inter?0:it.g/2,igstRate:s.inter?it.g:0,cessRate:0,cessNonadvol:0}))};
}
function ewbProblems(s){

  if(!B.gstin)out.push("Your GSTIN (Settings)");if(!b.fromPincode)out.push("Your shop's PIN code (Settings)");if(!b.toPincode)out.push("Customer's PIN code");

async function downloadEwbJson(list){

  const json={version:"1.0.0621",billLists:list.map(ewbBill)};
  await saveFile(`EWB_${list.length===1?fileBase(list[0]):todayISO()+"_"+list.length+"_bills"}.json`,new Blob([JSON.stringify(json,null,1)],{type:"application/json"}),"application/json");

}

  const cs={};
  const addCS=(pos,inter,rr,sign)=>{for(const r of rr){const k=pos+"|"+r.rate;(cs[k]=cs[k]||{pos,rate:r.rate,tx:0,c:0,sg:0,i:0,inter});cs[k].tx+=sign*r.tx;cs[k].c+=sign*r.c;cs[k].sg+=sign*r.sg;cs[k].i+=sign*r.i}};
  for(const s of b2csSrc)addCS(s.pos,s.inter,rateRows(docCalc(s).lines),1);

  const hsnOf=(docs,notes)=>{const h={};const add=(lines,sign)=>{for(const l of lines){const k=l.hsn+"|"+l.gst+"|"+l.unit;(h[k]=h[k]||{hsn:l.hsn,desc:l.name,unit:l.unit,rate:l.gst,q:0,tx:0,c:0,sg:0,i:0});h[k].q+=sign*l.qty;h[k].tx+=sign*l.taxable;h[k].c+=sign*l.cgst;h[k].sg+=sign*l.sgst;h[k].i+=sign*l.igst}};
    for(const s of docs)add(docCalc(s).lines,1);for(const n of notes)add(noteCalc(n).lines,-1);
    return Object.values(h).map(r=>({...r,q:Math.round(r.q*1000)/1000,tx:r2(r.tx),c:r2(r.c),sg:r2(r.sg),i:r2(r.i)})).sort((a,b)=>String(a.hsn).localeCompare(String(b.hsn)))};
  const hsnB2B=hsnOf(b2b,cnB2B),hsnB2C=hsnOf(live.filter(s=>!s.party?.gstin),cnRest);
  const series=(list,nature)=>{const g={};for(const s of list){const k=String(s.no).slice(0,String(s.no).lastIndexOf("/")+1);(g[k]=g[k]||[]).push(s)}
    return Object.values(g).map(l=>{l.sort((a,b)=>a.seq-b.seq);return {nature,from:l[0].no,to:l[l.length-1].no,total:l.length,cancel:l.filter(x=>x.status==="cancelled").length}})};
  const docs=[...series(sales,"Invoices for outward supply"),...series(S.creditNotes.filter(inR),"Credit Note")];
  return {b2b,b2cl,b2cs,cnB2B,cnB2CL,cnB2CS,hsnB2B,hsnB2C,docs,rateRows,live,sales,exp};
}

  const hs=rows=>rows.map((r,i)=>({num:i+1,hsn_sc:String(r.hsn||""),desc:String(r.desc||"").slice(0,30),user_desc:String(r.desc||"").slice(0,30),uqc:String(r.unit||"NOS").toUpperCase(),qty:r.q,rt:r.rate,txval:r.tx,iamt:r.i,camt:r.c,samt:r.sg,csamt:0}));

function outstandingData(asAt){
  const age=d=>Math.max(0,daysBetween(d,asAt)),bucket=n=>n<=30?0:n<=60?1:n<=90?2:3;
  const cnBySale={};for(const n of liveNotes("creditNotes"))if(n.refund==="adjust")cnBySale[n.srcId]=(cnBySale[n.srcId]||0)+noteCalc(n).grand;
  const rec=S.sales.filter(s=>s.status!=="cancelled"&&s.date<=asAt&&payInfo(s).status!=="paid").map(s=>{const due=r2(docCalc(s).grand-(cnBySale[s.id]||0));return {d:s,party:s.party?.name||"",phone:s.party?.phone||"",key:s.partyId||("b2c:"+(s.party?.phone||s.party?.name)),no:s.no,date:s.date,amt:due,days:age(s.date)}}).filter(r=>r.amt>0.009);
  const dnByPur={};for(const n of liveNotes("debitNotes"))if(n.refund==="adjust")dnByPur[n.srcId]=(dnByPur[n.srcId]||0)+noteCalc(n).grand;
  const pay=S.purchases.filter(p=>p.date<=asAt&&(!p.paidOn||p.paidOn>asAt)).map(p=>{const td=S.tds.find(x=>x.purchaseId===p.id),t=purTerms(p),due=r2(docCalc(p).grand-(td?num(td.tds):0)-(dnByPur[p.id]||0));return {d:p,party:p.party?.name||"",key:p.partyId,no:p.billNo,date:p.date,dueDate:t.due,amt:due,days:age(p.date),over:Math.max(0,daysBetween(t.due,asAt))}}).filter(r=>r.amt>0.009);
  const group=rows=>{const g={};for(const r of rows){const x=(g[r.key]=g[r.key]||{party:r.party,phone:r.phone,rows:[],b:[0,0,0,0],tot:0});x.rows.push(r);x.b[bucket(r.days)]+=r.amt;x.tot+=r.amt}return Object.values(g).sort((a,b)=>b.tot-a.tot)};
  return {rec,pay,recG:group(rec),payG:group(pay)};
}

let _mv=null,_mvBy=null,_mvV=-1;const _avg={v:-1,m:new Map()};
function stockMoves(){

  for(const it of S.items)if(num(it.openingStock))push(it.id,it.openingStock,"0000-01-01","main",it.openingBatch,it.openingExp,num(it.purchasePrice),"open");
  for(const p of S.purchases)for(const l of p.lines||[])push(l.itemId,l.qty,p.date,p.godown,l.batch,l.exp,num(l.rate)*(1-num(l.disc)/100),"pur",p.id);
  for(const s of S.sales)if(s.status!=="cancelled")for(const l of s.lines||[])if(!l.noStock)push(l.itemId,-num(l.qty),s.date,s.godown,l.batch,l.exp,null,"sale",s.id);
  for(const n of S.creditNotes)if(n.status!=="cancelled"&&n.restock){const src=byId("sales",n.srcId);for(const l of n.lines||[])push(l.itemId,l.qty,n.date,n.godown||src?.godown,l.batch||src?.lines?.find(x=>x.itemId===l.itemId)?.batch,l.exp,null,"cn",n.id)}
  for(const n of S.debitNotes)if(n.status!=="cancelled"&&n.restock){const src=byId("purchases",n.srcId);for(const l of n.lines||[])push(l.itemId,-num(l.qty),n.date,n.godown||src?.godown,l.batch||src?.lines?.find(x=>x.itemId===l.itemId)?.batch,l.exp,num(l.rate),"dn",n.id)}
  for(const c of S.challans)if(c.status!=="cancelled")for(const l of c.lines||[])push(l.itemId,-num(l.qty),c.date,c.godown,l.batch,l.exp,null,"dc",c.id);
  for(const t of S.transfers){if(t.status==="cancelled")continue;
    for(const l of t.lines||[]){if(t.type==="adjust")push(l.itemId,l.qty,t.date,t.godown,l.batch,l.exp,null,"adj",t.id);
      else{push(l.itemId,-num(l.qty),t.date,t.from,l.batch,l.exp,null,"tout",t.id);push(l.itemId,l.qty,t.date,t.to,l.batch,l.exp,null,"tin",t.id)}}}
  for(const pr of S.productions){if(pr.status==="cancelled")continue;push(pr.itemId,pr.qty,pr.date,pr.godown,pr.batch,pr.exp,null,"mfg",pr.id);for(const l of pr.lines||[])push(l.itemId,-num(l.qty),pr.date,pr.godown,l.batch,"",null,"mfgc",pr.id)}
  M.sort((a,b)=>a.date.localeCompare(b.date));
  _mvBy=new Map();for(const m of M){let a=_mvBy.get(m.itemId);if(!a){a=[];_mvBy.set(m.itemId,a)}a.push(m)}
  _mv=M;_mvV=DATAV;return M;
}
const movesOf=id=>{stockMoves();return _mvBy.get(id)||[]};
const isTransfer=m=>m.kind==="tout"||m.kind==="tin";
function stockOf(itemId,gd){
  let open=0,inQ=0,outQ=0;
  for(const m of movesOf(itemId)){if(gd?m.gd!==gd:isTransfer(m))continue;if(m.kind==="open")open+=m.q;else if(m.q>0)inQ+=m.q;else outQ-=m.q}
  const R=x=>Math.round(x*1000)/1000;return {open:R(open),inQ:R(inQ),outQ:R(outQ),bal:R(open+inQ-outQ)};
}
function qtyAt(itemId,date,gd){let q=0;for(const m of movesOf(itemId)){if(m.date>date)break;if(gd?m.gd!==gd:isTransfer(m))continue;q+=m.q}return q}
function batchesOf(itemId,gd){
  const b={};for(const m of movesOf(itemId)){if(gd?m.gd!==gd:isTransfer(m))continue;const k=m.batch||"";(b[k]=b[k]||{batch:k,exp:"",q:0});b[k].q+=m.q;if(m.exp&&!b[k].exp)b[k].exp=m.exp}
  return Object.values(b).map(x=>({...x,q:Math.round(x.q*1000)/1000})).sort((a,b)=>(a.exp||"9999").localeCompare(b.exp||"9999")||a.batch.localeCompare(b.batch));
}
function splitBatches(lines,gd){const out=[],used={},R=x=>Math.round(x*1000)/1000;
  for(const l of lines){const it=byId("items",l.itemId);if(!l.itemId||!feat("batches")||!it?.batchTracked||l.noStock){out.push(l);continue}
    let need=num(l.qty);const bs=batchesOf(l.itemId,gd).filter(b=>b.batch).map(b=>({...b,q:R(b.q-(used[l.itemId+"|"+b.batch]||0))}));
    const order=[...bs.filter(b=>b.batch===l.batch),...bs.filter(b=>b.batch!==l.batch)],parts=[];
    for(const b of order){if(need<=0.0001)break;if(b.q<=0)continue;const take=R(Math.min(need,b.q));parts.push({...l,batch:b.batch,exp:b.exp,qty:take});need=R(need-take);used[l.itemId+"|"+b.batch]=R((used[l.itemId+"|"+b.batch]||0)+take)}

const fefo=(itemId,gd)=>batchesOf(itemId,gd).find(b=>b.q>0&&b.batch)||null;
/* weighted average cost up to a date: opening + purchases − debit notes; manufactured goods at component cost */
function avgCost(itemId,date,depth=0){
  if(_avg.v!==DATAV){_avg.v=DATAV;_avg.m.clear()}
  const key=itemId+"|"+date;if(_avg.m.has(key))return _avg.m.get(key);
  let q=0,cost=0;
  for(const m of movesOf(itemId)){if(m.date>date)break;
    if(m.kind==="open"||m.kind==="pur"||m.kind==="dn"){q+=m.q;cost+=m.q*num(m.cost)}
    else if(m.kind==="mfg"&&depth<4){const pr=byId("productions",m.ref);q+=m.q;cost+=m.q*(pr?prodUnitCost(pr,depth+1):0)}}

function nextRun(d,every){const [y,m,dd]=d.split("-").map(Number);if(every==="weekly")return addDays(d,7);
  const add={monthly:1,quarterly:3,halfyearly:6,yearly:12}[every]||1;let mm=m-1+add,yy=y+Math.floor(mm/12);mm=mm%12;const last=new Date(yy,mm+1,0).getDate();
  return `${yy}-${String(mm+1).padStart(2,"0")}-${String(Math.min(dd,last)).padStart(2,"0")}`}
const recurDue=()=>S.recurring.filter(r=>r.active!==false&&r.nextDate<=todayISO()&&(!r.endDate||r.nextDate<=r.endDate));
const EVERY=[["weekly","Every week"],["monthly","Every month"],["quarterly","Every 3 months"],["halfyearly","Every 6 months"],["yearly","Every year"]];

   <label class="f req"><span>Next invoice date</span><input class="input" type="date" id="rc_next" value="${ex?.nextDate||nextRun(src.date,"monthly")}"></label>
   <label class="f"><span>Stop after (optional)</span><input class="input" type="date" id="rc_end" value="${ex?.endDate||""}"></label>
   <label class="check spanall"><input type="checkbox" id="rc_on"${ex?.active===false?"":" checked"}> Active</label>
  </div><p class="hint">Bill to ${esc(base.party?.name||"")} · ${money(docCalc(base).grand)} · ${base.lines.length} line${base.lines.length>1?"s":""}. When it's due, the dashboard shows it and you can create the invoice in one tap (or all due invoices at once).</p><div id="rcErr"></div>`,
  `${ex?`<button class="btn danger" id="rc_del" style="margin-right:auto">Delete</button>`:""}<button class="btn" data-close>Cancel</button><button class="btn pri" id="rc_save">Save</button>`,{narrow:true});

    const o={...(ex||{}),id:ex?.id||uid(),name,every:$("#rc_every").value,nextDate:next,endDate:$("#rc_end").value||"",active:$("#rc_on").checked,

  if($("#rc_del"))$("#rc_del").onclick=()=>confirmIn("#rcErr","Delete this recurring schedule? Invoices already made stay.",async()=>{await guard(()=>backend.remove("recurring",id));closeModal();toast("Deleted")});
}
function recurringTable(){

async function labelsPDF(list,L,priceMode){
  await loadPdfLib();await loadBarcodeLib();const {jsPDF}=window.jspdf;
  const pdf=L.page==="a4"?new jsPDF({unit:"mm",format:"a4"}):new jsPDF({unit:"mm",format:L.page,orientation:L.page[0]>L.page[1]?"landscape":"portrait"});
  const cache={};const img=code=>{if(cache[code])return cache[code];const cv=document.createElement("canvas");try{JsBarcode(cv,code,{format:/^\d{13}$/.test(code)?"EAN13":/^\d{12}$/.test(code)?"UPC":"CODE128",displayValue:false,margin:0,height:60,width:2})}catch(e){JsBarcode(cv,code,{format:"CODE128",displayValue:false,margin:0,height:60,width:2})}return cache[code]={u:cv.toDataURL("image/png"),r:cv.width/cv.height}};
  const per=L.cols*L.rows,B=S.settings;
  list.forEach((it,i)=>{const k=i%per;if(i&&k===0)pdf.addPage();const c=k%L.cols,r=Math.floor(k/L.cols);const x=L.mx+c*(L.w+L.gx),y=L.my+r*(L.h+L.gy),pad=1.8,w=L.w-2*pad;
    const code=codeOf(it);pdf.setFont("helvetica","bold");pdf.setFontSize(L.w<40?6:7.5);pdf.text(pdf.splitTextToSize(it.name,w)[0],x+pad,y+pad+2.4);
    pdf.setFont("helvetica","normal");pdf.setFontSize(5.5);if(B.name)pdf.text(pdf.splitTextToSize(B.name,w)[0],x+pad,y+pad+5);
    const bh=L.h*0.42,bi=img(code);const bw=Math.min(w,bh*bi.r*1.6);pdf.addImage(bi.u,"PNG",x+(L.w-bw)/2,y+pad+6,bw,bh);
    pdf.setFont("courier","normal");pdf.setFontSize(6.5);pdf.text(code,x+L.w/2,y+pad+6+bh+2.6,{align:"center"});
    if(priceMode!=="none"){const p=priceMode==="mrp"?(it.priceIncl?num(it.salePrice):r2(num(it.salePrice)*(1+num(it.gstRate)/100))):itemRate(it,"salePrice");pdf.setFont("helvetica","bold");pdf.setFontSize(L.w<40?7:8.5);pdf.text(`${priceMode==="mrp"?"MRP ":""}Rs. ${inr.format(p)}`,x+L.w-pad,y+L.h-pad,{align:"right"});pdf.setFont("helvetica","normal");pdf.setFontSize(5);if(priceMode==="mrp")pdf.text("incl. of all taxes",x+pad,y+L.h-pad)}});
  return pdf.output("blob");
}
const canScan=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
async function openScanner(onCode,{continuous}={}){
  if(!canScan()){toast("This device has no camera access. Use a USB / Bluetooth barcode scanner instead.");return}
  let root=document.getElementById("scanRoot");if(root)root.remove();root=document.createElement("div");root.id="scanRoot";root.className="scanov";
  root.innerHTML=`<div class="scanbox"><div class="row" style="justify-content:space-between;color:#fff"><b>Point the camera at a barcode</b><button class="x" id="scanX" style="color:#fff" aria-label="Close">×</button></div><div class="scanv"><video id="scanVid" playsinline muted></video><i></i></div><div id="scanMsg" class="hint" style="color:#cfe;min-height:18px">${continuous?"Keeps scanning: each item is added to the bill.":""}</div></div>`;
  document.body.appendChild(root);
  let stream=null,stop=false,reader=null,last="",lastT=0;
  const close=()=>{stop=true;try{reader&&reader.reset()}catch(e){}try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}root.remove()};
  $("#scanX").onclick=close;
  const hit=code=>{const now=Date.now();if(code===last&&now-lastT<1800)return;last=code;lastT=now;try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
    const ok=onCode(code);$("#scanMsg").textContent=ok===false?`No item with code ${code}`:`Added: ${code}`;if(!continuous)close()};
  const vid=$("#scanVid");
  try{
    if("BarcodeDetector" in window){
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});vid.srcObject=stream;await vid.play();
      let fm;try{fm=await BarcodeDetector.getSupportedFormats()}catch(e){fm=["ean_13","code_128","qr_code"]}const det=new BarcodeDetector({formats:fm});
      const loop=async()=>{if(stop)return;try{const r=await det.detect(vid);if(r&&r[0])hit(r[0].rawValue)}catch(e){}setTimeout(loop,200)};loop();
    }else{
      await loadZxing();reader=new ZXing.BrowserMultiFormatReader();
      await reader.decodeFromConstraints({video:{facingMode:"environment"}},vid,(res)=>{if(res&&!stop)hit(res.getText())});
    }
  }catch(e){$("#scanMsg").textContent="Camera not available: "+(e&&e.message||e)+". Allow camera access, or use a barcode scanner."}
}

async function setReco(ledger,key,bankDate){const id=hashKey(ledger+"|"+key),ex=S.reco.find(x=>x.id===id);

function parseCsv(text){const rows=[];let row=[],f="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","||c==="\t"||c===";"&&!text.includes(",")){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseDateAny(s){s=String(s||"").trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if((m=s.match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  if((m=s.match(/^(\d{1,2})[\/\-. ]([A-Za-z]{3})[A-Za-z]*[\/\-. ,]+(\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;const mo=MON[m[2].toLowerCase()];if(mo)return `${y}-${String(mo).padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  return ""}
const amtNum=s=>{s=String(s||"").replace(/[₹,\s]|INR|Rs\.?/gi,"");if(/cr$/i.test(s))return num(s);if(/dr$/i.test(s))return -num(s);return num(s)};
function parseStatement(text){
  const rows=parseCsv(text);let h=-1,cols={};
  for(let i=0;i<Math.min(rows.length,40);i++){const r=rows[i].map(x=>x.toLowerCase().trim());const di=r.findIndex(x=>/date/.test(x)&&!/value/.test(x));const dx=di>=0?di:r.findIndex(x=>/date/.test(x));
    const wd=r.findIndex(x=>/withdraw|debit|dr\b|paid out/.test(x)),dep=r.findIndex(x=>/deposit|credit|cr\b|paid in/.test(x)),am=r.findIndex(x=>/^amount|amount \(/.test(x)),ds=r.findIndex(x=>/narration|description|particular|details|remarks/.test(x)),bal=r.findIndex(x=>/balance/.test(x));
    if(dx>=0&&(wd>=0&&dep>=0||am>=0)){h=i;cols={dx,wd,dep,am,ds,bal};break}}
  if(h<0)throw new Error("Couldn't find the columns. The file needs a header row with Date and Withdrawal/Deposit (or Debit/Credit, or Amount).");
  const out=[];for(const r of rows.slice(h+1)){const date=parseDateAny(r[cols.dx]);if(!date)continue;let wd=0,dep=0;
    if(cols.wd>=0&&cols.dep>=0){wd=Math.abs(amtNum(r[cols.wd]));dep=Math.abs(amtNum(r[cols.dep]))}else{const a=amtNum(r[cols.am]);if(a<0)wd=-a;else dep=a}
    if(!wd&&!dep)continue;out.push({date,desc:(r[cols.ds]||"").trim().slice(0,160),wd:r2(wd),dep:r2(dep),bal:cols.bal>=0&&String(r[cols.bal]||"").trim()?r2(amtNum(r[cols.bal])):null})}
  if(!out.length)throw new Error("No transactions found in that file.");return out;
}
async function autoMatch(ledger){

  const lines=S.bankStmt.filter(s=>s.ledger===ledger).flatMap(s=>s.lines);const taken=new Set();let n=0;

const CF_CAT=g=>({debtors:["op","Received from customers"],sales:["op","Cash sales"],dirinc:["op","Other income"],indinc:["op","Other income"],creditors:["op","Paid to suppliers"],purchase:["op","Paid to suppliers"],direxp:["op","Expenses paid"],indexp:["op","Expenses paid"],duties:["op","Taxes paid (GST, TDS)"],curliab:["op","Salaries & other liabilities"],advances:["op","Advances given"],curassets:["op","Other current assets"],fixed:["inv","Fixed assets bought / sold"],invest:["inv","Investments"],capital:["fin","Capital introduced / drawings"],reserves:["fin","Capital introduced / drawings"],loans:["fin","Loans taken / repaid"],suspense:["op","Suspense"]}[g]||["op","Other"]);
function aCashFlow(){
  const range=acctRange(),P=buildPostings(),isCB=id=>{const g=ledgerById(id)?.group;return g==="cash"||g==="bank"};
  let open=0;for(const l of allLedgers())if(l.group==="cash"||l.group==="bank")open+=l.opening;
  const agg={};let close=open;
  for(const p of P){const cb=p.lines.filter(x=>isCB(x.l));if(!cb.length)continue;const net=cb.reduce((a,x)=>a+x.dr-x.cr,0);if(Math.abs(net)<0.005)continue;
    if(p.date<sub.from){open+=net;close+=net;continue}if(p.date>sub.to)continue;close+=net;
    const others=p.lines.filter(x=>!isCB(x.l));const tot=others.reduce((a,x)=>a+Math.abs(x.dr-x.cr),0)||1;
    for(const x of others){const share=net*Math.abs(x.dr-x.cr)/tot;const [sec,lab]=CF_CAT(ledgerById(x.l)?.group);const k=sec+"|"+lab;agg[k]=(agg[k]||0)+share}}
  const sec=s=>Object.entries(agg).filter(([k])=>k.startsWith(s+"|")).map(([k,v])=>[k.split("|")[1],r2(v)]).sort((a,b)=>b[1]-a[1]);
  const S3=[["op","Operating activities"],["inv","Investing activities"],["fin","Financing activities"]];
  const tot=s=>r2(sec(s).reduce((a,[,v])=>a+v,0));
  sub._exportDoc=()=>({title:"Cash flow statement",subtitle:`${fmtDate(sub.from)} to ${fmtDate(sub.to)} (direct method, cash and bank)`,sheets:[{name:"Cash flow",head:["Particulars","Amount"],rows:[["Opening cash & bank",r2(open)],...S3.flatMap(([k,n])=>[[n,""],...sec(k).map(([l,v])=>["   "+l,v]),["Net cash from "+n.toLowerCase(),tot(k)]]),["Closing cash & bank",r2(close)]]}]});
  return range+`<div class="tiles"><div class="tile t-buy"><span class="ib">${ic("bank")}</span><div class="k">Opening cash &amp; bank</div><div class="v">${money(open)}</div></div>${S3.map(([k,n],i)=>`<div class="tile ${["t-sales","t-stock","t-cash"][i]}"><span class="ib">${ic(["sales","inventory","rupee"][i])}</span><div class="k">${n}</div><div class="v" style="color:${tot(k)>=0?"var(--good)":"var(--bad)"}">${money(tot(k))}</div></div>`).join("")}</div>
  <div class="tablewrap"><table><tbody>${S3.map(([k,n])=>`<tr><td colspan="2" style="background:var(--sunk);font-weight:600">${n}</td></tr>${sec(k).map(([l,v])=>`<tr><td style="padding-left:26px">${esc(l)}</td><td class="num" style="color:${v<0?"var(--bad)":""}">${neg(v)}</td></tr>`).join("")||`<tr><td style="padding-left:26px" class="muted">None</td><td></td></tr>`}<tr><td><b>Net cash from ${n.toLowerCase()}</b></td><td class="num"><b>${neg(tot(k))}</b></td></tr>`).join("")}</tbody><tfoot><tr><td>Closing cash &amp; bank (${fmtDate(sub.to)})</td><td class="num">${amt(close)}</td></tr></tfoot></table></div>`;
}
function aRatios(){
  const range=acctRange(),bk=books(sub.from,sub.to),pf=plFigures(bk),d=bsData(bk,pf);
  const sumG=(gs,sign=1)=>r2(bk.list.filter(l=>gs.includes(l.group)).reduce((a,l)=>a+sign*l.close,0));
  const dutDr=r2(bk.list.filter(l=>l.group==="duties"&&l.close>0).reduce((a,l)=>a+l.close,0)),dutCr=r2(bk.list.filter(l=>l.group==="duties"&&l.close<0).reduce((a,l)=>a-l.close,0));
  const CA=r2(sumG(["debtors","cash","bank","advances","curassets"])+bk.CS+dutDr),CL=r2(sumG(["creditors","curliab"],-1)+dutCr),quick=r2(CA-bk.CS);
  const sales=pf.tot(pf.sales,pf.incAmt),purch=pf.tot(pf.purch,pf.expAmt),cogs=r2(bk.OS+purch+pf.tot(pf.direxp,pf.expAmt)-bk.CS);
  const days=Math.max(1,daysBetween(sub.from,sub.to)+1),deb=sumG(["debtors"]),cred=sumG(["creditors"],-1),avgStock=(bk.OS+bk.CS)/2;
  const equity=r2(sumG(["capital","reserves"],-1)+bk.P0+pf.NP),loans=sumG(["loans"],-1);
  const R=[["Current ratio",CL?CA/CL:null,"x","Current assets ÷ current liabilities. Above 1.5 is comfortable.",v=>v>=1.5?"good":v>=1?"warn":"bad"],
    ["Quick ratio",CL?quick/CL:null,"x","Current assets without stock ÷ current liabilities. Above 1 means bills can be paid without selling stock.",v=>v>=1?"good":v>=0.6?"warn":"bad"],
    ["Gross margin",sales?pf.GP/sales*100:null,"%","Gross profit ÷ sales.",v=>v>=20?"good":v>=8?"warn":"bad"],
    ["Net margin",sales?pf.NP/sales*100:null,"%","Net profit ÷ sales.",v=>v>=8?"good":v>=0?"warn":"bad"],
    ["Debtor days",sales?deb/sales*days:null,"days","How long customers take to pay, on average.",v=>v<=30?"good":v<=60?"warn":"bad"],
    ["Creditor days",purch?cred/purch*days:null,"days","How long you take to pay suppliers.",v=>v<=45?"good":v<=75?"warn":"bad"],
    ["Stock days",cogs>0?avgStock/cogs*days:null,"days","How many days of sales your stock covers.",v=>v<=60?"good":v<=120?"warn":"bad"],
    ["Stock turnover",avgStock>0?cogs/avgStock:null,"x","Times stock is sold and replaced in the period.",v=>v>=4?"good":v>=2?"warn":"bad"],
    ["Debt to equity",equity>0?loans/equity:null,"x","Borrowings ÷ owner's funds. Below 1 is safer.",v=>v<=1?"good":v<=2?"warn":"bad"],
    ["Return on capital",equity>0?pf.NP/equity*100:null,"%","Net profit ÷ owner's funds for the period.",v=>v>=15?"good":v>=5?"warn":"bad"]];
  sub._exportDoc=()=>({title:"Financial ratios",subtitle:`${fmtDate(sub.from)} to ${fmtDate(sub.to)}`,sheets:[{name:"Ratios",head:["Ratio","Value","Meaning"],rows:R.map(([n,v,u,m])=>[n,v==null?"—":`${r2(v)} ${u}`,m])}]});
  return range+`<div class="tiles">${R.map(([n,v,u,m,f])=>`<div class="tile" style="display:block"><div class="k">${n}</div><div class="v">${v==null||!isFinite(v)?"—":`${u==="%"?r2(v).toFixed(1):u==="days"?Math.round(v):r2(v).toFixed(2)}<span style="font-size:13px;color:var(--muted)"> ${u}</span>`}</div><div class="n">${v==null||!isFinite(v)?"Not enough data":`<span class="chip ${f(v)}">${{good:"Healthy",warn:"Watch",bad:"Needs attention"}[f(v)]}</span>`} ${m}</div></div>`).join("")}</div>
  <p class="hint">Working capital: ${money(CA-CL)} · Stock at ${fmtDate(sub.to)}: ${money(bk.CS)} · Owner's funds: ${money(equity)}. Ratios are a guide for small businesses; industries differ.</p>`;
}

const PF_CAP=15000,ESI_LIMIT=21000;
function payCalc(e,days,paid,x={}){
  const f=days?Math.min(1,num(paid)/days):0,basic=r2(num(e.basic)*f),hra=r2(num(e.hra)*f),oth=r2(num(e.other)*f),bonus=r2(num(x.bonus)),gross=r2(basic+hra+oth+bonus);
  const pfW=Math.min(basic,PF_CAP),pfE=e.pfOn?Math.round(pfW*0.12):0,pfR=e.pfOn?Math.round(pfW*0.12):0;
  const esiOk=e.esiOn&&num(e.basic)+num(e.hra)+num(e.other)<=ESI_LIMIT,esiE=esiOk?Math.ceil(r2(gross*0.0075)-1e-9):0,esiR=esiOk?Math.ceil(r2(gross*0.0325)-1e-9):0;
  const pt=num(paid)>0?num(x.pt??e.pt):0,tds=num(paid)>0?num(x.tds??e.tds):0,adv=num(x.adv),ded=r2(pfE+esiE+pt+tds+adv);
  return {basic,hra,oth,bonus,gross,pfE,pfR,esiE,esiR,pt,tds,adv,ded,net:r2(gross-ded)};
}

  const rows=[...S.employees].sort((a,b)=>(a.active===false)-(b.active===false)||a.name.localeCompare(b.name));

function openPayrun(id){
  const ex=id?byId("payruns",id):null;const prev=monthRange(-1)[0].slice(0,7);
  const st={month:ex?.month||prev};
  const build=()=>{const [y,m]=st.month.split("-").map(Number),days=new Date(y,m,0).getDate();const old=new Map((ex?.rows||[]).map(r=>[r.empId,r]));
    return S.employees.filter(e=>e.active!==false||old.has(e.id)).map(e=>{const o=old.get(e.id)||{};return {empId:e.id,name:e.name,days,paid:o.paid??days,bonus:o.bonus||0,adv:o.adv||0}})};
  st.rows=build();
  if(!st.rows.length){toast("Add employees first");return}
  openModal(ex?`Salary · ${monthName(ex.month)}`:"Run salary",`<div class="row" style="gap:12px;align-items:flex-end;margin-bottom:12px"><label class="f" style="width:180px"><span>Month</span><input class="input" type="month" id="pr_month" value="${st.month}"${ex?" disabled":""}></label><span class="hint">Edit paid days for leave without pay. Bonus and advance recovery are optional.</span></div><div id="pr_rows"></div><div id="prErr"></div>`,
   `${ex?`<button class="btn danger" id="pr_del" style="margin-right:auto">Delete</button>`:""}<button class="btn" data-close>Cancel</button><button class="btn pri" id="pr_save">${ex?"Save":"Post salary"}</button>`,{wide:true});
  const draw=()=>{let T={gross:0,ded:0,net:0,pfR:0,esiR:0};const rs=st.rows.map((r,i)=>{const e=byId("employees",r.empId)||{};const c=payCalc(e,r.days,r.paid,r);for(const k in T)T[k]+=c[k];return `<tr data-i="${i}"><td><b>${esc(r.name)}</b><div class="hint">${money(num(e.basic)+num(e.hra)+num(e.other))} / month</div></td><td><input class="input" type="number" step="0.5" min="0" max="${r.days}" data-k="paid" value="${r.paid}" style="width:70px;text-align:right"> <span class="hint">/ ${r.days}</span></td><td class="num">${amt(c.gross-c.bonus)}</td><td><input class="input" type="number" min="0" data-k="bonus" value="${r.bonus||""}" style="width:90px;text-align:right"></td><td class="num" title="PF ${c.pfE} · ESI ${c.esiE} · PT ${c.pt} · TDS ${c.tds}">${amt(c.pfE+c.esiE+c.pt+c.tds)}<div class="hint">PF ${c.pfE} · ESI ${c.esiE} · PT ${c.pt}${c.tds?` · TDS ${c.tds}`:""}</div></td><td><input class="input" type="number" min="0" data-k="adv" value="${r.adv||""}" style="width:90px;text-align:right"></td><td class="num"><b>${amt(c.net)}</b></td></tr>`}).join("");
    $("#pr_rows").innerHTML=`<div class="tablewrap"><table class="lines"><thead><tr><th>Employee</th><th>Paid days</th><th class="num">Earned</th><th class="num">Bonus</th><th class="num">Statutory deductions</th><th class="num">Advance recovered</th><th class="num">Net pay</th></tr></thead><tbody>${rs}</tbody><tfoot><tr><td colspan="2">Total</td><td class="num">${amt(T.gross)}</td><td></td><td class="num">${amt(T.ded)}</td><td></td><td class="num">${amt(T.net)}</td></tr></tfoot></table></div><p class="hint">Employer contribution (PF + ESI): ${money(T.pfR+T.esiR)} · total cost ${money(T.gross+T.pfR+T.esiR)}</p>`};
  draw();
  if(!ex)$("#pr_month").onchange=e=>{st.month=e.target.value;st.rows=build();draw()};
  $("#pr_rows").addEventListener("change",e=>{const tr=e.target.closest("tr[data-i]");if(!tr)return;st.rows[+tr.dataset.i][e.target.dataset.k]=num(e.target.value);draw()});
  $("#pr_save").onclick=async()=>{if(!ex&&S.payruns.some(r=>r.month===st.month)){$("#prErr").innerHTML=`<div class="err">Salary for ${monthName(st.month)} is already posted. Open it from the Salary tab to change it.</div>`;return}
    const rows=st.rows.map(r=>{const e=byId("employees",r.empId)||{};const c=payCalc(e,r.days,r.paid,r);return {...r,...c,pt:c.pt,tds:c.tds,code:e.code||"",designation:e.designation||""}});
    const o={...(ex||{}),id:ex?.id||uid(),month:st.month,date:lastDay(st.month),rows,status:"posted"};
    await guard(()=>backend.put("payruns",o));closeModal();toast(`Salary for ${monthName(st.month)} posted`);openPayrunView(o.id)};
  if($("#pr_del"))$("#pr_del").onclick=()=>confirmIn("#prErr","Delete this salary run? Its accounting entries are removed too.",async()=>{await guard(()=>backend.remove("payruns",id));closeModal();toast("Deleted")});
}

async function payslipsPDF(r,only){

    pdf.setFillColor(10,74,67);pdf.rect(0,0,W,5,"F");pdf.setFont("helvetica","bold");pdf.setFontSize(14);pdf.text(B.name||"",M,16);pdf.setFont("helvetica","normal");pdf.setFontSize(8.5);pdf.text([B.address,STATE_NAME[B.state]].filter(Boolean).join(", "),M,21);
    pdf.setFont("helvetica","bold");pdf.setFontSize(12);pdf.setTextColor(10,74,67);pdf.text(`Payslip · ${monthName(r.month)}`,W-M,16,{align:"right"});pdf.setTextColor(0);
    pdf.autoTable({startY:27,margin:{left:M,right:M},theme:"grid",styles:{fontSize:8.5,cellPadding:1.8},body:[["Employee",x.name,"Code",e.code||""],["Designation",e.designation||"","Date of joining",fmtDate(e.joinDate||"")],["PAN",e.pan||"","UAN",e.uan||""],["ESIC no",e.esic||"","Bank",e.bank||""],["Days in month",String(x.days),"Paid days",String(x.paid)]],columnStyles:{0:{fontStyle:"bold",fillColor:[243,247,246]},2:{fontStyle:"bold",fillColor:[243,247,246]}}});

    const rows=[];for(let i=0;i<Math.max(E.length,D.length);i++)rows.push([E[i]?.[0]||"",E[i]?n(E[i][1]):"",D[i]?.[0]||"",D[i]?n(D[i][1]):""]);

    let y=pdf.lastAutoTable.finalY+8;pdf.setFont("helvetica","bold");pdf.setFontSize(12);pdf.text(`Net pay: Rs. ${n(x.net)}`,M,y);pdf.setFont("helvetica","normal");pdf.setFontSize(9);pdf.text(`(Rupees ${words(x.net)} Only)`,M,y+5);

  return pdf.output("blob");
}

function i18nWalk(root){if(LANG!=="hi"||!root)return;const skip=el=>el.closest&&el.closest(".inv,[data-noi18n],textarea,script,style");
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){const t=n.nodeValue,k=t.trim();if(!k||!I18N_HI[k])continue;if(skip(n.parentElement))continue;n.nodeValue=t.replace(k,I18N_HI[k])}
  root.querySelectorAll&&root.querySelectorAll("[placeholder],[title],[aria-label]").forEach(el=>{for(const a of ["placeholder","title","aria-label"]){const v=el.getAttribute(a);if(v&&I18N_HI[v])el.setAttribute(a,I18N_HI[v])}})}
function startI18n(){if(LANG!=="hi")return;document.documentElement.lang="hi";const mo=new MutationObserver(ms=>{mo.disconnect();for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===1)i18nWalk(n);else if(n.nodeType===3&&n.parentElement)i18nWalk(n.parentElement)}obs()});const obs=()=>mo.observe(document.body,{childList:true,subtree:true});i18nWalk(document.body);obs()}

function greeting(){const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening"}
function quickActions(){
  const A=[["newSale","New invoice","sales","sales.create","qa-sale"],["newPurchase","Purchase","purchases","purchases.edit","qa-buy"],["newQuote","Quotation","gst","sales.create","qa-q"],
    ["goCollect","Collect payment","rupee","sales.payment","qa-pay"],["newExpense","Expense","cash","accounts.edit","qa-exp"],["stockCount","Stock count","inventory","items.edit","qa-stock"],
    ...(feat("barcode")?[["scanBill","Scan & bill","scan","sales.create","qa-scan"],["labels","Labels","items","items.view","qa-lbl"]]:[]),
    ...(feat("orders")?[["newPO","Purchase order","vendors","purchases.edit","qa-po"]]:[]),...(feat("payroll")?[["newPayrun","Run salary","payroll","accounts.edit","qa-pr"]]:[])];
  return A.filter(a=>can(a[3])).slice(0,8);
}
function attention(){
  const t=todayISO(),out=[];
  const low=S.items.filter(it=>stockOf(it.id).bal<=num(it.reorderLevel));if(low.length)out.push(["warn","inventory",`${low.length} item${low.length>1?"s":""} at or below reorder level`,`data-go="inventory"`,"View stock"]);
  if(feat("batches")){let e=0,x=0;for(const it of S.items.filter(i=>i.batchTracked))for(const b of batchesOf(it.id))if(b.q>0&&b.exp){const d=daysBetween(t,b.exp);if(d<0)x++;else if(d<=30)e++}
    if(x)out.push(["bad","clock",`${x} batch${x>1?"es have":" has"} expired: remove from shelf`,`data-go-inv="batches"`,"Review"]);if(e)out.push(["warn","clock",`${e} batch${e>1?"es expire":" expires"} within 30 days`,`data-go-inv="batches"`,"Review"])}
  const rd=recurDue();if(rd.length)out.push(["b2b","clock",`${rd.length} recurring invoice${rd.length>1?"s are":" is"} due`,`data-act="recurAll"`,"Create now"]);
  const od=S.sales.filter(s=>s.status!=="cancelled"&&payInfo(s).status!=="paid"&&daysBetween(s.date,t)>30);if(od.length)out.push(["bad","rupee",`${money(od.reduce((a,s)=>a+docCalc(s).grand,0))} unpaid for over 30 days (${od.length} invoice${od.length>1?"s":""})`,`data-go-rep="outstanding"`,"Send reminders"]);
  const vd=S.purchases.filter(p=>!p.paidOn&&daysBetween(t,purTerms(p).due)<=7);if(vd.length)out.push(["warn","purchases",`${vd.length} vendor bill${vd.length>1?"s":""} due within a week${vd.some(p=>purTerms(p).msme)?" (includes MSME)":""}`,`data-go="purchases"`,"View"]);
  const ew=S.sales.filter(s=>ewbNeeded(s)&&!s.ewb?.no&&s.date>=addDays(t,-7));if(ew.length)out.push(["warn","gst",`${ew.length} invoice${ew.length>1?"s need":" needs"} an e-way bill`,`data-goewb="1"`,"Open"]);
  const d=+t.slice(8,10);if(S.settings.gstin&&!compo()){if(d<=11)out.push(["b2b","gst",`GSTR-1 for last month is due on the 11th (${11-d} day${11-d===1?"":"s"} left)`,`data-go="gst"`,"Prepare"]);else if(d<=20)out.push(["b2b","gst",`GSTR-3B for last month is due on the 20th (${20-d} day${20-d===1?"":"s"} left)`,`data-go3b="1"`,"Prepare"])}
  if(feat("payroll")&&S.employees.some(e=>e.active!==false)){const pm=monthRange(-1)[0].slice(0,7);if(!S.payruns.some(r=>r.month===pm))out.push(["b2b","payroll",`Salary for ${monthName(pm)} not run yet`,`data-act="newPayrun"`,"Run salary"])}
  const so=S.salesOrders.filter(x=>x.status==="open"&&x.dueDate&&x.dueDate<=addDays(t,2));if(so.length)out.push(["warn","sales",`${so.length} sales order${so.length>1?"s":""} due for delivery`,`data-go-sales="so"`,"View"]);
  return out;
}
function salesSpark(){

  const W=560,H=120,bw=W/14;
  return `<svg viewBox="0 0 ${W} ${H+22}" style="width:100%;height:auto;display:block" role="img" aria-label="Sales for the last 14 days">${v.map((x,i)=>{const h=Math.max(2,x/mx*H);return `<g><title>${fmtDate(days[i])}: ${money(x)}</title><rect x="${i*bw+5}" y="${H-h}" width="${bw-10}" height="${h}" rx="4" fill="${days[i]===t?"var(--saffron)":"var(--accent)"}" opacity="${x?1:.25}"></rect><text x="${i*bw+bw/2}" y="${H+15}" text-anchor="middle" font-size="10" fill="var(--muted)">${days[i].slice(8)}</text></g>`}).join("")}</svg>`;

  <div class="qa">${qa.map(([k,l,icn,,cls])=>`<button class="qab ${cls}" data-act="${k}"><span class="ib">${ic(icn)}</span><span>${l}</span></button>`).join("")}</div>

function openSearch(){
  const pages=VIEWS.filter(v=>v[0]!=="sep"&&viewAllowed(v[0])&&navOk(v[0])).map(v=>({t:"Go to "+v[1],k:"page",v:v[0],icn:v[0]}));
  const acts=[["newSale","New sales invoice","sales"],["newPurchase","New purchase","purchases"],["newQuote","New quotation","gst"],["newItem","Add item","items"],["newCustomer","Add customer","customers"],["newVendor","Add vendor","vendors"],["newExpense","Record expense","cash"],["stockCount","Stock count","inventory"],...(feat("orders")?[["newPO","New purchase order","vendors"],["newSO","New sales order","sales"],["newDC","New delivery challan","vendors"]]:[]),...(feat("barcode")?[["labels","Print barcode labels","scan"]]:[]),...(feat("payroll")?[["newPayrun","Run salary","payroll"]]:[])].map(([a,t,icn])=>({t,k:"act",a,icn}));
  openModal("Search",`<input class="input" id="gs_q" placeholder="Invoice no, customer, item, mobile, or what you want to do…" autocomplete="off" style="font-size:16px;min-height:46px"><div id="gs_res" class="gsres"></div>`,"",{});
  let sel=0,res=[];
  const run=()=>{const q=$("#gs_q").value.trim().toLowerCase();const m=x=>x.toLowerCase().includes(q);res=[];
    if(!q)res=[...acts.slice(0,6),...pages.slice(0,6)];else{
      res.push(...acts.filter(a=>m(a.t)),...pages.filter(p=>m(p.t)));
      res.push(...S.sales.filter(s=>m(s.no+" "+(s.party?.name||"")+" "+(s.party?.phone||""))).slice(-8).reverse().map(s=>({t:`${s.no} · ${s.party?.name||""}`,sub:`${fmtDate(s.date)} · ${money(docCalc(s).grand)}`,k:"sale",id:s.id,icn:"sales"})));
      res.push(...S.items.filter(i=>m(i.name+" "+i.sku+" "+(i.barcode||"")+" "+i.hsn)).slice(0,8).map(i=>({t:i.name,sub:`${i.sku} · stock ${qtyf(stockOf(i.id).bal)} ${i.unit} · ${money(num(i.salePrice))}`,k:"item",id:i.id,icn:"items"})));
      res.push(...S.customers.filter(c=>m(c.name+" "+(c.phone||"")+" "+(c.gstin||""))).slice(0,6).map(c=>({t:c.name,sub:"Customer "+(c.phone||c.gstin||""),k:"cust",id:c.id,icn:"customers"})));
      res.push(...S.vendors.filter(c=>m(c.name+" "+(c.phone||"")+" "+(c.gstin||""))).slice(0,6).map(c=>({t:c.name,sub:"Vendor "+(c.phone||c.gstin||""),k:"vend",id:c.id,icn:"vendors"})));
      res.push(...S.purchases.filter(p=>m(p.billNo+" "+(p.party?.name||""))).slice(-5).map(p=>({t:`Bill ${p.billNo} · ${p.party?.name||""}`,sub:fmtDate(p.date),k:"pur",id:p.id,icn:"purchases"})))}
    sel=Math.min(sel,Math.max(0,res.length-1));
    $("#gs_res").innerHTML=res.length?res.slice(0,30).map((r,i)=>`<button class="gsr${i===sel?" on":""}" data-gi="${i}">${ic(r.icn)}<span><b>${esc(r.t)}</b>${r.sub?`<small>${esc(r.sub)}</small>`:""}</span></button>`).join(""):`<div class="empty">Nothing found for “${esc(q)}”.</div>`};
  const pick=i=>{const r=res[i];if(!r)return;closeModal();
    if(r.k==="page")go(r.v);else if(r.k==="act")doAct(r.a);else if(r.k==="sale")viewSale(r.id);else if(r.k==="item")openItemForm(r.id);else if(r.k==="cust")openPartyForm("customers",r.id);else if(r.k==="vend")openPartyForm("vendors",r.id);else if(r.k==="pur")openPurchaseForm(r.id)};
  $("#gs_q").addEventListener("input",()=>{sel=0;run()});
  $("#gs_q").addEventListener("keydown",e=>{if(e.key==="ArrowDown"){sel=Math.min(res.length-1,sel+1);run();e.preventDefault()}else if(e.key==="ArrowUp"){sel=Math.max(0,sel-1);run();e.preventDefault()}else if(e.key==="Enter"){pick(sel);e.preventDefault()}});

    if(g&&!gstinChecksumOk(g)){$("#stErr").innerHTML=`<div class="err">This GSTIN fails the checksum test, so one character is probably mistyped. Check it against your registration certificate.</div>`;return}

    const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=async()=>{
      const max=640,k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
      const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
      let data=cv.toDataURL("image/png");if(data.length>180000)data=cv.toDataURL("image/jpeg",0.9);

  if($("#stmtFile"))$("#stmtFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const lines=parseStatement(String(rd.result));await guard(()=>backend.put("bankStmt",{id:uid(),ledger:sub.bank,importedAt:new Date().toISOString(),file:f.name,lines}));toast(`${lines.length} statement lines imported`);await autoMatch(sub.bank)}catch(err){toast(err.message||"Could not read that file")}};rd.readAsText(f)};

  for(const [id,k,f] of [["#g2bSel","g2b",String],["#g9FY","fy",Number],["#bwSel","bw",Number],["#iledSel","iid",String]]){const el=$(id);if(el)el.onchange=()=>{sub[k]=f(el.value);renderView()}}
  m.querySelectorAll("[data-feat]").forEach(el=>el.addEventListener("change",async()=>{const k=el.dataset.feat;await guard(()=>backend.saveSettings({...S.settings,features:{...(S.settings.features||{}),[k]:el.checked}}));toast(`${FEATURES.find(f=>f[0]===k)[1]}: ${el.checked?"on":"off"}`)}));
  if($("#st_scheme"))$("#st_scheme").onchange=e=>{$("#st_compBox").hidden=e.target.value!=="composition"};
  {const el=$("#cq_amt");if(el){const w=()=>{$("#cq_words").textContent=num(el.value)?chqWords(num(el.value)):""};el.addEventListener("input",w);w()}}
  if($("#restoreF"))$("#restoreF").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.items))throw 0;
    $("#dataMsg").innerHTML=`<div class="confirm"><span>Restore ${d.items.length} items, ${d.customers?.length||0} customers, ${d.vendors?.length||0} vendors, ${d.purchases?.length||0} purchases and ${d.sales?.length||0} invoices? Existing records with the same IDs are overwritten.</span><button class="btn sm danger" id="doRestore">Restore</button></div>`;
    $("#doRestore").onclick=async()=>{for(const c of COLLS)for(const o of d[c]||[])await backend.put(c,o);if(d.settings)await backend.saveSettings(d.settings);if(d.counters)await backend.resetCounters(d.counters);$("#dataMsg").innerHTML="";toast("Backup restored")}}catch(err){$("#dataMsg").innerHTML=`<div class="err">That file is not a Ledgerbook backup.</div>`}};rd.readAsText(f)};

$("#main").addEventListener("click",async e=>{

  if(t.dataset.newdoc)return openSaleForm({docKind:t.dataset.newdoc});

  if(t.dataset.recurRun){const r=byId("recurring",t.dataset.recurRun);if(r)runRecurring(r,false);return}
  if(t.dataset.recurEdit)return openRecurringForm(null,t.dataset.recurEdit);
  if(t.dataset.itab){sub={itab:t.dataset.itab,iid:sub.iid};return renderView()}
  if(t.dataset.iled)return go("inventory",{itab:"ledger",iid:t.dataset.iled});
  if(t.dataset.bf){sub.bf=t.dataset.bf;return renderView()}
  if(t.dataset.cancelTr){const x=byId("transfers",t.dataset.cancelTr);if(x){await guard(()=>backend.put("transfers",{...x,status:"cancelled"}));toast(`${x.no} undone`)}return}
  if(t.dataset.cancelProd){const x=byId("productions",t.dataset.cancelProd);if(x){await guard(()=>backend.put("productions",{...x,status:"cancelled"}));toast(`${x.no} undone`)}return}
  if(t.dataset.btab){sub={btab:t.dataset.btab,bank:sub.bank};return renderView()}
  if(t.dataset.ball!==undefined){sub.ball=t.dataset.ball;return renderView()}
  if(t.dataset.recoToday){await setReco(sub.bank,t.dataset.recoToday,t.dataset.d);return}
  if(t.dataset.stmtAdd){const [sid,i]=t.dataset.stmtAdd.split(":");const l=byId("bankStmt",sid)?.lines[+i];if(!l)return;return openVoucherForm(l.dep?"Receipt":"Payment",null,{date:l.date,amount:l.dep||l.wd,[l.dep?"dr":"cr"]:sub.bank,narration:l.desc})}
  if(t.dataset.chq){const c=JSON.parse(t.dataset.chq);$("#cq_payee").value=c.p;$("#cq_amt").value=c.a;$("#cq_amt").dispatchEvent(new Event("input"));window.scrollTo(0,0);toast("Cheque filled in: check and print");return}
  if(t.dataset.gtab){sub={gtab:t.dataset.gtab,g2b:sub.g2b};return renderView()}
  if(t.dataset.cq){sub.cq=+t.dataset.cq;return renderView()}
  if(t.dataset.ptb){sub={ptb:t.dataset.ptb};return renderView()}
  if(t.dataset.emp)return openEmpForm(t.dataset.emp);
  if(t.dataset.payrun)return openPayrunView(t.dataset.payrun);
  if(t.dataset.slips){const r=byId("payruns",t.dataset.slips);if(r)payslipsPDF(r).then(b=>saveFile(`payslips_${r.month}.pdf`,b,"application/pdf"));return}
  if(t.dataset.payStat){const bal=r2(-(books(fyStart(todayISO()),todayISO()).map[t.dataset.payStat]?.close||0));return openVoucherForm("Payment",null,{dr:t.dataset.payStat,cr:"sys:bank",amount:bal,narration:"Statutory dues deposited"})}
  if(t.dataset.goInv)return go("inventory",{itab:t.dataset.goInv});
  if(t.dataset.goRep)return go("reports",{tab:t.dataset.goRep});
  if(t.dataset.goSales)return go("sales",{stab:t.dataset.goSales});
  if(t.dataset.coOpen)return switchCompany(t.dataset.coOpen);
  if(t.dataset.coDel){const id=t.dataset.coDel;return confirmIn("#coMsg","Delete this company and all its books on this device? This can't be undone. Take a backup first if unsure.",()=>{try{indexedDB.deleteDatabase("ledgerbook_"+id);localStorage.removeItem("ledgerbook_v1_"+id)}catch(e){}saveCompanies(companies().filter(c=>c.id!==id));renderView();toast("Company deleted")})}
  if(t.dataset.leadd){$("#"+t.dataset.leadd).insertAdjacentHTML("beforeend",`<div class="row le" style="flex-wrap:nowrap;margin-top:6px"><input class="input" placeholder="${esc(t.dataset.ph||"")}"><button class="x" type="button" data-ledel>×</button></div>`);return}
  if(t.dataset.ledel!==undefined){t.closest(".le").remove();return}
  if(t.dataset.audit!==undefined)return openAuditDetail(+t.dataset.audit);
  if(t.dataset.editVoucher)return openVoucherForm(null,t.dataset.editVoucher);
  if(t.dataset.payPur){const pu=byId("purchases",t.dataset.payPur);if(pu){await guard(()=>backend.put("purchases",{...pu,paidOn:todayISO()}));toast(`Bill ${pu.billNo} marked paid today`)}return}
  if(t.dataset.range){const [a,b]=t.dataset.range.split(",");sub.from=a;sub.to=b;return renderView()}
  if(t.dataset.editItem)return openItemForm(t.dataset.editItem);
  if(t.dataset.editParty){const [c,id]=t.dataset.editParty.split(":");return openPartyForm(c,id)}
  if(t.dataset.viewSale)return viewSale(t.dataset.viewSale);
  if(t.dataset.viewPur)return openPurchaseForm(t.dataset.viewPur);
  const a=t.dataset.act;if(!a)return;
  if(a==="newItem")openItemForm();
  if(a==="newSale")openSaleForm();
  if(a==="newPurchase")openPurchaseForm();
  if(a==="newCustomer")openPartyForm("customers");
  if(a==="newVendor")openPartyForm("vendors");
  if(a==="newTds")openTdsForm();
  if(a==="newLedger")openLedgerForm();
  if(a==="newUser")return openUserForm();
  if(a==="newQuote")return openSaleForm({quote:true});
  if(["newSO","newDC","newPO","newExpense","stockCount","labels","newPayrun","goCollect","scanBill","search","transfer","production","newEmp"].includes(a)&&doAct(a))return;
  if(a==="recurAll"){const due=recurDue();if(!due.length)return;let n=0;for(const r of due){try{await runRecurring(r,true);n++}catch(e){}}toast(`${n} recurring invoice${n===1?"":"s"} created (payment pending)`);return}
  if(a==="newLedgerBank")return openLedgerForm(null,"bank");
  if(a==="autoMatch")return autoMatch(sub.bank);
  if(a==="chqPdf"||a==="chqPrint"){const c=chequeData();if(!c.payee||c.amount<=0){toast("Enter the payee and amount");return}if(a==="chqPrint")return NATIVE.printHtml(`<!doctype html><html><head><meta charset="utf-8"></head><body>${chequeHTML(c)}</body></html>`,"Cheque");return saveFile(`cheque_${fileSafe(c.payee)}_${c.date}.pdf`,await chequePDF(c),"application/pdf")}
  if(a==="chqSave"){await guard(()=>backend.saveSettings({...S.settings,chqDx:num($("#cq_dx").value),chqDy:num($("#cq_dy").value),chqPaper:$("#cq_paper").value}));toast("Alignment saved");return}
  if(a==="saveBudgets"){const b={...(S.settings.budgets||{})};$("#main").querySelectorAll("[data-bud]").forEach(i=>{if(i.value==="")delete b[i.dataset.bud];else b[i.dataset.bud]=num(i.value)});await guard(()=>backend.saveSettings({...S.settings,budgets:b}));toast("Budgets saved");return}
  if(a==="saveMore")return saveMore();
  if(a==="coAdd"){const nm=$("#co_name").value.trim();if(!nm){toast("Enter the company name");return}const cur=companyId();let list=companies();if(!list.some(c=>c.id===cur))list.unshift({id:cur,name:""});list=list.map(c=>c.id===cur?{...c,name:S.settings.name||c.name}:c);const id="co"+uid();list.push({id,name:nm});saveCompanies(list);switchCompany(id);return}
  if(a==="hideSetup"){try{localStorage.setItem("lb_hideSetup","1")}catch(e){}return renderView()}
  if(a==="gstr1json"||a==="gstr1jsonThis")return downloadGstr1Json(t.dataset.f,t.dataset.t);
  if(a==="ewbBulk"){const list=S.sales.filter(inRange).filter(x=>ewbNeeded(x)&&!x.ewb?.no);return downloadEwbJson(list)}
  if(a==="einvBulk"){const list=S.sales.filter(inRange).filter(x=>x.status!=="cancelled"&&x.party?.gstin&&!x.irn?.irn);const bad=list.find(x=>einvProblems(x).length);if(bad){toast(`${bad.no}: add ${einvProblems(bad).join(", ")}`);return}return saveFile(`EINV_${todayISO()}_${list.length}.json`,new Blob([JSON.stringify(list.map(einvJson),null,1)],{type:"application/json"}),"application/json")}
  if(a==="connect")return openConnectForm();
  if(a==="signOut")return signOut();
  if(a==="changePw")return openPasswordForm();
  if(a==="uploadLocal")return uploadLocalData();
  if(a==="disconnect"){return confirmIn("#dataMsg","Stop using the server on this device? You'll go back to the offline books saved on this device. Nothing on the server is deleted.",()=>{try{backend.close()}catch(e){}srvSave(null);location.reload()})}
  if(a==="hostStart"){try{await NATIVE.serverStart();toast("Server started")}catch(e){toast("Couldn't start the server: "+(e.message||e))}return refreshHostBox()}
  if(a==="hostStop"){await NATIVE.serverStop();toast("Server stopped");return refreshHostBox()}

  if(a==="backup"){const counters={};for(const s of S.sales)counters[s.fy]=Math.max(counters[s.fy]||0,num(s.seq));saveFile(`ledgerbook-backup_${todayISO()}.json`,JSON.stringify({app:"ledgerbook",v:2,at:new Date().toISOString(),settings:S.settings,counters:{...counters,...S.counters},...Object.fromEntries(COLLS.map(c=>[c,S[c]]))},null,1),"application/json")}
  if(a==="clearSample"){confirmIn("#dataMsg","Remove every record marked Sample? Real records stay.",async()=>{

window.__onBack=()=>{if($("#modalRoot").firstChild){closeModal();return true}if(view!=="dashboard"){go("dashboard");return true}return false};
/* ---------- boot ---------- */
(async function boot(){
  try{const h=(location.hash||"").slice(1);if(VIEWS.some(v=>v[0]===h))view=h}catch(e){}
  let cfg=srvCfg();
  // opened from a Ledgerbook Server in a web browser: use that server automatically
  if(!cfg&&!NATIVE&&!window.claude&&/^https?:$/.test(location.protocol)){try{const r=await fetch(location.origin+"/api/health");const h=await r.json();if(h&&h.name==="Ledgerbook Server"){cfg={url:location.origin};srvSave(cfg)}}catch(e){}}
  if(cfg&&cfg.url){
    SRV=cfg;
    if(!cfg.token){let setup=false;try{setup=(await api("/api/health",{url:cfg.url,token:null})).setup}catch(e){}return showGate({url:cfg.url,setup})}
    try{const me=await api("/api/me");ME=me.user;RIGHTS_DEF=me.rights;ROLES_DEF=me.roles;backend=serverBackend();await backend.init()}
    catch(e){if(e.code==="auth")return;return showGate({url:cfg.url,msg:e.message})}
    setConn(true);
  }else{
    let db=null;
    if(!NATIVE&&window.claude&&typeof window.claude.use==="function"){
      try{db=await window.claude.use("db")}catch(e){db=null}
      try{downloadsNS=await window.claude.use("downloads")}catch(e){}
    }
    if(db){backend=dbBackend(db);$("#storeDot").className="dot ok";$("#storeText").textContent="Saved to this page's storage · synced"}
    else{backend=await localBackend();$("#storeDot").className="dot "+(NATIVE?"ok":"local");$("#storeText").textContent=NATIVE?`Saved on this ${DEVICE}`:"Saved in this browser only";}
    if(DESKTOP&&NATIVE.serverInfo){try{const i=await NATIVE.serverInfo();if(i.running){/* hosting but not signed in: nudge from Settings */}}catch(e){}}
  }
  if(NATIVE)setTimeout(()=>loadPdfLib().catch(()=>{}),1500);
  if(backend?.kind==="local"){const cur=companyId();let cs=companies();if(!cs.some(c=>c.id===cur))cs.push({id:cur,name:""});const me=cs.find(c=>c.id===cur);if(me.name&&!S.settings.name)await backend.saveSettings({...S.settings,name:me.name}).catch(()=>{});saveCompanies(cs.map(c=>c.id===cur?{...c,name:S.settings.name||c.name}:c))}
  READY=true;renderShell();renderView();startI18n();
})();
