<style>
/* Layout: shop counter console — deep-teal brand rail with icon nav (top bar on phones/portrait tablets),
   white work sheet with a sticky action bar; colour encodes money flow: teal sales, blue purchases, amber stock, violet UPI. */
:root{
  --bg:#EDF2F1; --surface:#FFFFFF; --sunk:#F3F7F6; --ink:#0F2825; --muted:#587069; --line:#D8E2DF;
  --brand:#0A4A43; --brand-2:#0E5E55; --brand-ink:#EAF5F2; --brand-muted:#9DC6BD; --brand-line:#1B6A60;
  --accent:#0E7A6B; --accent-ink:#FFFFFF; --accent-soft:#DCF1EB; --accent-strong:#0A5F53;
  --saffron:#F2A007; --saffron-soft:#FFF1D6; --saffron-ink:#7A4E00;
  --blue:#2D6BE0; --blue-soft:#E2ECFD; --amber:#C97A00; --amber-soft:#FCEFD6; --violet:#6B45D1; --violet-soft:#ECE6FC;
  --good:#1F8A4C; --good-soft:#DFF3E6; --warn:#B26A00; --warn-soft:#FCEFD6; --bad:#C0352B; --bad-soft:#FBE3E0;
  --wa:#1C8C4E; --wa-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(10,40,36,.06),0 4px 14px rgba(10,40,36,.06);
  --f-display:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1513; --surface:#14201D; --sunk:#101A18; --ink:#E3EEEB; --muted:#93AAA4; --line:#24352F;
  --brand:#07302B; --brand-2:#0B3D37; --brand-ink:#E3F2EE; --brand-muted:#86B3A9; --brand-line:#15524A;
  --accent:#3FB8A2; --accent-ink:#04201B; --accent-soft:#163A33; --accent-strong:#6FD3C0;
  --saffron:#F5B43A; --saffron-soft:#3A2C0E; --saffron-ink:#F8D48C;
  --blue:#7EA6F2; --blue-soft:#18243D; --amber:#E9A73E; --amber-soft:#33270F; --violet:#A891F0; --violet-soft:#241C3D;
  --good:#5CC98A; --good-soft:#15301F; --warn:#E3A853; --warn-soft:#33270F; --bad:#F08C82; --bad-soft:#3A1C19;
  --wa:#2FA866; --wa-ink:#04140B; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1513; --surface:#14201D; --sunk:#101A18; --ink:#E3EEEB; --muted:#93AAA4; --line:#24352F;
  --brand:#07302B; --brand-2:#0B3D37; --brand-ink:#E3F2EE; --brand-muted:#86B3A9; --brand-line:#15524A;
  --accent:#3FB8A2; --accent-ink:#04201B; --accent-soft:#163A33; --accent-strong:#6FD3C0;
  --saffron:#F5B43A; --saffron-soft:#3A2C0E; --saffron-ink:#F8D48C;
  --blue:#7EA6F2; --blue-soft:#18243D; --amber:#E9A73E; --amber-soft:#33270F; --violet:#A891F0; --violet-soft:#241C3D;
  --good:#5CC98A; --good-soft:#15301F; --warn:#E3A853; --warn-soft:#33270F; --bad:#F08C82; --bad-soft:#3A1C19;
  --wa:#2FA866; --wa-ink:#04140B; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* brand rail */
.side{background:var(--brand);color:var(--brand-ink);padding-block:18px;padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--saffron);display:grid;place-items:center;flex:none}
.brand i::after{content:"";width:14px;height:10px;border-top:2.5px solid var(--brand);border-bottom:2.5px solid var(--brand)}
.biz{color:var(--brand-muted);font-size:12px;margin:4px 6px 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:8px;color:var(--brand-muted);font-weight:500;display:flex;gap:10px;align-items:center;position:relative}
.nav button:hover{background:var(--brand-2);color:var(--brand-ink)}
.nav button[aria-current="page"]{background:var(--brand-2);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--saffron)}
.nav button:focus-visible{outline:2px solid var(--saffron);outline-offset:1px}
.nav .lbl{flex:1}
.nav .sep{height:1px;background:var(--brand-line);margin:10px 4px}
.nav kbd{font-family:var(--f-mono);font-size:10.5px;color:var(--brand-muted);border:1px solid var(--brand-line);border-radius:4px;padding:0 5px}
.store{margin-top:auto;padding:12px 6px 0;font-size:12px;color:var(--brand-muted);display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand-muted);flex:none;margin-top:5px}
.dot.ok{background:#5BD99B} .dot.local{background:var(--saffron)}
.credit{padding:10px 6px 0;margin-top:10px;border-top:1px solid var(--brand-line);font-size:11.5px;color:var(--brand-muted)}
.credit b{color:var(--brand-ink);font-weight:600}
/* work area */
.work{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:28px;padding-right:max(28px, env(safe-area-inset-right, 0px))}
.topbar .who{flex:1;min-width:0}
.topbar .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .who span{font-size:12px;color:var(--muted)}
main{padding-block:22px 60px;padding-left:28px;padding-right:max(28px, env(safe-area-inset-right, 0px));min-width:0}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0 0 10px;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;font-weight:600}
.sub{color:var(--muted);margin-top:4px;max-width:70ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.btn.pri:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.cta{background:var(--saffron);border-color:var(--saffron);color:#2A1A00;font-weight:600}
.btn.cta:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px;min-height:30px}
.btn.lg{padding:12px 18px;font-size:15px;min-height:48px}
.btn:focus-visible,.input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
a.btn{text-decoration:none;color:inherit}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink)}
.btn.wa:hover{filter:brightness(1.06)}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:500}
.link:focus-visible{outline:2px solid var(--accent)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;min-height:38px}
.input:focus{border-color:var(--accent)}
textarea.input{resize:vertical;min-height:62px}
.input[disabled]{background:var(--sunk);color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
label.f.req>span::after{content:" *";color:var(--bad)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.tile .ib{grid-row:span 3;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;align-self:start}
.tile .ib svg.ic{width:20px;height:20px}
.tile .k{font-size:12px;color:var(--muted);font-weight:500}
.tile .v{font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .n{font-size:12px;color:var(--muted)}
.t-sales .ib{background:var(--accent-soft);color:var(--accent)} .t-buy .ib{background:var(--blue-soft);color:var(--blue)}
.t-stock .ib{background:var(--amber-soft);color:var(--amber)} .t-cash .ib{background:var(--violet-soft);color:var(--violet)}
.tiles.plain .tile{display:block}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.stack{display:grid;gap:18px;align-content:start}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:color-mix(in srgb, var(--accent-soft) 45%, transparent)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
tfoot td{font-weight:600;background:var(--sunk);border-top:1px solid var(--line);border-bottom:none}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;line-height:1.5}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.sample{background:transparent;border:1px dashed var(--muted)}
.chip.b2b{background:var(--blue-soft);color:var(--blue)} .chip.b2c{background:var(--saffron-soft);color:var(--saffron-ink)}
.chip.p-upi{background:var(--violet-soft);color:var(--violet)} .chip.p-cash{background:var(--good-soft);color:var(--good)}
.chip.p-card{background:var(--blue-soft);color:var(--blue)} .chip.p-due{background:var(--amber-soft);color:var(--amber)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;color:var(--muted);font-weight:500;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filters label.f{width:160px}
.banner{background:var(--saffron-soft);color:var(--saffron-ink);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{all:unset;cursor:pointer;padding:8px 16px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;line-height:1.2}
.seg button small{font-weight:400;font-size:11px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"][data-mode="b2b"]{color:var(--blue)} .seg button[aria-pressed="true"][data-mode="b2c"]{color:var(--saffron-ink)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.quick{display:flex;gap:8px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:12px 0}
.quick .input{background:var(--surface)}
.quick svg.ic{color:var(--accent)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(6,24,21,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) 24px max(12px, env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:760px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden}
.modal.wide{max-width:1080px}
.modal.narrow{max-width:520px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--sunk)}
.mh h2{margin:0}
.mb{padding:18px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--sunk)}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;color:var(--muted);padding:4px 8px;border-radius:6px}
.x:focus-visible{outline:2px solid var(--accent)}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;margin:0;min-width:0}
legend{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 6px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.lines td{padding:6px;vertical-align:middle}
.lines .input{padding:5px 6px;min-height:34px}
.lines td.num{min-width:90px}
.sum{display:grid;grid-template-columns:auto auto;gap:4px 18px;justify-content:end;font-family:var(--f-mono);font-variant-numeric:tabular-nums;margin-top:12px}
.sum div:nth-child(odd){color:var(--muted);font-family:var(--f-body);text-align:right}
.sum .gt{font-size:18px;font-weight:600;color:var(--ink)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:500;z-index:80;max-width:90vw;box-shadow:var(--shadow)}
.confirm{background:var(--bad-soft);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.hint{font-size:12px;color:var(--muted)}
/* sign-in gate */
#gate{position:fixed;inset:0;z-index:90;background:radial-gradient(900px 700px at 30% 20%,var(--brand-2),var(--brand) 60%,#06302B);display:grid;place-items:center;padding:24px max(16px, env(safe-area-inset-right,0px)) 24px max(16px, env(safe-area-inset-left,0px));overflow:auto}
.gate-card{width:100%;max-width:420px;background:var(--surface);border-radius:18px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.gate-card .brand i{background:var(--saffron)}
/* payment */
.paybig{text-align:center;padding:4px 0 14px}
.paybig .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.paybig .v{font-family:var(--f-mono);font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px}
.paybig .n{color:var(--muted);font-size:13px}
.paygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.paybtn{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;gap:12px;align-items:center;background:var(--surface)}
.paybtn:hover{border-color:var(--accent)}
.paybtn:focus-visible{outline:2px solid var(--accent)}
.paybtn .ib{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;flex:none}
.paybtn b{display:block;font-size:15px}.paybtn small{color:var(--muted);font-size:12px}
.paybtn.upi .ib{background:var(--violet-soft);color:var(--violet)} .paybtn.cash .ib{background:var(--good-soft);color:var(--good)}
.paybtn.card .ib{background:var(--blue-soft);color:var(--blue)} .paybtn.due .ib{background:var(--amber-soft);color:var(--amber)}
.qrbox{display:grid;place-items:center;gap:10px;background:#fff;border-radius:14px;padding:18px;border:1px solid var(--line);color:#111;max-width:340px;margin:0 auto}
.qrbox img,.qrbox svg{width:250px;height:250px;max-width:100%;image-rendering:pixelated}
.qrbox img.photo{image-rendering:auto;height:auto;max-height:300px;object-fit:contain}
.qrbox .amt{font-family:var(--f-mono);font-size:26px;font-weight:600}
.qrbox .to{font-size:13px;color:#4a5a56;text-align:center}
.qrthumb{width:120px;height:120px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
.paid-stamp{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--good);background:var(--good-soft);padding:6px 12px;border-radius:999px}
/* invoice sheet */
.inv{background:#fff;color:#1b1b1b;border:1px solid #cfd8d5;border-radius:8px;font-family:var(--f-body);font-size:12.5px;padding:22px;overflow-x:auto}
.inv table{font-size:12px}.inv th{background:#E9F2EF;color:#173b35}.inv td,.inv th{border:1px solid #cfd8d5}
.inv tbody tr:hover td{background:none}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){

function calcLines(lines,inter){
  const out=[];let taxable=0,cgst=0,sgst=0,igst=0,qty=0;
  for(const l of lines||[]){
    const q=num(l.qty),rate=num(l.rate),disc=num(l.disc),g=num(l.gst);
    const tx=r2(q*rate*(1-disc/100)),tax=r2(tx*g/100);
    const c=inter?0:r2(tax/2), s=inter?0:r2(tax-c), i=inter?tax:0;
    out.push({...l,qty:q,rate,disc,gst:g,taxable:tx,cgst:c,sgst:s,igst:i,total:r2(tx+tax)});
    taxable+=tx;cgst+=c;sgst+=s;igst+=i;qty+=q;
  }
  taxable=r2(taxable);cgst=r2(cgst);sgst=r2(sgst);igst=r2(igst);
  const raw=r2(taxable+cgst+sgst+igst),grand=Math.round(raw);
  return {lines:out,taxable,cgst,sgst,igst,tax:r2(cgst+sgst+igst),raw,round:r2(grand-raw),grand,qty};
}

}

function stockOf(itemId){

  const open=num(it?.openingStock);return {open,inQ,outQ,bal:open+inQ-outQ};
}

function words(n){
  n=Math.round(n);if(n===0)return"Zero";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?" "+a[x%10]:"");
  const three=x=>(x>=100?a[Math.floor(x/100)]+" Hundred"+(x%100?" ":""):"")+(x%100?two(x%100):"");
  const parts=[];const cr=Math.floor(n/1e7);n%=1e7;const l=Math.floor(n/1e5);n%=1e5;const t=Math.floor(n/1e3);n%=1e3;
  if(cr)parts.push((cr>99?words(cr):two(cr))+" Crore");if(l)parts.push(two(l)+" Lakh");if(t)parts.push(two(t)+" Thousand");if(n)parts.push(three(n));
  return parts.join(" ");
}

/* ---------- storage backends ---------- */
function scheduleRender(){if(!READY||renderQueued)return;renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;renderShell();renderView()})}

/* Device storage: IndexedDB (one record per document, no 5 MB limit), localStorage as fallback. */
function idbOpen(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open("ledgerbook",1)}catch(e){return rej(e)}r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function localBackend(){
  const OLD="ledgerbook_v1";let idb=null;
  try{idb=await idbOpen()}catch(e){idb=null}
  const tx=(mode,fn)=>new Promise((res,rej)=>{const t=idb.transaction("kv",mode);const st=t.objectStore("kv");const out=fn(st);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
  const idbPut=(k,v)=>tx("readwrite",st=>st.put(v,k));
  const idbDel=k=>tx("readwrite",st=>st.delete(k));
  const persistLS=()=>{try{localStorage.setItem(OLD,JSON.stringify({items:S.items,customers:S.customers,vendors:S.vendors,purchases:S.purchases,sales:S.sales,tds:S.tds,ledgers:S.ledgers,vouchers:S.vouchers,creditNotes:S.creditNotes,debitNotes:S.debitNotes,quotes:S.quotes,settings:S.settings,counters:S.counters}))}catch(e){toast("Could not save: storage is blocked or full")}};
  if(idb){
    const all=await new Promise((res,rej)=>{const out=[];const t=idb.transaction("kv","readonly");const c=t.objectStore("kv").openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}else res(out)};c.onerror=()=>rej(c.error)});
    for(const [k,v] of all){const [coll]=String(k).split("/");if(COLLS.includes(coll))S[coll].push(v);else if(coll==="audit")S.audit.push(v);else if(k==="settings")S.settings=v;else if(k==="counters")S.counters=v}
    // one-time move of data saved by the earlier browser-only version
    try{const raw=localStorage.getItem(OLD);if(raw&&!all.length){const d=JSON.parse(raw);for(const c of COLLS)for(const o of d[c]||[]){S[c].push(o);await idbPut(c+"/"+o.id,o)}if(d.settings){S.settings=d.settings;await idbPut("settings",d.settings)}if(d.counters){S.counters=d.counters;await idbPut("counters",d.counters)}localStorage.removeItem(OLD)}}catch(e){}
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }else{
    try{const raw=localStorage.getItem(OLD);if(raw){const d=JSON.parse(raw);for(const k of [...COLLS,"settings","counters"])if(d[k])S[k]=d[k]}}catch(e){}
  }
  const save=async(k,v)=>{if(idb){try{await idbPut(k,v)}catch(e){toast("Could not save on this device: storage is full");throw e}}else persistLS()};
  const logA=async(action,coll,before,after,noDocs)=>{const e={id:uid(),ts:new Date().toISOString(),user:{username:"owner",name:"This device"},device:DEVICE_NAME,action,coll,docId:(after||before)?.id,label:coll==="settings"?"Business settings":auditLabel(coll,after||before),changes:auditDiff(before,after)};if(!noDocs){e.before=before||undefined;e.after=after||undefined}S.audit.push(e);if(idb){try{await idbPut("audit/"+e.id,e)}catch(x){}}};
  return {
    kind:"local",
    async put(coll,obj){obj=JSON.parse(JSON.stringify(obj));const i=S[coll].findIndex(x=>x.id===obj.id),before=i>=0?S[coll][i]:null;if(i>=0)S[coll][i]=obj;else S[coll].push(obj);await save(coll+"/"+obj.id,obj);
      await logA(!before?"create":coll==="sales"&&before.status!=="cancelled"&&obj.status==="cancelled"?"cancel":"update",coll,before,obj);scheduleRender()},
    async remove(coll,id){const before=S[coll].find(x=>x.id===id);S[coll]=S[coll].filter(x=>x.id!==id);if(idb)await idbDel(coll+"/"+id);else persistLS();if(before)await logA("delete",coll,before,null);scheduleRender()},
    async saveSettings(o){const before=S.settings;S.settings=o;await save("settings",o);await logA("update","settings",before,o,true);scheduleRender()},
    async nextSeq(fy,floor){const n=Math.max(num(S.counters[fy]),floor)+1;S.counters={...S.counters,[fy]:n};await save("counters",S.counters);return n},
    async resetCounters(map){S.counters=map;await save("counters",map)},
  };
}

function dbBackend(db){
  let ready=0;const need=COLLS.length+1;
  const mark=()=>{ready++;if(ready>=need)scheduleRender()};
  for(const c of COLLS){let first=true;db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({...d.data(),id:d.id}));if(first){first=false;mark()}else scheduleRender()},e=>{toast("Lost live connection to "+c+". Reload the page.")})}
  let firstS=true;db.doc("meta/settings").onSnapshot(s=>{S.settings=s.exists?{...s.data()}:{};if(firstS){firstS=false;mark()}else scheduleRender()});
  const clean=o=>JSON.parse(JSON.stringify(o));
  return {
    kind:"db",
    async put(coll,obj){await db.collection(coll).doc(obj.id).set(clean(obj))},
    async remove(coll,id){await db.collection(coll).doc(id).delete()},
    async saveSettings(o){await db.doc("meta/settings").set(clean(o))},
    async nextSeq(fy,floor){
      const ref=db.doc("meta/counter_"+fy.replace("-",""));
      let got=false;
      for(let i=0;i<8&&!got;i++){try{const r=await ref.acquire({holder:TAB,ttlMs:6000});got=r.acquired}catch(e){got=true}if(!got)await new Promise(r=>setTimeout(r,400+Math.random()*400))}
      const s=await ref.get();const last=s.exists?num(s.data().last):0;
      const n=Math.max(last,floor)+1;await ref.set({last:n,fy});return n;
    },
    async resetCounters(map){for(const [fy,v] of Object.entries(map))await db.doc("meta/counter_"+fy.replace("-","")).set({last:v,fy})},
  };
}

async function allocInvoiceNo(date){
  const fy=fyOf(date);
  const floor=S.sales.filter(s=>s.fy===fy).reduce((m,s)=>Math.max(m,num(s.seq)),0);
  const seq=await backend.nextSeq(fy,floor);
  const prefix=(S.settings.prefix??"INV/");
  return {fy,seq,no:`${prefix}${fy}/${String(seq).padStart(4,"0")}`};
}

function waNumber(p){let d=String(p||"").replace(/\D/g,"");if(d.length===11&&d[0]==="0")d=d.slice(1);if(d.length===10)d="91"+d;return d.length>=11&&d.length<=15?d:""}
function waText(s){

}
const waLink=s=>{const p=waNumber(s.party?.phone);return `https://wa.me/${p}?text=${encodeURIComponent(waText(s))}`};

async function sendWhatsApp(s,{auto}={}){
  const phone=waNumber(s.party?.phone);
  if(!phone){toast(`Add a mobile number for ${s.party?.name||"this customer"} to send on WhatsApp`);return false}
  if(!NATIVE){window.open(waLink(s),"_blank");return true}
  toast("Preparing invoice PDF…");
  let b64;try{b64=await blobToB64(await invoicePDF(s))}catch(e){toast("Could not create the PDF");return false}
  const fname=fileBase(s)+".pdf";
  if(S.settings.waMode==="api"&&S.settings.waApiPhoneId&&S.settings.waApiToken){
    const id=uid();const c=docCalc(s);
    const vars=(S.settings.waApiVars||"customer,invoice,amount").split(",").map(x=>x.trim()).filter(Boolean).map(k=>({customer:s.party?.name||"",invoice:s.no,amount:inr.format(c.grand),date:fmtDate(s.date),business:S.settings.name||""}[k]??k));
    const payload=JSON.stringify({phoneId:S.settings.waApiPhoneId,token:S.settings.waApiToken,template:S.settings.waApiTemplate||"invoice_copy",lang:S.settings.waApiLang||"en",to:phone,filename:fname,pdf:b64,bodyParams:vars});
    let r;
    if(NATIVE.waCloudSendAsync){try{r=JSON.parse(await NATIVE.waCloudSendAsync(payload))}catch(e){r={ok:false,error:String(e&&e.message||e)}}}
    else r=await new Promise(res=>{nativeCbs[id]=res;NATIVE.waCloudSend(id,payload)});
    if(r.ok){toast(`Invoice sent to ${s.party.name} on WhatsApp`);await backend.put("sales",{...s,waSentAt:new Date().toISOString()}).catch(()=>{});return true}
    toast("WhatsApp Business API: "+(r.error||"send failed")+". Opening WhatsApp instead.");
  }
  const r=NATIVE.shareToWhatsApp(b64,fname,phone,waText(s));
  if(r==="no_whatsapp")toast("WhatsApp is not installed. Choose another app to share.");
  if(r==="desktop")toast("WhatsApp is opening the chat. The PDF is in Downloads\\Ledgerbook (folder opened): drag it into the chat.");
  return true;
}

  const today=sum(todays),month=sum(live.filter(s=>s.date>=ms&&s.date<=me)),fy=sum(live.filter(s=>s.date>=fs));
  const pm=S.purchases.filter(p=>p.date>=ms&&p.date<=me).reduce((a,p)=>a+docCalc(p).grand,0);
  const modes={UPI:0,Cash:0,Card:0,Due:0};
  let collected=0;
  for(const s of todays){const p=payInfo(s),g=docCalc(s).grand;if(p.status==="paid"){collected+=g;if(modes[p.mode]!=null)modes[p.mode]+=g}else modes.Due+=g}

  const needSetup=!S.settings.name||!S.settings.state;
  const maxM=Math.max(1,...Object.values(modes));

  ${needSetup?`<div class="banner">Add your business name, GSTIN and state in <button class="link" data-go="settings">Settings</button> so invoices show the right details and GST splits correctly.</div>`:""}

  </div>
  <div class="two">
   <div><h3>Recent invoices</h3><div class="tablewrap">${recent.length?`<table><thead><tr><th>Invoice</th><th>Customer</th><th>Payment</th><th class="num">Amount</th></tr></thead><tbody>${recent.map(s=>`<tr><td class="mono"><button class="link" data-view-sale="${s.id}">${esc(s.no)}</button><div class="hint">${fmtDate(s.date)}</div></td><td>${esc(s.party?.name)} ${typeChip(s)} ${s.sample?'<span class="chip sample">Sample</span>':""}${s.status==="cancelled"?' <span class="chip bad">Cancelled</span>':""}</td><td>${payChip(s)}</td><td class="num">${amt(docCalc(s).grand)}</td></tr>`).join("")}</tbody></table>`:`<div class="empty"><b>No invoices yet</b>Tap New invoice to bill your first customer.</div>`}</div></div>
   <div class="stack">
    <div><h3>Today's collection</h3><div class="panel" style="display:grid;gap:10px">${bar("UPI","UPI","p-upi")}${bar("Cash","Cash","p-cash")}${bar("Card","Card","p-card")}${bar("Due","Due","p-due")}</div></div>
    <div><h3>Low stock</h3><div class="tablewrap">${low.length?`<table><thead><tr><th>Item</th><th class="num">In stock</th><th class="num">Reorder at</th></tr></thead><tbody>${low.slice(0,8).map(([it,b])=>`<tr><td>${esc(it.name)}<div class="hint mono">${esc(it.sku)}</div></td><td class="num"><span class="chip ${b<=0?"bad":"warn"}">${qtyf(b)} ${esc(it.unit)}</span></td><td class="num">${qtyf(num(it.reorderLevel))}</td></tr>`).join("")}</tbody></table>`:`<div class="empty"><b>All stocked</b>Items at or below their reorder level show here.</div>`}</div></div>
   </div>
  </div>`;

/* ---------- Items ---------- */

  <div class="tabs" role="tablist"><button role="tab" data-tab="list" aria-selected="${tab==="list"}">SKU list</button><button role="tab" data-tab="hsn" aria-selected="${tab==="hsn"}">HSN-wise list</button></div>`;
  if(tab==="hsn"){
    const g={};for(const it of S.items){const k=it.hsn||"—";(g[k]=g[k]||[]).push(it)}
    const keys=Object.keys(g).sort();
    return head+(keys.length?`<div class="tablewrap"><table><thead><tr><th>HSN / SAC</th><th>GST rate</th><th>Items</th><th class="num">SKUs</th></tr></thead><tbody>${keys.map(k=>{const rates=[...new Set(g[k].map(i=>num(i.gstRate)))];return `<tr><td class="mono">${esc(k)}</td><td>${rates.map(r=>`<span class="chip">${r}%</span>`).join(" ")}${rates.length>1?' <span class="chip warn">Mixed rates</span>':""}</td><td>${g[k].map(i=>`<button class="link" data-edit-item="${i.id}">${esc(i.name)}</button>`).join(", ")}</td><td class="num">${g[k].length}</td></tr>`}).join("")}</tbody></table></div>`:emptyItems());
  }

  (S.items.length?`<div class="tablewrap"><table><thead><tr><th>SKU</th><th>Item</th><th>HSN</th><th>Unit</th><th class="num">GST</th><th class="num">Sale price</th><th class="num">Purchase price</th><th class="num">Stock</th><th></th></tr></thead><tbody>${rows.map(i=>{const st=stockOf(i.id);return `<tr><td class="mono">${esc(i.sku)}</td><td>${esc(i.name)} ${i.sample?'<span class="chip sample">Sample</span>':""}</td><td class="mono">${esc(i.hsn)}</td><td>${esc(i.unit)}</td><td class="num">${num(i.gstRate)}%</td><td class="num">${amt(num(i.salePrice))}</td><td class="num">${amt(num(i.purchasePrice))}</td><td class="num">${qtyf(st.bal)}</td><td><button class="btn sm" data-edit-item="${i.id}">Edit</button></td></tr>`}).join("")}</tbody></table></div>`:emptyItems());
}
const emptyItems=()=>`<div class="tablewrap"><div class="empty"><b>No items yet</b>Add the SKUs you sell, with their HSN code and GST rate.<div style="margin-top:12px"><button class="btn pri" data-act="newItem">Add item</button></div></div></div>`;

   <label class="f req"><span>SKU code</span><input class="input" id="i_sku" required value="${esc(it.sku)}"></label>

    const v=x=>$(x).value.trim();

    if(S.items.some(x=>x.sku.toLowerCase()===v("#i_sku").toLowerCase()&&x.id!==id)){$("#itemErr").innerHTML=`<div class="err">SKU ${esc(v("#i_sku"))} is already used by another item.</div>`;return}
    const o={...it,id:id||uid(),name:v("#i_name"),sku:v("#i_sku"),unit:v("#i_unit"),hsn:v("#i_hsn"),gstRate:num(v("#i_gst")),salePrice:num(v("#i_sp")),purchasePrice:num(v("#i_pp")),openingStock:num(v("#i_os")),reorderLevel:num(v("#i_rl")),desc:v("#i_desc"),priceIncl:$("#i_incl").checked};
    await guard(()=>backend.put("items",o));closeModal();toast(id?"Item saved":"Item added");
  };
  if($("#delItem"))$("#delItem").onclick=()=>confirmIn("#itemErr","Delete this item? It has no transactions.",async()=>{await guard(()=>backend.remove("items",id));closeModal();toast("Item deleted")});

function confirmIn(sel,msg,fn){$(sel).innerHTML=`<div class="confirm"><span>${esc(msg)}</span><button class="btn sm danger" id="cYes">Yes, continue</button><button class="btn sm" id="cNo">Keep it</button></div>`;$("#cYes").onclick=fn;$("#cNo").onclick=()=>$(sel).innerHTML=""}
async function guard(fn){try{return await fn()}catch(e){toast(e?.code==="quota_exceeded"?"Storage is full. Delete old records to continue.":e?.code==="conflict"?"Someone else just changed this record. It has been refreshed; please make your change again.":e?.code==="forbidden"?"You don't have permission to do this. Ask your admin.":e?.code==="network"?"Can't reach the server, so this wasn't saved. Check the connection and try again.":"Could not save: "+(e?.message||"try again"));throw e}}

/* ---------- Inventory ---------- */
function vInventory(){
  const q=(sub.q||"").toLowerCase();
  const rows=S.items.filter(i=>!q||(i.name+" "+i.sku+" "+i.hsn).toLowerCase().includes(q)).map(i=>[i,stockOf(i.id)]).sort((a,b)=>a[0].name.localeCompare(b[0].name));

  return `<div class="head"><div><h1>Inventory</h1><div class="sub">Live stock: opening + purchased − sold. Cancelled invoices return stock.</div></div><div class="row"><button class="btn" data-act="exportStock">Export CSV</button><button class="btn pri" data-act="newPurchase">Add stock (purchase)</button></div></div>

  ${S.items.length?`<div class="tablewrap"><table><thead><tr><th>SKU</th><th>Item</th><th class="num">Opening</th><th class="num">Purchased</th><th class="num">Sold</th><th class="num">In stock</th><th>Status</th><th class="num">Value at cost</th><th class="num">Value at sale price</th></tr></thead><tbody>${rows.map(([i,s])=>`<tr><td class="mono">${esc(i.sku)}</td><td>${esc(i.name)}</td><td class="num">${qtyf(s.open)}</td><td class="num">${qtyf(s.inQ)}</td><td class="num">${qtyf(s.outQ)}</td><td class="num"><b>${qtyf(s.bal)}</b> <span class="muted">${esc(i.unit)}</span></td><td>${s.bal<=0?'<span class="chip bad">Out of stock</span>':s.bal<=num(i.reorderLevel)?'<span class="chip warn">Reorder</span>':'<span class="chip good">OK</span>'}</td><td class="num">${amt(s.bal*num(i.purchasePrice))}</td><td class="num">${amt(s.bal*num(i.salePrice))}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan="7">Total</td><td class="num">${amt(tv)}</td><td class="num">${amt(ts)}</td></tr></tfoot></table></div>`:emptyItems()}`;
}

function addrBlock(pfx,a,label){a=a||{};return `<fieldset id="${pfx}_fs"><legend>${label}</legend><div class="grid g3">

  <label class="f"><span>City</span><input class="input" id="${pfx}_city" value="${esc(a.city)}"></label>

const readAddr=p=>({line:$(`#${p}_line`).value.trim(),city:$(`#${p}_city`).value.trim(),state:$(`#${p}_state`).value,pin:$(`#${p}_pin`).value.trim()});

function openPartyForm(coll,id,after){

  openModal(`${id?"Edit":"Add"} ${isC?"customer":"vendor"}`,`<form id="partyF" class="grid" onsubmit="return false">
   <div class="grid g2">

    <label class="f"><span>Udyam registration no.</span><input class="input mono" id="p_udyam" placeholder="UDYAM-MH-00-0000000" style="text-transform:uppercase" value="${esc(p.udyam)}"></label>

    <span class="hint spanall">For Micro and Small suppliers, the law allows at most 45 days (15 days without a written agreement). Late bills show up in Reports → MSME dues.</span>
   </div></fieldset>`}
   <fieldset><legend>Contact details</legend><div class="grid g2">
    <label class="f"><span>Contact person</span><input class="input" id="p_contact" value="${esc(p.contact)}"></label>
    <label class="f"><span>Mobile (used for WhatsApp)</span><input class="input" id="p_phone" inputmode="tel" value="${esc(p.phone)}"></label>
    <label class="f"><span>Email address</span><input class="input" id="p_email" type="email" value="${esc(p.email)}"></label>
    <label class="f"><span>PAN (optional)</span><input class="input" id="p_pan" maxlength="10" style="text-transform:uppercase" value="${esc(p.pan)}"></label>
   </div></fieldset>
   <div id="partyErr"></div></form>`,
   `<button class="btn" data-close>Cancel</button><button class="btn pri" id="saveParty">${id?"Save changes":"Add "+(isC?"customer":"vendor")}</button>`);
  const syncShip=()=>{const same=$("#p_same").checked;$("#shipWrap").querySelectorAll("input,select,textarea").forEach(el=>{el.disabled=same});if(same){["line","city","state","pin"].forEach(k=>$("#s_"+k).value=$("#b_"+k).value)}};
  $("#p_same").onchange=syncShip;["line","city","state","pin"].forEach(k=>$("#b_"+k).addEventListener("input",()=>{if($("#p_same").checked)syncShip()}));
  $("#b_state").addEventListener("change",()=>{if($("#p_same").checked)syncShip()});

    if(!GSTIN_RE.test(g)){m.textContent="GSTIN format looks wrong: 15 characters, starting with the 2-digit state code.";m.style.color="var(--warn)";return}
    const sc=g.slice(0,2);if(!gstinChecksumOk(g)){m.textContent="The last character (checksum) doesn't match: a character is probably mistyped.";m.style.color="var(--warn)";return}m.textContent=`Valid GSTIN · State ${sc} ${STATE_NAME[sc]||""} · PAN ${g.slice(2,12)}`;m.style.color="var(--good)";
    if(!$("#b_state").value&&STATE_NAME[sc]){$("#b_state").value=sc;if($("#p_same").checked)syncShip()}if(!$("#p_pan").value)$("#p_pan").value=g.slice(2,12)};
  $("#p_gstin").addEventListener("input",chkG);chkG();syncShip();
  $("#saveParty").onclick=async()=>{

    await guard(()=>backend.put(coll,o));closeModal();toast(id?"Saved":(isC?"Customer added":"Vendor added"));if(after)after(o.id);
  };
}

/* ---------- Line editor (shared by sales + purchases) ---------- */
const itemRate=(it,key)=>key==="salePrice"&&it.priceIncl?Math.round(num(it.salePrice)/(1+num(it.gstRate)/100)*10000)/10000:num(it[key]);
function lineEditor(kind,lines,getInter){
  const priceKey=kind==="sale"?"salePrice":"purchasePrice";
  const itemOpts=sel=>`<option value="">Select item</option>`+[...S.items].sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<option value="${i.id}"${i.id===sel?" selected":""}>${esc(i.name)} · ${esc(i.sku)}</option>`).join("");
  const wrap=$("#lines");
  function draw(){
    const inter=getInter(),c=calcLines(lines,inter);

     <td class="num">${amt(l.taxable)}</td><td class="num">${amt(l.cgst+l.sgst+l.igst)}</td><td class="num"><b>${amt(l.total)}</b></td>

     <div class="sum"><div>Taxable value</div><div>${amt(c.taxable)}</div>${inter?`<div>IGST</div><div>${amt(c.igst)}</div>`:`<div>CGST</div><div>${amt(c.cgst)}</div><div>SGST</div><div>${amt(c.sgst)}</div>`}<div>Round off</div><div>${c.round>=0?"+":""}${amt(c.round)}</div><div class="gt">Total</div><div class="gt">${money(c.grand)}</div></div>`;
  }

    else l[k]=num(e.target.value);draw()});
  wrap.addEventListener("input",e=>{const tr=e.target.closest("tr[data-i]");if(!tr||e.target.tagName!=="INPUT")return;lines[+tr.dataset.i][e.target.dataset.k]=num(e.target.value);
    const c=calcLines(lines,getInter()),l=c.lines[+tr.dataset.i],tds=tr.children;tds[6].textContent=amt(l.taxable);tds[7].textContent=amt(l.cgst+l.sgst+l.igst);tds[8].innerHTML=`<b>${amt(l.total)}</b>`;
    const sum=wrap.querySelector(".sum");const inter=getInter();sum.innerHTML=`<div>Taxable value</div><div>${amt(c.taxable)}</div>${inter?`<div>IGST</div><div>${amt(c.igst)}</div>`:`<div>CGST</div><div>${amt(c.cgst)}</div><div>SGST</div><div>${amt(c.sgst)}</div>`}<div>Round off</div><div>${c.round>=0?"+":""}${amt(c.round)}</div><div class="gt">Total</div><div class="gt">${money(c.grand)}</div>`});
  wrap.addEventListener("click",e=>{const d=e.target.closest("[data-del]");if(d){lines.splice(+d.dataset.del,1);if(!lines.length)lines.push({qty:0,rate:0,disc:0,gst:18});draw()}
    if(e.target.id==="addLine"){lines.push({qty:0,rate:0,disc:0,gst:18});draw()}
});
  function addItem(id){
    const it=byId("items",id);if(!it)return false;
    const ex=lines.find(l=>l.itemId===id);
    if(ex)ex.qty=num(ex.qty)+1;
    else{let l=lines.find(l=>!l.itemId);if(!l){l={};lines.push(l)}Object.assign(l,{itemId:id,name:it.name,sku:it.sku,hsn:it.hsn,unit:it.unit,gst:num(it.gstRate),rate:itemRate(it,priceKey),qty:1,disc:0})}
    draw();return true;
  }
  draw();return {draw,lines,addItem};
}

function wireSaleSave(st,inter){
  $("#saveSale").onclick=async()=>{
    const date=$("#so_date").value;
    const lines=st.lines.filter(l=>l.itemId&&num(l.qty)>0);
    const err=m=>$("#saleErr").innerHTML=`<div class="err">${m}</div>`;
    let party,partyId=null;
    if(st.mode==="b2b"){
      const cust=byId("customers",st.partyId);
      if(!cust)return err("Choose a customer, or switch to B2C for a walk-in sale.");
      party={name:cust.name,gstin:cust.gstin||"",bill:cust.bill,ship:cust.ship,phone:cust.phone,email:cust.email};partyId=cust.id;
    }else{
      const phone=$("#so_phone").value.trim(),name=$("#so_name").value.trim()||"Walk-in customer",addr=$("#so_addr").value.trim();
      if(phone&&!waNumber(phone))return err("Check the mobile number. Use 10 digits, like 98765 43210.");
      party={name,gstin:"",phone,email:"",bill:{line:addr,state:st.pos},ship:{line:addr,state:st.pos}};
    }
    if(!date)return err("Choose an invoice date.");if(!st.pos)return err("Choose the place of supply.");if(!lines.length)return err("Add at least one item. Type or scan its SKU in the search bar.");
    const short=lines.map(l=>{const it=byId("items",l.itemId);const need=lines.filter(x=>x.itemId===l.itemId).reduce((a,x)=>a+num(x.qty),0);return stockOf(l.itemId).bal<need?it.name:null}).filter(Boolean);
    if(st.quote){$("#saveSale").disabled=true;try{const {fy,seq,no}=await nextDocNo("QT","QT",date);
        const q={id:uid(),no,fy,seq,date,validTill:$("#so_valid").value||"",type:st.mode,partyId,party,pos:st.pos,inter:inter(),lines:lines.map(l=>({itemId:l.itemId,name:l.name,sku:l.sku,hsn:l.hsn,unit:l.unit,qty:num(l.qty),rate:num(l.rate),disc:num(l.disc),gst:num(l.gst)})),notes:$("#so_notes").value.trim(),status:"open",created:new Date().toISOString()};
        q.grand=docCalc(q).grand;await guard(()=>backend.put("quotes",q));closeModal();toast(`Quotation ${no} saved`);viewQuote(q.id)}catch(e){$("#saveSale").disabled=false}return}
    if(short.length&&!st.okShort){st.okShort=true;return err(`Not enough stock for ${[...new Set(short)].map(esc).join(", ")}. Tap Save again to bill anyway (stock will go negative).`)}
    $("#saveSale").disabled=true;
    try{
      const {fy,seq,no}=await allocInvoiceNo(date);
      const o={id:uid(),no,fy,seq,date,type:st.mode,partyId,party,pos:st.pos,inter:inter(),
        lines:lines.map(l=>({itemId:l.itemId,name:l.name,sku:l.sku,hsn:l.hsn,unit:l.unit,qty:num(l.qty),rate:num(l.rate),disc:num(l.disc),gst:num(l.gst)})),
        ref:st.mode==="b2b"?$("#so_ref").value.trim():"",notes:$("#so_notes").value.trim(),status:"active",created:new Date().toISOString()};
      o.grand=docCalc(o).grand;
      await guard(()=>backend.put("sales",o));S.sales.some(x=>x.id===o.id)||S.sales.push(o);closeModal();toast(`Invoice ${no} saved`);
      if(st.fromQuote){const q=byId("quotes",st.fromQuote);if(q)backend.put("quotes",{...q,status:"converted",convertedTo:no}).catch(()=>{})}
      openPayment(o.id,true);
    }catch(e){$("#saveSale").disabled=false}
  };
}

/* ---------- payment collection ---------- */
let qrLibP=null;
function loadQrLib(){if(window.qrcode)return Promise.resolve();if(!qrLibP)qrLibP=loadScript("vendor/qrcode.js").catch(()=>loadScript("https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js")).catch(e=>{qrLibP=null;throw e});return qrLibP}
const upiLink=(amount,note)=>{const B=S.settings;return `upi://pay?pa=${encodeURIComponent((B.upiId||"").trim())}&pn=${encodeURIComponent(B.upiName||B.name||"")}&am=${amount.toFixed(2)}&cu=INR&tn=${encodeURIComponent(note)}`};
function openPayment(id,after){
  const s=byId("sales",id);if(!s)return;
  const c=docCalc(s),B=S.settings,g=c.grand;
  const frame=(html,foot,opts={})=>openModal(`Collect payment · ${s.no}`,`<div class="paybig"><div class="k">Amount to collect</div><div class="v">${money(g)}</div><div class="n">${esc(s.party?.name||"")}${s.party?.phone?" · "+esc(s.party.phone):""}</div></div>${html}<div id="payErr"></div>`,foot,{narrow:true,noFocus:true,...opts});
  const finish=()=>{viewSale(id,after);if(after)afterInvoice(byId("sales",id)||s)};
  const done=async fields=>{
    const upd={...(byId("sales",id)||s),...fields,payment:fields.payMode,paidAt:fields.payMode==="Credit"?null:new Date().toISOString()};
    try{await guard(()=>backend.put("sales",upd))}catch(e){return}
    const i=S.sales.findIndex(x=>x.id===id);if(i>=0)S.sales[i]=upd;
    closeModal();toast(fields.payMode==="Credit"?`${s.no} saved with payment due`:`${money(g)} received by ${fields.payMode}`);finish();
  };
  const choose=()=>{
    frame(`<div class="paygrid">
      <button class="paybtn upi" data-pm="UPI"><span class="ib">${ic("qr")}</span><span><b>UPI</b><small>Show QR with amount</small></span></button>
      <button class="paybtn cash" data-pm="Cash"><span class="ib">${ic("cash")}</span><span><b>Cash</b><small>Work out change</small></span></button>
      <button class="paybtn card" data-pm="Card"><span class="ib">${ic("card")}</span><span><b>Card</b><small>Debit or credit card</small></span></button>
      <button class="paybtn due" data-pm="Credit"><span class="ib">${ic("clock")}</span><span><b>Pay later</b><small>Mark payment as due</small></span></button>
     </div>`,`<button class="btn" id="paySkip">${after?"Skip, decide later":"Close"}</button>`);
    $("#ov").querySelectorAll(".paybtn").forEach(b=>b.onclick=()=>({UPI:upi,Cash:cash,Card:card,Credit:()=>done({payMode:"Credit",payStatus:"due"})})[b.dataset.pm]());
    $("#paySkip").onclick=()=>{closeModal();finish()};
  };
  const back=()=>{$("#pBack").onclick=choose};
  const upi=async()=>{

/* ---------- Purchases ---------- */
/* Purchase payment terms: agreed credit days → due date; MSME (micro/small) capped at 45 days, 15 without agreement */
function purTerms(p){
  const v=byId("vendors",p.partyId)||{};
  const msme=v.msme==="micro"||v.msme==="small";
  const set=x=>x!==null&&x!==undefined&&x!=="";
  const agreed=set(p.creditDays)?num(p.creditDays):set(v.creditDays)?num(v.creditDays):null;
  const days=agreed!==null?agreed:(msme?15:30);
  const legal=msme?Math.min(days,agreed!==null?45:15):days;
  return {v,msme,days,due:addDays(p.date,days),msmeDue:addDays(p.date,legal),legal};
}
function purStatus(p){
  const t=purTerms(p),today=todayISO();
  if(p.paidOn){const late=t.msme&&p.paidOn>t.msmeDue;return `<span class="chip ${late?"warn":"good"}">Paid ${fmtDate(p.paidOn)}</span>${late?`<div class="hint">${daysBetween(t.msmeDue,p.paidOn)} days past MSME limit</div>`:""}`}
  const d=daysBetween(today,t.due);
  return d<0?`<span class="chip bad">Overdue ${-d}d</span>`:`<span class="chip ${d<=3?"warn":""}">Due ${d===0?"today":"in "+d+"d"}</span>`;
}

function rangeFilters(){
  const t=todayISO();const [lm1,lm2]=monthRange(-1),[tm1,tm2]=monthRange(0);
  const from=sub.from||tm1,to=sub.to||tm2;sub.from=from;sub.to=to;
  return `<div class="filters"><label class="f"><span>From</span><input class="input" type="date" id="rFrom" value="${from}"></label><label class="f"><span>To</span><input class="input" type="date" id="rTo" value="${to}"></label>
   <div class="row"><button class="btn sm" data-range="${tm1},${tm2}">This month</button><button class="btn sm" data-range="${lm1},${lm2}">Last month</button><button class="btn sm" data-range="${fyStart(t)},${t}">This FY</button><button class="btn sm" data-range="${t},${t}">Today</button></div></div>`;
}
const inRange=d=>d.date>=sub.from&&d.date<=sub.to;

    const rows=Object.values(g).sort((a,b)=>b.tx-a.tx);
    sub._export=()=>[["SKU","Item","HSN","Unit","Qty sold","Taxable","GST","Total"],...rows.map(r=>[r.sku,r.name,r.hsn,r.unit,r.q,r2(r.tx),r2(r.tax),r2(r.t)])];sub._file=`item-wise-sales_${sub.from}_to_${sub.to}.csv`;
    body=rangeFilters()+`<div class="row" style="justify-content:flex-end;margin-bottom:8px">${expBtns()}<button class="btn sm" data-act="exportReport">CSV</button></div><div class="tablewrap">${rows.length?`<table><thead><tr><th>SKU</th><th>Item</th><th>HSN</th><th class="num">Qty sold</th><th class="num">Taxable</th><th class="num">GST</th><th class="num">Total</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${esc(r.sku)}</td><td>${esc(r.name)}</td><td class="mono">${esc(r.hsn)}</td><td class="num">${qtyf(r.q)} ${esc(r.unit)}</td><td class="num">${amt(r.tx)}</td><td class="num">${amt(r.tax)}</td><td class="num">${amt(r.t)}</td></tr>`).join("")}</tbody></table>`:`<div class="empty"><b>No sales in this period</b>Change the dates above.</div>`}</div>`;
  }

    body=`<p class="muted">Current position across all dates. For live stock with status, see <button class="link" data-go="inventory">Inventory</button>.</p><div class="row" style="justify-content:flex-end;margin-bottom:8px">${expBtns()}<button class="btn sm" data-act="exportReport">CSV</button></div><div class="tablewrap">${rows.length?`<table><thead><tr><th>SKU</th><th>Item</th><th class="num">Opening</th><th class="num">In</th><th class="num">Out</th><th class="num">Closing</th><th class="num">Value at cost</th></tr></thead><tbody>${rows.map(([i,s])=>`<tr><td class="mono">${esc(i.sku)}</td><td>${esc(i.name)}</td><td class="num">${qtyf(s.open)}</td><td class="num">${qtyf(s.inQ)}</td><td class="num">${qtyf(s.outQ)}</td><td class="num">${qtyf(s.bal)}</td><td class="num">${amt(s.bal*num(i.purchasePrice))}</td></tr>`).join("")}</tbody></table>`:`<div class="empty"><b>No items yet</b></div>`}</div>`;
  }
  return `<div class="head"><div><h1>Reports</h1><div class="sub">Filter by date, review, and export CSV for your accountant or the GST offline tool.</div></div></div><div class="tabs" role="tablist">${T}</div>${body}`;
}

/* ---------- GSTR-3B summary ---------- */
function gstr3b(){
  const out={tx:0,i:0,c:0,s:0},nil={tx:0},pos={},itc={i:0,c:0,s:0},inw={inter:0,intra:0},unreg={tx:0};
  for(const sl of S.sales.filter(inRange)){if(sl.status==="cancelled")continue;const c=docCalc(sl),b2c=!sl.party?.gstin;
    for(const l of c.lines){if(l.gst>0){out.tx+=l.taxable;out.i+=l.igst;out.c+=l.cgst;out.s+=l.sgst;if(b2c&&sl.inter){const k=sl.pos;(pos[k]=pos[k]||{tx:0,i:0});pos[k].tx+=l.taxable;pos[k].i+=l.igst}}else nil.tx+=l.taxable}}
  for(const n of liveNotes("creditNotes").filter(inRange)){const c=noteCalc(n),b2c=!n.party?.gstin;
    for(const l of c.lines){if(l.gst>0){out.tx-=l.taxable;out.i-=l.igst;out.c-=l.cgst;out.s-=l.sgst;if(b2c&&n.inter){const k=n.pos;(pos[k]=pos[k]||{tx:0,i:0});pos[k].tx-=l.taxable;pos[k].i-=l.igst}}else nil.tx-=l.taxable}}
  for(const n of liveNotes("debitNotes").filter(inRange)){if(!n.party?.gstin)continue;const c=noteCalc(n);for(const l of c.lines)if(l.gst>0){itc.i-=l.igst;itc.c-=l.cgst;itc.s-=l.sgst}}
  for(const pu of S.purchases.filter(inRange)){const c=docCalc(pu);
    if(pu.party?.gstin){for(const l of c.lines){if(l.gst>0){itc.i+=l.igst;itc.c+=l.cgst;itc.s+=l.sgst}else inw[pu.inter?"inter":"intra"]+=l.taxable}}
    else unreg.tx+=c.taxable}
  const R=o=>{for(const k in o)o[k]=r2(o[k]);return o};R(out);R(itc);R(nil);R(inw);
  // set-off order (Rule 88A): IGST credit first (IGST → CGST → SGST), then CGST (CGST → IGST), then SGST (SGST → IGST)
  const pay={i:out.i,c:out.c,s:out.s},left={...itc},used={i:{i:0,c:0,s:0},c:{i:0,c:0,s:0},s:{i:0,c:0,s:0}};
  const u=(f,t)=>{const x=r2(Math.min(left[f],pay[t]));left[f]=r2(left[f]-x);pay[t]=r2(pay[t]-x);used[f][t]=r2(used[f][t]+x)};
  u("i","i");u("i","c");u("i","s");u("c","c");u("c","i");u("s","s");u("s","i");

function fyStartYear(iso){const [y,m]=iso.split("-").map(Number);return m>=4?y:y-1}
function fyOptions(sel){const ys=new Set([fyStartYear(todayISO())]);for(const c of ["sales","purchases","tds"])for(const d of S[c])if(d.date)ys.add(fyStartYear(d.date));return [...ys].sort((a,b)=>b-a).map(y=>`<option value="${y}"${y===sel?" selected":""}>FY ${y}-${String(y+1).slice(2)}</option>`).join("")}
const QTRS=[["Q1","Apr–Jun",4,6,"31 Jul"],["Q2","Jul–Sep",7,9,"31 Oct"],["Q3","Oct–Dec",10,12,"31 Jan"],["Q4","Jan–Mar",1,3,"31 May"]];
function qRange(fy,q){const Q=QTRS.find(x=>x[0]===q),y=q==="Q4"?fy+1:fy,p=n=>String(n).padStart(2,"0");return [`${y}-${p(Q[2])}-01`,`${y}-${p(Q[3])}-${p(new Date(y,Q[3],0).getDate())}`]}
function tdsReport(){
  const t=todayISO(),fy=sub.fy??fyStartYear(t);const curQ=(()=>{const m=+t.slice(5,7);return m>=4&&m<=6?"Q1":m<=9&&m>=7?"Q2":m>=10?"Q3":"Q4"})();
  const q=sub.q4||curQ;sub.fy=fy;sub.q4=q;const [a,b]=qRange(fy,q),Q=QTRS.find(x=>x[0]===q);
  const rows=S.tds.filter(e=>e.date>=a&&e.date<=b).sort((x,y)=>x.date.localeCompare(y.date));
  const tot=rows.reduce((o,e)=>(o.amt+=num(e.amount),o.tds+=num(e.tds),o.dep+=e.depDate?num(e.tds):0,o),{amt:0,tds:0,dep:0});
  const bySec={};for(const e of rows){const k=e.section;(bySec[k]=bySec[k]||{n:0,amt:0,tds:0});bySec[k].n++;bySec[k].amt+=num(e.amount);bySec[k].tds+=num(e.tds)}
  const noPan=rows.filter(e=>!e.pan).length,undep=rows.filter(e=>!e.depDate);
  const dueYear=q==="Q3"||q==="Q4"?fy+1:fy;
  sub._export=()=>[["Sr No","Deductee PAN","Deductee name","Nature of payment","Old section","Payment code","Date of payment/credit","Amount paid/credited","TDS rate %","TDS deducted","Date of deduction","BSR code","Challan serial no","Date of deposit","Reason for higher rate"],
    ...rows.map((e,i)=>{const s=tdsSec(e.section);return [i+1,e.pan||"PANNOTAVBL",e.payee,s.label,s.old,e.code||"",fmtDate(e.date),r2(num(e.amount)),e.rate,r2(num(e.tds)),fmtDate(e.date),e.bsr||"",e.challan||"",fmtDate(e.depDate||""),e.pan?"":"No PAN"]})];

    <div class="seg" role="group" aria-label="Quarter">${QTRS.map(([k,l])=>`<button type="button" data-q4="${k}" aria-pressed="${k===q}">${k}<small>${l}</small></button>`).join("")}</div>

  <div class="tiles">

   <div class="tile t-sales"><span class="ib">${ic("rupee")}</span><div class="k">Amount paid / credited</div><div class="v">${money(tot.amt)}</div><div class="n">${Q[1]} ${q==="Q4"?fy+1:fy}</div></div>

  <p class="hint" style="margin-top:10px">From 1 April 2026, TDS falls under section 393 of the Income-tax Act, 2025. The quarterly statement for payments to residents is Form 140, which replaces Form 26Q. Deposit TDS by the 7th of the next month (30 April for March). Statements are due 31 Jul, 31 Oct, 31 Jan and 31 May. Fill in the payment code for each entry from the current CBDT list, and check rates and thresholds with your tax adviser. The CSV gives deductee details to enter in the return preparation utility.</p>`;

function msmeReport(){
  const t=todayISO(),fy=sub.fy??fyStartYear(t);const h=sub.half||(+t.slice(5,7)>=4&&+t.slice(5,7)<=9?"H1":"H2");sub.fy=fy;sub.half=h;
  const a=h==="H1"?`${fy}-04-01`:`${fy}-10-01`,b=h==="H1"?`${fy}-09-30`:`${fy+1}-03-31`;
  const refDate=b<t?b:t;
  const msmeV=S.vendors.filter(v=>v.msme==="micro"||v.msme==="small");
  const rows=[];
  for(const p of S.purchases){const tm=purTerms(p);if(!tm.msme||p.date>b)continue;const g=docCalc(p).grand;
    if(p.paidOn&&p.paidOn<a)continue;
    if(p.paidOn&&p.paidOn<=b){if(p.paidOn>tm.msmeDue)rows.push({p,tm,g,status:"late",days:daysBetween(tm.msmeDue,p.paidOn)})}
    else if(tm.msmeDue<refDate)rows.push({p,tm,g,status:"overdue",days:daysBetween(tm.msmeDue,refDate)})}
  rows.sort((x,y)=>y.days-x.days);
  const od=rows.filter(r=>r.status==="overdue"),late=rows.filter(r=>r.status==="late");
  const sum=a=>a.reduce((s,r)=>s+r.g,0);
  // income-tax: unpaid to micro/small past the allowed days at FY end (31 March)
  const fyEnd=`${fy+1}-03-31`,disallow=S.purchases.filter(p=>{const tm=purTerms(p);return tm.msme&&p.date<=fyEnd&&(!p.paidOn||p.paidOn>fyEnd)&&tm.msmeDue<fyEnd}).reduce((s,p)=>s+docCalc(p).grand,0);
  sub._export=()=>[["Supplier","Category","Udyam no","PAN","Bill no","Bill date","Amount","Allowed days","Due date","Paid on","Days delayed","Status","Reason for delay"],
    ...rows.map(r=>[r.tm.v.name||r.p.party?.name,r.tm.v.msme,r.tm.v.udyam||"",r.tm.v.pan||"",r.p.billNo,fmtDate(r.p.date),r.g,r.tm.legal,fmtDate(r.tm.msmeDue),fmtDate(r.p.paidOn||""),r.days,r.status==="late"?"Paid late":"Outstanding",""])];
  sub._file=`MSME_dues_FY${fy}-${String(fy+1).slice(2)}_${h}.csv`;
  return `<div class="filters"><label class="f"><span>Financial year</span><select class="input" id="msFY">${fyOptions(fy)}</select></label>
    <div class="seg" role="group" aria-label="Half year"><button type="button" data-half="H1" aria-pressed="${h==="H1"}">Apr–Sep<small>Form 1 due 31 Oct</small></button><button type="button" data-half="H2" aria-pressed="${h==="H2"}">Oct–Mar<small>Form 1 due 30 Apr</small></button></div>
    <div class="row" style="margin-left:auto">${expBtns()}<button class="btn sm" data-act="exportReport">CSV</button></div></div>
  ${msmeV.length?"":`<div class="banner">No vendors are marked Micro or Small yet. Open Vendors, edit a supplier and set their MSME category and Udyam number.</div>`}
  <div class="tiles">
   <div class="tile t-stock"><span class="ib">${ic("clock")}</span><div class="k">Outstanding past due</div><div class="v">${money(sum(od))}</div><div class="n">${od.length} ${od.length===1?"bill":"bills"} as of ${fmtDate(refDate)}</div></div>
   <div class="tile t-buy"><span class="ib">${ic("check")}</span><div class="k">Paid late in period</div><div class="v">${money(sum(late))}</div><div class="n">${late.length} ${late.length===1?"bill":"bills"} paid after the limit</div></div>
   <div class="tile t-cash"><span class="ib">${ic("customers")}</span><div class="k">MSME suppliers</div><div class="v">${msmeV.length}</div><div class="n">Micro and small only</div></div>
   <div class="tile t-sales"><span class="ib">${ic("rupee")}</span><div class="k">Expense at risk on 31 Mar</div><div class="v">${money(disallow)}</div><div class="n">Unpaid past the limit at FY end</div></div>
  </div>
  <div class="tablewrap">${rows.length?`<table><thead><tr><th>Supplier</th><th>Udyam no.</th><th>Bill</th><th class="num">Amount</th><th>Must pay by</th><th>Paid on</th><th class="num">Days late</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.tm.v.name||r.p.party?.name)}</b><div class="hint">${esc(r.tm.v.msme||"")} · PAN ${esc(r.tm.v.pan||"—")}</div></td><td class="mono">${esc(r.tm.v.udyam||"—")}</td><td class="mono">${esc(r.p.billNo)}<div class="hint">${fmtDate(r.p.date)}</div></td><td class="num">${amt(r.g)}</td><td class="mono">${fmtDate(r.tm.msmeDue)}<div class="hint">${r.tm.legal} days</div></td><td class="mono">${r.p.paidOn?fmtDate(r.p.paidOn):"—"}</td><td class="num">${r.days}</td><td>${r.status==="late"?'<span class="chip warn">Paid late</span>':'<span class="chip bad">Outstanding</span>'}</td><td>${r.p.paidOn?"":`<button class="btn sm" data-pay-pur="${r.p.id}">Mark paid</button>`}</td></tr>`).join("")}</tbody></table>`:`<div class="empty"><b>No delayed MSME payments in this period</b>Bills from Micro and Small suppliers paid within the limit don't appear here.</div>`}</div>
  <p class="hint" style="margin-top:10px">Under the MSMED Act, Micro and Small suppliers must be paid within the agreed credit period, capped at 45 days, or within 15 days if there is no written agreement. Late payment attracts compound interest at three times the RBI bank rate. Companies report dues outstanding beyond 45 days in MSME Form 1 to the MCA (Apr–Sep by 31 Oct, Oct–Mar by 30 Apr); the CSV lists the details asked for. For income tax, amounts owed to micro and small enterprises and not paid within the allowed days can't be claimed as an expense until the year they are paid (old section 43B(h)). Confirm the treatment with your CA.</p>`;

/* ================= ACCOUNTS: double-entry books built from every transaction =================
   Ledgers: system ledgers (cash, bank, sales, GST…), one ledger per customer and vendor, and user ledgers.
   Postings are derived live from sales, receipts, purchases, payments, TDS and vouchers, so ledgers,
   trial balance, P&L and balance sheet always agree. Stock is valued at weighted average cost. */
const GROUPS=[
  ["capital","Capital Account","L"],["reserves","Reserves & Surplus","L"],["loans","Loans (Liability)","L"],
  ["creditors","Sundry Creditors","L"],["duties","Duties & Taxes","L"],["curliab","Current Liabilities & Provisions","L"],["suspense","Suspense Account","L"],
  ["fixed","Fixed Assets","A"],["invest","Investments","A"],["debtors","Sundry Debtors","A"],["cash","Cash-in-Hand","A"],["bank","Bank Accounts","A"],
  ["advances","Loans & Advances (Asset)","A"],["curassets","Other Current Assets","A"],
  ["sales","Sales Accounts","I","trading"],["dirinc","Direct Incomes","I","trading"],["indinc","Indirect Incomes","I","pl"],
  ["purchase","Purchase Accounts","E","trading"],["direxp","Direct Expenses","E","trading"],["indexp","Indirect Expenses","E","pl"],
];
const GRP=Object.fromEntries(GROUPS.map(([k,n,nat,pl])=>[k,{k,n,nat,pl}]));
const SYS_LEDGERS=[["sys:cash","Cash","cash"],["sys:bank","Bank Account","bank"],["sys:capital","Capital Account","capital"],
  ["sys:sales","Sales Account","sales"],["sys:purchase","Purchase Account","purchase"],
  ["sys:ocgst","Output CGST","duties"],["sys:osgst","Output SGST","duties"],["sys:oigst","Output IGST","duties"],
  ["sys:icgst","Input CGST","duties"],["sys:isgst","Input SGST","duties"],["sys:iigst","Input IGST","duties"],
  ["sys:tds","TDS Payable","duties"],["sys:round","Round Off","indexp"],["sys:b2c","Walk-in Customers (B2C)","debtors"],
  ["sys:salesret","Sales Returns","sales"],["sys:purret","Purchase Returns","purchase"]];
const EXP_PRESETS=[["Rent","indexp"],["Salaries & Wages","indexp"],["Electricity","indexp"],["Telephone & Internet","indexp"],["Shop Expenses","indexp"],
  ["Printing & Stationery","indexp"],["Bank Charges","indexp"],["Repairs & Maintenance","indexp"],["Travelling & Conveyance","indexp"],["Freight Inward","direxp"],
  ["Drawings","capital"],["Discount Received","indinc"],["Interest Received","indinc"]];
const VTYPES=[["Expense","EXP"],["Payment","PMT"],["Receipt","RCT"],["Contra","CTR"],["Journal","JV"]];
const sgn=o=>o?(o.openingType==="Cr"?-1:1)*num(o.opening):0;
function allLedgers(){
  const ov=Object.fromEntries(S.ledgers.map(l=>[l.id,l]));const out=[];
  for(const [id,name,group] of SYS_LEDGERS)out.push({id,name:ov[id]?.name||name,group,opening:sgn(ov[id]),kind:"sys",doc:ov[id]});
  for(const c of S.customers)out.push({id:"c:"+c.id,name:c.name,group:"debtors",opening:sgn(ov["c:"+c.id]),kind:"cust",doc:ov["c:"+c.id]});
  for(const v of S.vendors)out.push({id:"v:"+v.id,name:v.name,group:"creditors",opening:sgn(ov["v:"+v.id]),kind:"vend",doc:ov["v:"+v.id]});
  for(const l of S.ledgers)if(!/^(sys|c|v):/.test(l.id))out.push({id:l.id,name:l.name,group:l.group,opening:sgn(l),kind:"user",doc:l});
  // parties referenced by bills but no longer in the masters keep a ledger named from the bill
  const seen=new Set(out.map(l=>l.id));
  for(const x of S.sales)if(x.partyId&&!seen.has("c:"+x.partyId)){seen.add("c:"+x.partyId);out.push({id:"c:"+x.partyId,name:x.party?.name||"Customer",group:"debtors",opening:sgn(ov["c:"+x.partyId]),kind:"cust",doc:ov["c:"+x.partyId]})}
  for(const x of S.purchases)if(x.partyId&&!seen.has("v:"+x.partyId)){seen.add("v:"+x.partyId);out.push({id:"v:"+x.partyId,name:x.party?.name||"Vendor",group:"creditors",opening:sgn(ov["v:"+x.partyId]),kind:"vend",doc:ov["v:"+x.partyId]})}
  return out;
}
const ledgerById=id=>allLedgers().find(l=>l.id===id);
const cashBankLedgers=()=>allLedgers().filter(l=>l.group==="cash"||l.group==="bank");
function buildPostings(){
  const P=[],B=S.settings,upiL=B.upiLedger||"sys:bank",cardL=B.cardLedger||upiL;
  const add=(date,type,no,narr,lines,link)=>{lines=lines.map(l=>({l:l.l,dr:r2(num(l.dr)),cr:r2(num(l.cr))})).filter(l=>l.dr>0.004||l.cr>0.004);if(lines.length&&date)P.push({date,type,no,narr,lines,link})};
  for(const s of S.sales){if(s.status==="cancelled")continue;const c=docCalc(s),party=s.partyId?"c:"+s.partyId:"sys:b2c";
    const L=[{l:party,dr:c.grand},{l:"sys:sales",cr:c.taxable},{l:"sys:ocgst",cr:c.cgst},{l:"sys:osgst",cr:c.sgst},{l:"sys:oigst",cr:c.igst}];
    if(c.round>0)L.push({l:"sys:round",cr:c.round});else if(c.round<0)L.push({l:"sys:round",dr:-c.round});
    add(s.date,"Sales",s.no,`Sales to ${s.party?.name||""}`,L,{kind:"sale",id:s.id});
    const p=payInfo(s);
    if(p.status==="paid"){const into=p.mode==="Cash"?"sys:cash":p.mode==="Card"?cardL:upiL;let d=s.paidAt?isoLocal(s.paidAt):s.date;if(d<s.date)d=s.date;
      add(d,"Receipt",s.no,`${p.mode} received from ${s.party?.name||""}`,[{l:into,dr:c.grand},{l:party,cr:c.grand}],{kind:"sale",id:s.id})}}
  for(const pu of S.purchases){const c=docCalc(pu),party="v:"+pu.partyId,reg=!!pu.party?.gstin;
    const L=[{l:party,cr:c.grand}];
    if(reg)L.push({l:"sys:purchase",dr:c.taxable},{l:"sys:icgst",dr:c.cgst},{l:"sys:isgst",dr:c.sgst},{l:"sys:iigst",dr:c.igst});
    else L.push({l:"sys:purchase",dr:r2(c.taxable+c.tax)});
    if(c.round>0)L.push({l:"sys:round",dr:c.round});else if(c.round<0)L.push({l:"sys:round",cr:-c.round});
    add(pu.date,"Purchase",pu.billNo,`Purchase from ${pu.party?.name||""}`,L,{kind:"purchase",id:pu.id});
    const td=S.tds.find(x=>x.purchaseId===pu.id),t=td?r2(num(td.tds)):0;
    if(t>0)add(pu.date,"Journal",pu.billNo,`TDS deducted on bill ${pu.billNo}`,[{l:party,dr:t},{l:"sys:tds",cr:t}],{kind:"tds",id:td.id});
    if(pu.paidOn)add(pu.paidOn,"Payment",pu.billNo,`Paid to ${pu.party?.name||""}`,[{l:party,dr:r2(c.grand-t)},{l:pu.paidFrom||"sys:bank",cr:r2(c.grand-t)}],{kind:"purchase",id:pu.id})}
  for(const e of S.tds){const a=r2(num(e.amount)),t=r2(num(e.tds));
    if(!e.purchaseId&&e.expLedger)add(e.date,"Payment","TDS",`${e.payee} · ${tdsSec(e.section).label}`,[{l:e.expLedger,dr:a},{l:"sys:tds",cr:t},{l:e.paidFrom||"sys:bank",cr:r2(a-t)}],{kind:"tds",id:e.id});
    if(e.depDate&&t>0)add(e.depDate,"Payment","TDS",`TDS deposited · ${e.payee}${e.challan?" · challan "+e.challan:""}`,[{l:"sys:tds",dr:t},{l:e.depFrom||"sys:bank",cr:t}],{kind:"tds",id:e.id})}
  for(const n of S.creditNotes){if(n.status==="cancelled")continue;const c=noteCalc(n),party=n.partyId?"c:"+n.partyId:"sys:b2c";
    const L=[{l:"sys:salesret",dr:c.taxable},{l:"sys:ocgst",dr:c.cgst},{l:"sys:osgst",dr:c.sgst},{l:"sys:oigst",dr:c.igst},{l:party,cr:c.grand}];
    if(c.round>0)L.push({l:"sys:round",dr:c.round});else if(c.round<0)L.push({l:"sys:round",cr:-c.round});
    add(n.date,"Credit Note",n.no,`${n.reason} · ${n.party?.name||""} (against ${n.srcNo})`,L,{kind:"cn",id:n.id});
    if(n.refund&&n.refund!=="adjust")add(n.date,"Payment",n.no,`Refund to ${n.party?.name||""}`,[{l:party,dr:c.grand},{l:n.refund,cr:c.grand}],{kind:"cn",id:n.id})}
  for(const n of S.debitNotes){if(n.status==="cancelled")continue;const c=noteCalc(n),party="v:"+n.partyId,reg=!!n.party?.gstin;
    const L=[{l:party,dr:c.grand}];
    if(reg)L.push({l:"sys:purret",cr:c.taxable},{l:"sys:icgst",cr:c.cgst},{l:"sys:isgst",cr:c.sgst},{l:"sys:iigst",cr:c.igst});else L.push({l:"sys:purret",cr:r2(c.taxable+c.tax)});
    if(c.round>0)L.push({l:"sys:round",cr:c.round});else if(c.round<0)L.push({l:"sys:round",dr:-c.round});
    add(n.date,"Debit Note",n.no,`${n.reason} · ${n.party?.name||""} (bill ${n.srcNo})`,L,{kind:"dn",id:n.id});
    if(n.refund&&n.refund!=="adjust")add(n.date,"Receipt",n.no,`Refund from ${n.party?.name||""}`,[{l:n.refund,dr:c.grand},{l:party,cr:c.grand}],{kind:"dn",id:n.id})}
  for(const v of S.vouchers)add(v.date,v.type,v.no,v.narration||"",v.lines||[],{kind:"voucher",id:v.id});
  P.sort((a,b)=>a.date.localeCompare(b.date));
  return P;
}
/* stock value at a date: quantity on hand × weighted average purchase cost */
function stockValueAt(date){
  let v=0;
  for(const it of S.items){let q=num(it.openingStock),cq=q,cost=q*num(it.purchasePrice);
    for(const p of S.purchases)if(p.date<=date)for(const l of p.lines||[])if(l.itemId===it.id){const lq=num(l.qty);q+=lq;cq+=lq;cost+=lq*num(l.rate)*(1-num(l.disc)/100)}
    for(const s of S.sales)if(s.status!=="cancelled"&&s.date<=date)for(const l of s.lines||[])if(l.itemId===it.id)q-=num(l.qty);
    for(const n of S.creditNotes)if(n.status!=="cancelled"&&n.restock&&n.date<=date)for(const l of n.lines||[])if(l.itemId===it.id)q+=num(l.qty);
    for(const n of S.debitNotes)if(n.status!=="cancelled"&&n.restock&&n.date<=date)for(const l of n.lines||[])if(l.itemId===it.id){const lq=num(l.qty);q-=lq;cq-=lq;cost-=lq*num(l.rate)}
    const avg=cq>0?cost/cq:num(it.purchasePrice);if(q>0)v+=q*avg}
  return r2(v);
}
const dayBefore=iso=>addDays(iso,-1);
/* period books: balance-sheet ledgers cumulative to T; P&L ledgers for F..T; prior P&L rolls into "Profit & Loss A/c" */
function books(F,T){
  const P=buildPostings(),L=allLedgers(),map={};
  for(const l of L)map[l.id]={...l,open:0,dr:0,cr:0,close:0};
  const get=id=>map[id]||(map[id]={id,name:"Unknown ledger "+id,group:"suspense",opening:0,kind:"lost",open:0,dr:0,cr:0,close:0});
  let priorIE=0;
  for(const l of Object.values(map))if(GRP[l.group]?.nat==="A"||GRP[l.group]?.nat==="L")l.open=l.opening;
  for(const p of P)for(const x of p.lines){const l=get(x.l),nat=GRP[l.group]?.nat||"L",d=x.dr-x.cr;
    if(p.date<F){if(nat==="I"||nat==="E")priorIE+=d;else l.open+=d}
    else if(p.date<=T){l.dr+=x.dr;l.cr+=x.cr}}
  for(const l of Object.values(map))l.close=r2(l.open+l.dr-l.cr);
  const OS_init=stockValueAt("0000-01-01"),OS=stockValueAt(dayBefore(F)),CS=stockValueAt(T);
  const P0=r2(-priorIE+OS-OS_init);
  const list=Object.values(map);
  const tbSum=r2(list.reduce((a,l)=>a+l.close,0)+OS-P0);
  return {F,T,P,map,list,OS,CS,OS_init,P0,diff:tbSum};
}
function plFigures(bk){
  const by=g=>bk.list.filter(l=>l.group===g&&Math.abs(l.close)>0.004);
  const incAmt=l=>-l.close,expAmt=l=>l.close,tot=(arr,f)=>r2(arr.reduce((a,l)=>a+f(l),0));
  const sales=by("sales"),dirinc=by("dirinc"),indinc=by("indinc"),purch=by("purchase"),direxp=by("direxp"),indexp=by("indexp");
  const tradeCr=r2(tot(sales,incAmt)+tot(dirinc,incAmt)+bk.CS),tradeDr=r2(bk.OS+tot(purch,expAmt)+tot(direxp,expAmt));
  const GP=r2(tradeCr-tradeDr),NP=r2(GP+tot(indinc,incAmt)-tot(indexp,expAmt));
  return {sales,dirinc,indinc,purch,direxp,indexp,incAmt,expAmt,tot,GP,NP,tradeCr,tradeDr};
}
const balTxt=v=>Math.abs(v)<0.005?"0.00":`${amt(Math.abs(v))} ${v>0?"Dr":"Cr"}`;
const neg=v=>v<0?`(${amt(-v)})`:amt(v);

function vAccounts(){
  const tab=sub.atab||"ledgers";

function ledgerStatement(id,F,T,P){
  const l=ledgerById(id);if(!l)return null;const nat=GRP[l.group]?.nat;P=P||buildPostings();
  let open=nat==="A"||nat==="L"?l.opening:0;const rows=[];
  for(const p of P){const mine=p.lines.filter(x=>x.l===id);if(!mine.length)continue;const d=r2(mine.reduce((a,x)=>a+x.dr,0)),c=r2(mine.reduce((a,x)=>a+x.cr,0));
    if(p.date<F){if(nat==="A"||nat==="L")open+=d-c;continue}if(p.date>T)continue;
    const others=p.lines.filter(x=>x.l!==id).map(x=>ledgerById(x.l)?.name||x.l);rows.push({date:p.date,type:p.type,no:p.no,part:[...new Set(others)].slice(0,2).join(", ")+(new Set(others).size>2?" & more":""),narr:p.narr,dr:d,cr:c,link:p.link})}
  let bal=r2(open);for(const r of rows){bal=r2(bal+r.dr-r.cr);r.bal=bal}
  return {l,open:r2(open),rows,close:bal,dr:r2(rows.reduce((a,r)=>a+r.dr,0)),cr:r2(rows.reduce((a,r)=>a+r.cr,0))};
}

  foot:["","Closing balance","","","",st.dr,st.cr,Math.abs(st.close),st.close>=0?"Dr":"Cr"]}}

function bsData(bk,pf){

  for(const g of ["reserves","loans","creditors","curliab","suspense"])L.push(...groupRows(by(g),cr,GRP[g].n));

  async function loadAll(){const d=await api("/api/data");for(const c of COLLS)S[c]=d.colls[c]||[];S.settings=d.settings||{};S.counters=d.counters||{}}
  const connect=()=>{try{es&&es.close()}catch(e){}
    es=new EventSource(normUrl(SRV.url)+"/api/events?token="+encodeURIComponent(SRV.token));
    es.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
      if(m.type==="hello"){if(!alive){alive=true;if(es._seen)loadAll().then(()=>{setConn(true);scheduleRender()});else{es._seen=true;setConn(true)}}}
      else if(m.type==="put"){upd(m.coll,m.doc);scheduleRender()}
      else if(m.type==="del"){S[m.coll]=S[m.coll].filter(x=>x.id!==m.id);scheduleRender()}
      else if(m.type==="settings"){S.settings=m.doc;scheduleRender()}
      else if(m.type==="counters"){S.counters=m.counters}
      else if(m.type==="reload"){loadAll().then(scheduleRender)}
      else if(m.type==="audit"){if(view==="audit"&&!$("#modalRoot").firstChild){auditCache=null;scheduleRender()}}
      else if(m.type==="users"){refreshMe()}};
    es.onerror=()=>{if(alive){alive=false;setConn(false)}};
  };
  return {kind:"server",loadAll,
    async init(){await loadAll();connect()},
    async put(coll,obj){const ex=S[coll].find(x=>x.id===obj.id);
      const r=await api(`/api/doc/${coll}/${encodeURIComponent(obj.id)}`,{method:"PUT",body:{doc:obj,baseRev:ex?._rev||0}}).catch(e=>{if(e.code==="conflict"){if(e.current)upd(coll,e.current);else S[coll]=S[coll].filter(x=>x.id!==obj.id);scheduleRender()}throw e});
      upd(coll,r.doc);scheduleRender();return r.doc},
    async remove(coll,id){const ex=S[coll].find(x=>x.id===id);await api(`/api/doc/${coll}/${encodeURIComponent(id)}?baseRev=${ex?._rev||0}`,{method:"DELETE"});S[coll]=S[coll].filter(x=>x.id!==id);scheduleRender()},
    async saveSettings(o){const r=await api("/api/settings",{method:"PUT",body:{doc:o,baseRev:S.settings._rev||0}}).catch(e=>{if(e.code==="conflict"&&e.current){S.settings=e.current;scheduleRender()}throw e});S.settings=r.doc;scheduleRender()},
    async nextSeq(fy,floor){return (await api("/api/seq",{method:"POST",body:{fy,floor}})).n},
    async resetCounters(map){await api("/api/counters",{method:"POST",body:{map}});S.counters=map},
    close(){try{es&&es.close()}catch(e){}}};
}

async function readLocalStore(){
  const out={settings:{},counters:{}};for(const c of COLLS)out[c]=[];
  const idb=await idbOpen();
  const all=await new Promise((res,rej)=>{const o=[];const c=idb.transaction("kv","readonly").objectStore("kv").openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){o.push([cur.key,cur.value]);cur.continue()}else res(o)};c.onerror=()=>rej(c.error)});
  for(const [k,v] of all){const [coll]=String(k).split("/");if(COLLS.includes(coll))out[coll].push(v);else if(k==="settings")out.settings=v;else if(k==="counters")out.counters=v}
  return out;
}

/* ---------- GSTIN checksum (mod-36) ---------- */
function gstinChecksumOk(g){
  g=String(g||"").toUpperCase();if(!GSTIN_RE.test(g))return false;
  const cs="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";let sum=0;
  for(let i=0;i<14;i++){const v=cs.indexOf(g[i]),p=v*(i%2?2:1);sum+=Math.floor(p/36)+(p%36)}
  return cs[(36-(sum%36))%36]===g[14];
}

/* ---------- GSTR-1 data (shared by the screen and the portal JSON) ---------- */
function gstr1Data(F,T){
  const B2CL_LIMIT=100000,inR=d=>d.date>=F&&d.date<=T;
  const sales=S.sales.filter(inR),live=sales.filter(s=>s.status!=="cancelled");
  const rateRows=lines=>{const g={};for(const l of lines){(g[l.gst]=g[l.gst]||{rate:l.gst,tx:0,c:0,sg:0,i:0});g[l.gst].tx+=l.taxable;g[l.gst].c+=l.cgst;g[l.gst].sg+=l.sgst;g[l.gst].i+=l.igst}return Object.values(g).map(r=>({...r,tx:r2(r.tx),c:r2(r.c),sg:r2(r.sg),i:r2(r.i)}))};
  const b2b=live.filter(s=>s.party?.gstin),b2cl=live.filter(s=>!s.party?.gstin&&s.inter&&docCalc(s).grand>B2CL_LIMIT),b2clIds=new Set(b2cl.map(s=>s.id));
  const b2csSrc=live.filter(s=>!s.party?.gstin&&!b2clIds.has(s.id));
  const cns=liveNotes("creditNotes").filter(inR);
  const cnB2B=cns.filter(n=>n.party?.gstin),cnRest=cns.filter(n=>!n.party?.gstin);
  const srcB2CL=n=>{const s=byId("sales",n.srcId);return s&&!s.party?.gstin&&s.inter&&docCalc(s).grand>B2CL_LIMIT};
  const cnB2CL=cnRest.filter(srcB2CL),cnB2CS=cnRest.filter(n=>!srcB2CL(n));
  const cs={};
  const addCS=(pos,inter,rr,sign)=>{for(const r of rr){const k=pos+"|"+r.rate;(cs[k]=cs[k]||{pos,rate:r.rate,tx:0,c:0,sg:0,i:0,inter});cs[k].tx+=sign*r.tx;cs[k].c+=sign*r.c;cs[k].sg+=sign*r.sg;cs[k].i+=sign*r.i}};
  for(const s of b2csSrc)addCS(s.pos,s.inter,rateRows(docCalc(s).lines),1);
  for(const n of cnB2CS)addCS(n.pos,n.inter,rateRows(noteCalc(n).lines),-1);
  const b2cs=Object.values(cs).map(r=>({...r,tx:r2(r.tx),c:r2(r.c),sg:r2(r.sg),i:r2(r.i)})).filter(r=>Math.abs(r.tx)>0.004).sort((a,b)=>(a.pos+a.rate).localeCompare(b.pos+b.rate));
  const hsnOf=(docs,notes)=>{const h={};const add=(lines,sign)=>{for(const l of lines){const k=l.hsn+"|"+l.gst+"|"+l.unit;(h[k]=h[k]||{hsn:l.hsn,desc:l.name,unit:l.unit,rate:l.gst,q:0,tx:0,c:0,sg:0,i:0});h[k].q+=sign*l.qty;h[k].tx+=sign*l.taxable;h[k].c+=sign*l.cgst;h[k].sg+=sign*l.sgst;h[k].i+=sign*l.igst}};
    for(const s of docs)add(docCalc(s).lines,1);for(const n of notes)add(noteCalc(n).lines,-1);
    return Object.values(h).map(r=>({...r,q:Math.round(r.q*1000)/1000,tx:r2(r.tx),c:r2(r.c),sg:r2(r.sg),i:r2(r.i)})).sort((a,b)=>String(a.hsn).localeCompare(String(b.hsn)))};
  const hsnB2B=hsnOf(b2b,cnB2B),hsnB2C=hsnOf(live.filter(s=>!s.party?.gstin),cnRest);
  const series=(list,nature)=>{const g={};for(const s of list){const k=String(s.no).slice(0,String(s.no).lastIndexOf("/")+1);(g[k]=g[k]||[]).push(s)}
    return Object.values(g).map(l=>{l.sort((a,b)=>a.seq-b.seq);return {nature,from:l[0].no,to:l[l.length-1].no,total:l.length,cancel:l.filter(x=>x.status==="cancelled").length}})};
  const docs=[...series(sales,"Invoices for outward supply"),...series(S.creditNotes.filter(inR),"Credit Note")];
  return {b2b,b2cl,b2cs,cnB2B,cnB2CL,cnB2CS,hsnB2B,hsnB2C,docs,rateRows,live,sales};
}

  const hs=rows=>rows.map((r,i)=>({num:i+1,hsn_sc:String(r.hsn||""),desc:String(r.desc||"").slice(0,30),user_desc:String(r.desc||"").slice(0,30),uqc:String(r.unit||"NOS").toUpperCase(),qty:r.q,rt:r.rate,txval:r.tx,iamt:r.i,camt:r.c,samt:r.sg,csamt:0}));
  out.hsn={hsn_b2b:hs(d.hsnB2B),hsn_b2c:hs(d.hsnB2C)};
  if(d.docs.length){const inv=d.docs.filter(x=>x.nature!=="Credit Note"),cn=d.docs.filter(x=>x.nature==="Credit Note");const det=[];
    const docsOf=l=>l.map((x,i)=>({num:i+1,from:x.from,to:x.to,totnum:x.total,cancel:x.cancel,net_issue:x.total-x.cancel}));
    if(inv.length)det.push({doc_num:1,docs:docsOf(inv)});if(cn.length)det.push({doc_num:5,docs:docsOf(cn)});out.doc_issue={doc_det:det}}
  return out;
}
async function downloadGstr1Json(F,T){

function outstandingData(asAt){
  const age=d=>Math.max(0,daysBetween(d,asAt)),bucket=n=>n<=30?0:n<=60?1:n<=90?2:3;
  const cnBySale={};for(const n of liveNotes("creditNotes"))if(n.refund==="adjust")cnBySale[n.srcId]=(cnBySale[n.srcId]||0)+noteCalc(n).grand;
  const rec=S.sales.filter(s=>s.status!=="cancelled"&&s.date<=asAt&&payInfo(s).status!=="paid").map(s=>{const due=r2(docCalc(s).grand-(cnBySale[s.id]||0));return {d:s,party:s.party?.name||"",phone:s.party?.phone||"",key:s.partyId||("b2c:"+(s.party?.phone||s.party?.name)),no:s.no,date:s.date,amt:due,days:age(s.date)}}).filter(r=>r.amt>0.009);
