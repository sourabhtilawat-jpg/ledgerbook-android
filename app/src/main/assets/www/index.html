  {const el=$("#ledQ");if(el)el.addEventListener("input",()=>{sub.lq=el.value;clearTimeout(el._t);el._t=setTimeout(()=>{const pos=el.selectionStart;renderView();const n=$("#ledQ");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}},200)})}
  {const el=$("#stmtL");if(el)el.addEventListener("change",()=>{sub.lid=el.value;renderView()})}
  for(const [id,k] of [["#upiLed","upiLedger"],["#cardLed","cardLedger"]]){const el=$(id);if(el)el.addEventListener("change",async()=>{await guard(()=>backend.saveSettings({...S.settings,[k]:el.value}));toast("Saved")})}
  for(const id of ["#tdsFY","#msFY"]){const el=$(id);if(el)el.addEventListener("change",()=>{sub.fy=+el.value;renderView()})}
  for(const [id,k] of [["#sFrom","from"],["#sTo","to"],["#rFrom","from"],["#rTo","to"]]){const el=$(id);if(el)el.addEventListener("change",()=>{sub[k]=el.value;renderView()})}
  if($("#saveSettings"))$("#saveSettings").onclick=async()=>{
    const g=$("#st_gstin").value.trim().toUpperCase(),stc=$("#st_state").value;
    if(!$("#st_name").value.trim()||!stc){$("#stErr").innerHTML=`<div class="err">Enter the business name and choose your state.</div>`;return}
    if(g&&!GSTIN_RE.test(g)){$("#stErr").innerHTML=`<div class="err">GSTIN format looks wrong. It has 15 characters and starts with your state code.</div>`;return}
    if(g&&!gstinChecksumOk(g)){$("#stErr").innerHTML=`<div class="err">This GSTIN fails the checksum test, so one character is probably mistyped. Check it against your registration certificate.</div>`;return}
    if($("#st_pin").value.trim()&&!/^\d{6}$/.test($("#st_pin").value.trim())){$("#stErr").innerHTML=`<div class="err">PIN code has 6 digits.</div>`;return}
    if(g&&g.slice(0,2)!==stc){$("#stErr").innerHTML=`<div class="err">GSTIN starts with ${g.slice(0,2)} but the state is ${stc}. Make them match.</div>`;return}
    const vpa=$("#st_upiId").value.trim();
    if(vpa&&!/^[\w.\-]{2,256}@[a-zA-Z][a-zA-Z0-9.\-]{1,63}$/.test(vpa)){$("#stErr").innerHTML=`<div class="err">The UPI ID looks wrong. It has the form name@bank, for example shopname@okhdfcbank.</div>`;return}
    if($("#st_waMode").value==="api"&&(!$("#st_waPid").value.trim()||!$("#st_waTok").value.trim()||!$("#st_waTpl").value.trim())){$("#stErr").innerHTML=`<div class="err">Automatic sending needs the phone number ID, access token and template name from your Meta WhatsApp Business account.</div>`;return}
    await guard(()=>backend.saveSettings({...S.settings,name:$("#st_name").value.trim(),gstin:g,address:$("#st_addr").value.trim(),state:stc,city:$("#st_city").value.trim(),pin:$("#st_pin").value.trim(),einvoice:$("#st_einv").checked,phone:$("#st_phone").value.trim(),email:$("#st_email").value.trim(),prefix:$("#st_prefix").value.trim(),bank:$("#st_bank").value.trim(),invNote:$("#st_note").value.trim(),terms:$("#st_terms").value.trim(),
      upiId:$("#st_upiId").value.trim(),upiName:$("#st_upiName").value.trim(),
      waMode:$("#st_waMode").value,waMsg:$("#st_waMsg").value,printLayout:$("#st_print").value,autoPrint:$("#st_autoPrint").checked,
      waApiPhoneId:$("#st_waPid").value.trim(),waApiToken:$("#st_waTok").value.trim(),waApiTemplate:$("#st_waTpl").value.trim(),waApiLang:$("#st_waLang").value.trim(),waApiVars:$("#st_waVars").value.trim()}));toast("Settings saved");
  };
  if($("#qrFile"))$("#qrFile").onchange=e=>{const f=e.target.files[0];if(!f)return;
    if(!/^image\//.test(f.type)){$("#qrMsg").innerHTML=`<div class="err">Choose an image file (photo or screenshot of your QR code).</div>`;return}
    const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=async()=>{
      const max=640,k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
      const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
      let data=cv.toDataURL("image/png");if(data.length>180000)data=cv.toDataURL("image/jpeg",0.9);
      try{await guard(()=>backend.saveSettings({...S.settings,upiQr:data}));toast("QR code saved")}catch(err){}
    };img.onerror=()=>{$("#qrMsg").innerHTML=`<div class="err">That image could not be read. Try a PNG or JPG screenshot.</div>`};img.src=rd.result};rd.readAsDataURL(f)};
  if($("#qrDel"))$("#qrDel").onclick=async()=>{const n={...S.settings};delete n.upiQr;await guard(()=>backend.saveSettings(n));toast("QR code removed")};
  if($("#st_waMode"))$("#st_waMode").onchange=e=>{$("#apiBox").hidden=e.target.value!=="api"};
  if($("#restoreF"))$("#restoreF").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.items))throw 0;
    $("#dataMsg").innerHTML=`<div class="confirm"><span>Restore ${d.items.length} items, ${d.customers?.length||0} customers, ${d.vendors?.length||0} vendors, ${d.purchases?.length||0} purchases and ${d.sales?.length||0} invoices? Existing records with the same IDs are overwritten.</span><button class="btn sm danger" id="doRestore">Restore</button></div>`;
    $("#doRestore").onclick=async()=>{for(const c of COLLS)for(const o of d[c]||[])await backend.put(c,o);if(d.settings)await backend.saveSettings(d.settings);if(d.counters)await backend.resetCounters(d.counters);$("#dataMsg").innerHTML="";toast("Backup restored")}}catch(err){$("#dataMsg").innerHTML=`<div class="err">That file is not a Ledgerbook backup.</div>`}};rd.readAsText(f)};
}
$("#main").addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-go]");if(!t)return;
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.tab){sub={tab:t.dataset.tab,part:sub.part,from:sub.from,to:sub.to,fy:sub.fy};return renderView()}
  if(t.dataset.part){sub.part=t.dataset.part;return renderView()}
  if(t.dataset.hsntab){sub.hsnTab=t.dataset.hsntab;return renderView()}
  if(t.dataset.q4){sub.q4=t.dataset.q4;return renderView()}
  if(t.dataset.half){sub.half=t.dataset.half;return renderView()}
  if(t.dataset.editTds)return openTdsForm(t.dataset.editTds);
  if(t.dataset.atab){sub={atab:t.dataset.atab,from:sub.from,to:sub.to,lid:sub.lid};return renderView()}
  if(t.dataset.stmt){if(view!=="accounts")go("accounts");sub.atab="statement";sub.lid=t.dataset.stmt;return renderView()}
  if(t.dataset.editLedger)return openLedgerForm(t.dataset.editLedger);
  if(t.dataset.editUser)return openUserForm(t.dataset.editUser);
  if(t.dataset.stab){sub={stab:t.dataset.stab};return renderView()}
  if(t.dataset.ptab){sub={ptab:t.dataset.ptab};return renderView()}
  if(t.dataset.note){const [k,id]=t.dataset.note.split(":");return viewNote(k,id)}
  if(t.dataset.quote)return viewQuote(t.dataset.quote);
  if(t.dataset.ewb)return openEwbForm(t.dataset.ewb);
  if(t.dataset.irn)return openIrnForm(t.dataset.irn);
  if(t.dataset.os){sub.os=t.dataset.os;return renderView()}
  if(t.dataset.go3b){go("reports");sub.tab="gstr3b";const [a,b]=monthRange(-1);sub.from=a;sub.to=b;return renderView()}
  if(t.dataset.goewb){go("reports");sub.tab="ewb";return renderView()}
  if(t.dataset.audit!==undefined)return openAuditDetail(+t.dataset.audit);
  if(t.dataset.editVoucher)return openVoucherForm(null,t.dataset.editVoucher);
  if(t.dataset.payPur){const pu=byId("purchases",t.dataset.payPur);if(pu){await guard(()=>backend.put("purchases",{...pu,paidOn:todayISO()}));toast(`Bill ${pu.billNo} marked paid today`)}return}
  if(t.dataset.range){const [a,b]=t.dataset.range.split(",");sub.from=a;sub.to=b;return renderView()}
  if(t.dataset.editItem)return openItemForm(t.dataset.editItem);
  if(t.dataset.editParty){const [c,id]=t.dataset.editParty.split(":");return openPartyForm(c,id)}
  if(t.dataset.viewSale)return viewSale(t.dataset.viewSale);
  if(t.dataset.viewPur)return openPurchaseForm(t.dataset.viewPur);
  const a=t.dataset.act;if(!a)return;
  if(a==="newItem")openItemForm();
  if(a==="newSale")openSaleForm();
  if(a==="newPurchase")openPurchaseForm();
  if(a==="newCustomer")openPartyForm("customers");
  if(a==="newVendor")openPartyForm("vendors");
  if(a==="newTds")openTdsForm();
  if(a==="newLedger")openLedgerForm();
  if(a==="newUser")return openUserForm();
  if(a==="newQuote")return openSaleForm({quote:true});
  if(a==="gstr1json"||a==="gstr1jsonThis")return downloadGstr1Json(t.dataset.f,t.dataset.t);
  if(a==="ewbBulk"){const list=S.sales.filter(inRange).filter(x=>ewbNeeded(x)&&!x.ewb?.no);return downloadEwbJson(list)}
  if(a==="einvBulk"){const list=S.sales.filter(inRange).filter(x=>x.status!=="cancelled"&&x.party?.gstin&&!x.irn?.irn);const bad=list.find(x=>einvProblems(x).length);if(bad){toast(`${bad.no}: add ${einvProblems(bad).join(", ")}`);return}return saveFile(`EINV_${todayISO()}_${list.length}.json`,new Blob([JSON.stringify(list.map(einvJson),null,1)],{type:"application/json"}),"application/json")}
  if(a==="connect")return openConnectForm();
  if(a==="signOut")return signOut();
  if(a==="changePw")return openPasswordForm();
  if(a==="uploadLocal")return uploadLocalData();
  if(a==="disconnect"){return confirmIn("#dataMsg","Stop using the server on this device? You'll go back to the offline books saved on this device. Nothing on the server is deleted.",()=>{try{backend.close()}catch(e){}srvSave(null);location.reload()})}
  if(a==="hostStart"){try{await NATIVE.serverStart();toast("Server started")}catch(e){toast("Couldn't start the server: "+(e.message||e))}return refreshHostBox()}
  if(a==="hostStop"){await NATIVE.serverStop();toast("Server stopped");return refreshHostBox()}
  if(a==="useLocalServer"){const i=await NATIVE.serverInfo();const h=await api("/api/health",{url:i.local,token:null});return showGate({url:i.local,setup:h.setup})}
  if(a==="newVoucher")openVoucherForm(t.dataset.vt||"Expense");
  if(a==="exportXlsx"||a==="exportPdf"){const d=currentExportDoc();if(!d){toast("Nothing to export here");return}return a==="exportXlsx"?exportXlsx(d):exportPdf(d)}
  if(a==="exportAllLedgers")return exportAllLedgers();
  if(a==="presetLedgers"){const have=new Set(allLedgers().map(l=>l.name.toLowerCase()));for(const [n,g] of EXP_PRESETS)if(!have.has(n.toLowerCase()))await guard(()=>backend.put("ledgers",{id:"L"+uid(),name:n,group:g,opening:0,openingType:"Dr"}));toast("Common ledgers added");return}
  if(a==="exportReport"&&sub._export)saveFile(sub._file,csv(sub._export()),"text/csv");
  if(a==="exportStock")saveFile(`stock_${todayISO()}.csv`,csv([["SKU","Item","HSN","Unit","Opening","Purchased","Sold","In stock","Value at cost"],...S.items.map(i=>{const s=stockOf(i.id);return [i.sku,i.name,i.hsn,i.unit,s.open,s.inQ,s.outQ,s.bal,r2(s.bal*num(i.purchasePrice))]})]),"text/csv");
  if(a==="backup"){const counters={};for(const s of S.sales)counters[s.fy]=Math.max(counters[s.fy]||0,num(s.seq));saveFile(`ledgerbook-backup_${todayISO()}.json`,JSON.stringify({app:"ledgerbook",v:1,at:new Date().toISOString(),settings:S.settings,counters:{...counters,...S.counters},items:S.items,customers:S.customers,vendors:S.vendors,purchases:S.purchases,sales:S.sales,tds:S.tds,ledgers:S.ledgers,vouchers:S.vouchers,creditNotes:S.creditNotes,debitNotes:S.debitNotes,quotes:S.quotes},null,1),"application/json")}
  if(a==="clearSample"){confirmIn("#dataMsg","Remove every record marked Sample? Real records stay.",async()=>{
    for(const c of COLLS)for(const o of S[c].filter(x=>x.sample))await backend.remove(c,o.id);
    const counters={};for(const s of S.sales.filter(x=>!x.sample))counters[s.fy]=Math.max(counters[s.fy]||0,num(s.seq));
    const fys=new Set([...S.sales.map(s=>s.fy),fyOf(todayISO())]);for(const f of fys)counters[f]=counters[f]||0;
    await backend.resetCounters(counters);$("#dataMsg").innerHTML="";toast("Sample data removed · invoice numbering restarts at 0001")})}
});

window.__onBack=()=>{if($("#modalRoot").firstChild){closeModal();return true}if(view!=="dashboard"){go("dashboard");return true}return false};
/* ---------- boot ---------- */
(async function boot(){
  try{const h=(location.hash||"").slice(1);if(VIEWS.some(v=>v[0]===h))view=h}catch(e){}
  let cfg=srvCfg();
  // opened from a Ledgerbook Server in a web browser: use that server automatically
  if(!cfg&&!NATIVE&&!window.claude&&/^https?:$/.test(location.protocol)){try{const r=await fetch(location.origin+"/api/health");const h=await r.json();if(h&&h.name==="Ledgerbook Server"){cfg={url:location.origin};srvSave(cfg)}}catch(e){}}
  if(cfg&&cfg.url){
    SRV=cfg;
    if(!cfg.token){let setup=false;try{setup=(await api("/api/health",{url:cfg.url,token:null})).setup}catch(e){}return showGate({url:cfg.url,setup})}
    try{const me=await api("/api/me");ME=me.user;RIGHTS_DEF=me.rights;ROLES_DEF=me.roles;backend=serverBackend();await backend.init()}
    catch(e){if(e.code==="auth")return;return showGate({url:cfg.url,msg:e.message})}
    setConn(true);
  }else{
    let db=null;
    if(!NATIVE&&window.claude&&typeof window.claude.use==="function"){
      try{db=await window.claude.use("db")}catch(e){db=null}
      try{downloadsNS=await window.claude.use("downloads")}catch(e){}
    }
    if(db){backend=dbBackend(db);$("#storeDot").className="dot ok";$("#storeText").textContent="Saved to this page's storage · synced"}
    else{backend=await localBackend();$("#storeDot").className="dot "+(NATIVE?"ok":"local");$("#storeText").textContent=NATIVE?`Saved on this ${DEVICE}`:"Saved in this browser only";}
    if(DESKTOP&&NATIVE.serverInfo){try{const i=await NATIVE.serverInfo();if(i.running){/* hosting but not signed in: nudge from Settings */}}catch(e){}}
  }
  if(NATIVE)setTimeout(()=>loadPdfLib().catch(()=>{}),1500);
  READY=true;renderShell();renderView();
})();
</script>
