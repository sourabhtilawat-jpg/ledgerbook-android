<style>
/* Layout: ledger workbench — fixed left index (top strip on phones), one working sheet on the right; modals hold forms. */

  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#EBEFEB; --ink:#17201D; --muted:#5C6964; --line:#D9DFDA;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#4DB59F; --accent-ink:#06201A; --accent-soft:#1B312B;
  --good:#6CC08E; --warn:#E3A853; --bad:#F08C82; --warn-soft:#33270F; --bad-soft:#3A1C19; --wa:#2FA866; --wa-ink:#04140B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171F1C; --sunk:#121916; --ink:#E4EBE8; --muted:#97A49F; --line:#2A3531;
  --accent:#4DB59F; --accent-ink:#06201A; --accent-soft:#1B312B;
  --good:#6CC08E; --warn:#E3A853; --bad:#F08C82; --warn-soft:#33270F; --bad-soft:#3A1C19; --wa:#2FA866; --wa-ink:#04140B; color-scheme:dark}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

.lines td{padding:6px;vertical-align:middle}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-weight:500;z-index:80;max-width:90vw}
.confirm{background:var(--bad-soft);border-radius:6px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}

/* invoice sheet */
.inv{background:#fff;color:#1b1b1b;border:1px solid #cfd5d2;font-family:var(--f-body);font-size:12.5px;padding:22px;overflow-x:auto}
.inv table{font-size:12px}.inv th{background:#eef1ef;color:#333}.inv td,.inv th{border:1px solid #cfd5d2}
.inv tbody tr:hover td{background:none}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;padding-block:10px;padding-right:max(16px, env(safe-area-inset-right, 0px));border-right:none;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  .biz,.store,.nav kbd,.nav .sep{display:none}
  .brand{margin:0}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}

}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.span2,.span3{grid-column:auto}h1{font-size:23px}.tile .v{font-size:18px}.filters label.f{width:calc(50% - 5px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><i></i>Ledgerbook</div>
    <div class="biz" id="bizName">Loading…</div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="store"><span class="dot" id="storeDot"></span><span id="storeText">Connecting to storage…</span></div>
  </aside>
  <main id="main"><div class="empty"><b>Opening your books…</b>Loading items, parties and invoices.</div></main>
</div>

<script>
"use strict";
/* ---------- constants ---------- */
const STATES=[["01","Jammu & Kashmir"],["02","Himachal Pradesh"],["03","Punjab"],["04","Chandigarh"],["05","Uttarakhand"],["06","Haryana"],["07","Delhi"],["08","Rajasthan"],["09","Uttar Pradesh"],["10","Bihar"],["11","Sikkim"],["12","Arunachal Pradesh"],["13","Nagaland"],["14","Manipur"],["15","Mizoram"],["16","Tripura"],["17","Meghalaya"],["18","Assam"],["19","West Bengal"],["20","Jharkhand"],["21","Odisha"],["22","Chhattisgarh"],["23","Madhya Pradesh"],["24","Gujarat"],["26","Dadra & Nagar Haveli and Daman & Diu"],["27","Maharashtra"],["29","Karnataka"],["30","Goa"],["31","Lakshadweep"],["32","Kerala"],["33","Tamil Nadu"],["34","Puducherry"],["35","Andaman & Nicobar Islands"],["36","Telangana"],["37","Andhra Pradesh"],["38","Ladakh"],["97","Other Territory"]];
const STATE_NAME=Object.fromEntries(STATES);
const GST_RATES=[0,0.25,3,5,12,18,28,40];
const UNITS=["PCS","NOS","BOX","BAG","KGS","GMS","LTR","MTR","SET","PAC","DOZ","BTL","ROL","SQM"];
const COLLS=["items","customers","vendors","purchases","sales"];
const GSTIN_RE=/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
const VIEWS=[["dashboard","Dashboard"],["sales","Sales invoices","S"],["purchases","Purchases","P"],["inventory","Inventory"],["items","Items & HSN"],["sep"],["customers","Customers"],["vendors","Vendors"],["reports","Reports"],["settings","Settings"]];

/* ---------- state ---------- */
const S={items:[],customers:[],vendors:[],purchases:[],sales:[],settings:{},counters:{}};
let view="dashboard", sub={}, backend=null, renderQueued=false;
const TAB=Math.random().toString(36).slice(2);

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=n=>Math.round((+n+Number.EPSILON)*100)/100;
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const inr=new Intl.NumberFormat("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>"₹"+inr.format(n||0);
const amt=n=>inr.format(n||0);
const qtyf=n=>(Math.round(n*1000)/1000).toLocaleString("en-IN");
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const fmtDate=d=>{if(!d)return"";const [y,m,dd]=d.split("-");return `${dd}-${m}-${y}`};
const stateLabel=c=>c?`${c}-${STATE_NAME[c]||""}`:"";
const fyOf=d=>{const [y,m]=d.split("-").map(Number);const s=m>=4?y:y-1;return `${String(s).slice(2)}-${String(s+1).slice(2)}`};
const fyStart=d=>{const [y,m]=d.split("-").map(Number);return `${m>=4?y:y-1}-04-01`};
const monthRange=(off=0)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);const y=d.getFullYear(),m=d.getMonth();const last=new Date(y,m+1,0).getDate();const p=x=>String(x).padStart(2,"0");return [`${y}-${p(m+1)}-01`,`${y}-${p(m+1)}-${p(last)}`]};
const byId=(coll,id)=>S[coll].find(x=>x.id===id);
const stateOpts=sel=>`<option value="">Select state</option>`+STATES.map(([c,n])=>`<option value="${c}"${c===sel?" selected":""}>${c} · ${esc(n)}</option>`).join("");
let toastT;function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

function calcLines(lines,inter){
  const out=[];let taxable=0,cgst=0,sgst=0,igst=0,qty=0;
  for(const l of lines||[]){
    const q=num(l.qty),rate=num(l.rate),disc=num(l.disc),g=num(l.gst);
    const tx=r2(q*rate*(1-disc/100)),tax=r2(tx*g/100);
    const c=inter?0:r2(tax/2), s=inter?0:r2(tax-c), i=inter?tax:0;
    out.push({...l,qty:q,rate,disc,gst:g,taxable:tx,cgst:c,sgst:s,igst:i,total:r2(tx+tax)});
    taxable+=tx;cgst+=c;sgst+=s;igst+=i;qty+=q;
  }
  taxable=r2(taxable);cgst=r2(cgst);sgst=r2(sgst);igst=r2(igst);
  const raw=r2(taxable+cgst+sgst+igst),grand=Math.round(raw);
  return {lines:out,taxable,cgst,sgst,igst,tax:r2(cgst+sgst+igst),raw,round:r2(grand-raw),grand,qty};
}
const docCalc=d=>calcLines(d.lines,!!d.inter);

function stockOf(itemId){
  const it=byId("items",itemId);let inQ=0,outQ=0;
  for(const p of S.purchases)for(const l of p.lines||[])if(l.itemId===itemId)inQ+=num(l.qty);
  for(const s of S.sales)if(s.status!=="cancelled")for(const l of s.lines||[])if(l.itemId===itemId)outQ+=num(l.qty);
  const open=num(it?.openingStock);return {open,inQ,outQ,bal:open+inQ-outQ};
}

function words(n){
  n=Math.round(n);if(n===0)return"Zero";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?" "+a[x%10]:"");
  const three=x=>(x>=100?a[Math.floor(x/100)]+" Hundred"+(x%100?" ":""):"")+(x%100?two(x%100):"");
  const parts=[];const cr=Math.floor(n/1e7);n%=1e7;const l=Math.floor(n/1e5);n%=1e5;const t=Math.floor(n/1e3);n%=1e3;
  if(cr)parts.push((cr>99?words(cr):two(cr))+" Crore");if(l)parts.push(two(l)+" Lakh");if(t)parts.push(two(t)+" Thousand");if(n)parts.push(three(n));
  return parts.join(" ");
}

/* ---------- storage backends ---------- */
function scheduleRender(){if(renderQueued)return;renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;renderShell();renderView()})}

/* Device storage: IndexedDB (one record per document, no 5 MB limit), localStorage as fallback. */
function idbOpen(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open("ledgerbook",1)}catch(e){return rej(e)}r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function localBackend(){
  const OLD="ledgerbook_v1";let idb=null;
  try{idb=await idbOpen()}catch(e){idb=null}
  const tx=(mode,fn)=>new Promise((res,rej)=>{const t=idb.transaction("kv",mode);const st=t.objectStore("kv");const out=fn(st);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
  const idbPut=(k,v)=>tx("readwrite",st=>st.put(v,k));
  const idbDel=k=>tx("readwrite",st=>st.delete(k));
  const persistLS=()=>{try{localStorage.setItem(OLD,JSON.stringify({items:S.items,customers:S.customers,vendors:S.vendors,purchases:S.purchases,sales:S.sales,settings:S.settings,counters:S.counters}))}catch(e){toast("Could not save: storage is blocked or full")}};
  if(idb){
    const all=await new Promise((res,rej)=>{const out=[];const t=idb.transaction("kv","readonly");const c=t.objectStore("kv").openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}else res(out)};c.onerror=()=>rej(c.error)});
    for(const [k,v] of all){const [coll]=String(k).split("/");if(COLLS.includes(coll))S[coll].push(v);else if(k==="settings")S.settings=v;else if(k==="counters")S.counters=v}
    // one-time move of data saved by the earlier browser-only version
    try{const raw=localStorage.getItem(OLD);if(raw&&!all.length){const d=JSON.parse(raw);for(const c of COLLS)for(const o of d[c]||[]){S[c].push(o);await idbPut(c+"/"+o.id,o)}if(d.settings){S.settings=d.settings;await idbPut("settings",d.settings)}if(d.counters){S.counters=d.counters;await idbPut("counters",d.counters)}localStorage.removeItem(OLD)}}catch(e){}
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }else{
    try{const raw=localStorage.getItem(OLD);if(raw){const d=JSON.parse(raw);for(const k of [...COLLS,"settings","counters"])if(d[k])S[k]=d[k]}}catch(e){}
  }
  const save=async(k,v)=>{if(idb){try{await idbPut(k,v)}catch(e){toast("Could not save on this device: storage is full");throw e}}else persistLS()};
  return {
    kind:"local",
    async put(coll,obj){obj=JSON.parse(JSON.stringify(obj));const i=S[coll].findIndex(x=>x.id===obj.id);if(i>=0)S[coll][i]=obj;else S[coll].push(obj);await save(coll+"/"+obj.id,obj);scheduleRender()},
    async remove(coll,id){S[coll]=S[coll].filter(x=>x.id!==id);if(idb)await idbDel(coll+"/"+id);else persistLS();scheduleRender()},
    async saveSettings(o){S.settings=o;await save("settings",o);scheduleRender()},
    async nextSeq(fy,floor){const n=Math.max(num(S.counters[fy]),floor)+1;S.counters={...S.counters,[fy]:n};await save("counters",S.counters);return n},
    async resetCounters(map){S.counters=map;await save("counters",map)},
  };
}

function dbBackend(db){
  let ready=0;const need=COLLS.length+1;
  const mark=()=>{ready++;if(ready>=need)scheduleRender()};
  for(const c of COLLS){let first=true;db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({...d.data(),id:d.id}));if(first){first=false;mark()}else scheduleRender()},e=>{toast("Lost live connection to "+c+". Reload the page.")})}
  let firstS=true;db.doc("meta/settings").onSnapshot(s=>{S.settings=s.exists?{...s.data()}:{};if(firstS){firstS=false;mark()}else scheduleRender()});
  const clean=o=>JSON.parse(JSON.stringify(o));
  return {
    kind:"db",
    async put(coll,obj){await db.collection(coll).doc(obj.id).set(clean(obj))},
    async remove(coll,id){await db.collection(coll).doc(id).delete()},
    async saveSettings(o){await db.doc("meta/settings").set(clean(o))},
    async nextSeq(fy,floor){
      const ref=db.doc("meta/counter_"+fy.replace("-",""));
      let got=false;
      for(let i=0;i<8&&!got;i++){try{const r=await ref.acquire({holder:TAB,ttlMs:6000});got=r.acquired}catch(e){got=true}if(!got)await new Promise(r=>setTimeout(r,400+Math.random()*400))}
      const s=await ref.get();const last=s.exists?num(s.data().last):0;
      const n=Math.max(last,floor)+1;await ref.set({last:n,fy});return n;
    },
    async resetCounters(map){for(const [fy,v] of Object.entries(map))await db.doc("meta/counter_"+fy.replace("-","")).set({last:v,fy})},
  };
}

async function allocInvoiceNo(date){

  </div>`;
}

/* ---------- Items ---------- */
function vItems(){
  const tab=sub.tab||"list",q=(sub.q||"").toLowerCase();
  const head=`<div class="head"><div><h1>Items &amp; HSN</h1><div class="sub">Your SKU master: HSN/SAC code, GST rate, prices and opening stock.</div></div><button class="btn pri" data-act="newItem">Add item</button></div>
  <div class="tabs" role="tablist"><button role="tab" data-tab="list" aria-selected="${tab==="list"}">SKU list</button><button role="tab" data-tab="hsn" aria-selected="${tab==="hsn"}">HSN-wise list</button></div>`;
  if(tab==="hsn"){
    const g={};for(const it of S.items){const k=it.hsn||"—";(g[k]=g[k]||[]).push(it)}
    const keys=Object.keys(g).sort();
    return head+(keys.length?`<div class="tablewrap"><table><thead><tr><th>HSN / SAC</th><th>GST rate</th><th>Items</th><th class="num">SKUs</th></tr></thead><tbody>${keys.map(k=>{const rates=[...new Set(g[k].map(i=>num(i.gstRate)))];return `<tr><td class="mono">${esc(k)}</td><td>${rates.map(r=>`<span class="chip">${r}%</span>`).join(" ")}${rates.length>1?' <span class="chip warn">Mixed rates</span>':""}</td><td>${g[k].map(i=>`<button class="link" data-edit-item="${i.id}">${esc(i.name)}</button>`).join(", ")}</td><td class="num">${g[k].length}</td></tr>`}).join("")}</tbody></table></div>`:emptyItems());

  (S.items.length?`<div class="tablewrap"><table><thead><tr><th>SKU</th><th>Item</th><th>HSN</th><th>Unit</th><th class="num">GST</th><th class="num">Sale price</th><th class="num">Purchase price</th><th class="num">Stock</th><th></th></tr></thead><tbody>${rows.map(i=>{const st=stockOf(i.id);return `<tr><td class="mono">${esc(i.sku)}</td><td>${esc(i.name)} ${i.sample?'<span class="chip sample">Sample</span>':""}</td><td class="mono">${esc(i.hsn)}</td><td>${esc(i.unit)}</td><td class="num">${num(i.gstRate)}%</td><td class="num">${amt(num(i.salePrice))}</td><td class="num">${amt(num(i.purchasePrice))}</td><td class="num">${qtyf(st.bal)}</td><td><button class="btn sm" data-edit-item="${i.id}">Edit</button></td></tr>`}).join("")}</tbody></table></div>`:emptyItems());
}
const emptyItems=()=>`<div class="tablewrap"><div class="empty"><b>No items yet</b>Add the SKUs you sell, with their HSN code and GST rate.<div style="margin-top:12px"><button class="btn pri" data-act="newItem">Add item</button></div></div></div>`;

function openItemForm(id){
  const it=id?byId("items",id):{unit:"PCS",gstRate:18,openingStock:0,reorderLevel:0};
  const used=id&&(S.sales.some(s=>s.lines?.some(l=>l.itemId===id))||S.purchases.some(p=>p.lines?.some(l=>l.itemId===id)));
  openModal(id?"Edit item":"Add item",`<form id="itemF" class="grid g4">
   <label class="f req span2"><span>Item name</span><input class="input" id="i_name" required value="${esc(it.name)}"></label>
   <label class="f req"><span>SKU code</span><input class="input" id="i_sku" required value="${esc(it.sku)}"></label>
   <label class="f"><span>Unit (UQC)</span><select class="input" id="i_unit">${UNITS.map(u=>`<option${u===it.unit?" selected":""}>${u}</option>`).join("")}</select></label>
   <label class="f req"><span>HSN / SAC code</span><input class="input" id="i_hsn" inputmode="numeric" required value="${esc(it.hsn)}" placeholder="e.g. 6109"></label>
   <label class="f req"><span>GST rate %</span><select class="input" id="i_gst">${GST_RATES.map(r=>`<option value="${r}"${num(it.gstRate)===r?" selected":""}>${r}%</option>`).join("")}</select></label>
   <label class="f"><span>Sale price (excl. GST)</span><input class="input" id="i_sp" type="number" step="0.01" min="0" value="${it.salePrice??""}"></label>
   <label class="f"><span>Purchase price (excl. GST)</span><input class="input" id="i_pp" type="number" step="0.01" min="0" value="${it.purchasePrice??""}"></label>
   <label class="f"><span>Opening stock</span><input class="input" id="i_os" type="number" step="any" value="${it.openingStock??0}"></label>
   <label class="f"><span>Reorder level</span><input class="input" id="i_rl" type="number" step="any" min="0" value="${it.reorderLevel??0}"></label>

   <div class="spanall" id="itemErr"></div></form>`,

  $("#saveItem").onclick=async()=>{
    const v=x=>$(x).value.trim();
    if(!v("#i_name")||!v("#i_sku")||!v("#i_hsn")){$("#itemErr").innerHTML=`<div class="err">Fill in item name, SKU and HSN code.</div>`;return}
    if(S.items.some(x=>x.sku.toLowerCase()===v("#i_sku").toLowerCase()&&x.id!==id)){$("#itemErr").innerHTML=`<div class="err">SKU ${esc(v("#i_sku"))} is already used by another item.</div>`;return}
    const o={...it,id:id||uid(),name:v("#i_name"),sku:v("#i_sku"),unit:v("#i_unit"),hsn:v("#i_hsn"),gstRate:num(v("#i_gst")),salePrice:num(v("#i_sp")),purchasePrice:num(v("#i_pp")),openingStock:num(v("#i_os")),reorderLevel:num(v("#i_rl")),desc:v("#i_desc")};
    await guard(()=>backend.put("items",o));closeModal();toast(id?"Item saved":"Item added");
  };

function confirmIn(sel,msg,fn){$(sel).innerHTML=`<div class="confirm"><span>${esc(msg)}</span><button class="btn sm danger" id="cYes">Yes, continue</button><button class="btn sm" id="cNo">Keep it</button></div>`;$("#cYes").onclick=fn;$("#cNo").onclick=()=>$(sel).innerHTML=""}
async function guard(fn){try{await fn()}catch(e){toast(e?.code==="quota_exceeded"?"Storage is full. Delete old records to continue.":"Could not save: "+(e?.message||"try again"));throw e}}

/* ---------- Inventory ---------- */
function vInventory(){
  const q=(sub.q||"").toLowerCase();
  const rows=S.items.filter(i=>!q||(i.name+" "+i.sku+" "+i.hsn).toLowerCase().includes(q)).map(i=>[i,stockOf(i.id)]).sort((a,b)=>a[0].name.localeCompare(b[0].name));
  let tv=0,ts=0;rows.forEach(([i,s])=>{tv+=s.bal*num(i.purchasePrice);ts+=s.bal*num(i.salePrice)});
  return `<div class="head"><div><h1>Inventory</h1><div class="sub">Live stock: opening + purchased − sold. Cancelled invoices return stock.</div></div><div class="row"><button class="btn" data-act="exportStock">Export CSV</button><button class="btn pri" data-act="newPurchase">Add stock (purchase)</button></div></div>
  <div class="filters"><label class="f" style="width:280px"><span>Search</span><input class="input" id="invQ" placeholder="Name, SKU or HSN" value="${esc(sub.q||"")}"></label></div>
  ${S.items.length?`<div class="tablewrap"><table><thead><tr><th>SKU</th><th>Item</th><th class="num">Opening</th><th class="num">Purchased</th><th class="num">Sold</th><th class="num">In stock</th><th>Status</th><th class="num">Value at cost</th><th class="num">Value at sale price</th></tr></thead><tbody>${rows.map(([i,s])=>`<tr><td class="mono">${esc(i.sku)}</td><td>${esc(i.name)}</td><td class="num">${qtyf(s.open)}</td><td class="num">${qtyf(s.inQ)}</td><td class="num">${qtyf(s.outQ)}</td><td class="num"><b>${qtyf(s.bal)}</b> <span class="muted">${esc(i.unit)}</span></td><td>${s.bal<=0?'<span class="chip bad">Out of stock</span>':s.bal<=num(i.reorderLevel)?'<span class="chip warn">Reorder</span>':'<span class="chip good">OK</span>'}</td><td class="num">${amt(s.bal*num(i.purchasePrice))}</td><td class="num">${amt(s.bal*num(i.salePrice))}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan="7">Total</td><td class="num">${amt(tv)}</td><td class="num">${amt(ts)}</td></tr></tfoot></table></div>`:emptyItems()}`;
}

/* ---------- Parties ---------- */
function vParties(coll){
  const isC=coll==="customers",q=(sub.q||"").toLowerCase();
  const rows=S[coll].filter(p=>!q||(p.name+" "+p.gstin+" "+p.phone+" "+p.email).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  const title=isC?"Customers":"Vendors";
  return `<div class="head"><div><h1>${title}</h1><div class="sub">${isC?"Who you bill. GSTIN decides B2B vs B2C in GSTR-1; delivery state is the place of supply.":"Who you buy material from."}</div></div><button class="btn pri" data-act="${isC?"newCustomer":"newVendor"}">Add ${isC?"customer":"vendor"}</button></div>
  <div class="filters"><label class="f" style="width:280px"><span>Search</span><input class="input" id="partyQ" placeholder="Name, GSTIN, phone, email" value="${esc(sub.q||"")}"></label></div>
  ${S[coll].length?`<div class="tablewrap"><table><thead><tr><th>Name</th><th>GSTIN</th><th>State</th><th>Contact</th><th class="num">${isC?"Billed":"Purchased"}</th><th></th></tr></thead><tbody>${rows.map(p=>{const docs=isC?S.sales.filter(s=>s.partyId===p.id&&s.status!=="cancelled"):S.purchases.filter(x=>x.partyId===p.id);const t=docs.reduce((a,d)=>a+docCalc(d).grand,0);return `<tr><td><b>${esc(p.name)}</b> ${p.sample?'<span class="chip sample">Sample</span>':""}${p.contact?`<div class="hint">${esc(p.contact)}</div>`:""}</td><td class="mono">${p.gstin?esc(p.gstin):'<span class="chip">Unregistered</span>'}</td><td>${esc(STATE_NAME[p.bill?.state]||"")}</td><td>${esc(p.phone)}${p.email?`<div class="hint">${esc(p.email)}</div>`:""}</td><td class="num">${amt(t)}<div class="hint">${docs.length} ${isC?"invoices":"bills"}</div></td><td><button class="btn sm" data-edit-party="${coll}:${p.id}">Edit</button></td></tr>`}).join("")}</tbody></table></div>`:`<div class="tablewrap"><div class="empty"><b>No ${title.toLowerCase()} yet</b>${isC?"Add a customer to start invoicing.":"Add a vendor to record purchases."}<div style="margin-top:12px"><button class="btn pri" data-act="${isC?"newCustomer":"newVendor"}">Add ${isC?"customer":"vendor"}</button></div></div></div>`}`;
}

function addrBlock(pfx,a,label){a=a||{};return `<fieldset id="${pfx}_fs"><legend>${label}</legend><div class="grid g3">
  <label class="f req spanall"><span>Address</span><textarea class="input" id="${pfx}_line" rows="2">${esc(a.line)}</textarea></label>
  <label class="f"><span>City</span><input class="input" id="${pfx}_city" value="${esc(a.city)}"></label>
  <label class="f req"><span>State</span><select class="input" id="${pfx}_state">${stateOpts(a.state)}</select></label>
  <label class="f"><span>PIN code</span><input class="input" id="${pfx}_pin" inputmode="numeric" maxlength="6" value="${esc(a.pin)}"></label></div></fieldset>`}
const readAddr=p=>({line:$(`#${p}_line`).value.trim(),city:$(`#${p}_city`).value.trim(),state:$(`#${p}_state`).value,pin:$(`#${p}_pin`).value.trim()});

function openPartyForm(coll,id,after){
  const isC=coll==="customers",p=id?byId(coll,id):{same:true};
  const shipLbl=isC?"Delivery address":"Dispatch / ship-from address";
  openModal(`${id?"Edit":"Add"} ${isC?"customer":"vendor"}`,`<form id="partyF" class="grid" onsubmit="return false">
   <div class="grid g2">
    <label class="f req"><span>${isC?"Customer":"Vendor"} name</span><input class="input" id="p_name" value="${esc(p.name)}"></label>
    <label class="f"><span>GSTIN (leave blank if unregistered)</span><input class="input" id="p_gstin" maxlength="15" style="text-transform:uppercase;font-family:var(--f-mono)" value="${esc(p.gstin)}" placeholder="27ABCDE1234F1Z5"></label>
   </div><div id="gstinMsg" class="hint"></div>
   ${addrBlock("b",p.bill,isC?"Invoice address":"Billing address")}
   <label class="check"><input type="checkbox" id="p_same"${p.same!==false?" checked":""}> ${shipLbl} is the same as ${isC?"invoice":"billing"} address</label>
   <div id="shipWrap">${addrBlock("s",p.same!==false?p.bill:p.ship,shipLbl)}</div>
   <fieldset><legend>Contact details</legend><div class="grid g2">
    <label class="f"><span>Contact person</span><input class="input" id="p_contact" value="${esc(p.contact)}"></label>
    <label class="f"><span>Mobile (used for WhatsApp)</span><input class="input" id="p_phone" inputmode="tel" value="${esc(p.phone)}"></label>
    <label class="f"><span>Email address</span><input class="input" id="p_email" type="email" value="${esc(p.email)}"></label>
    <label class="f"><span>PAN (optional)</span><input class="input" id="p_pan" maxlength="10" style="text-transform:uppercase" value="${esc(p.pan)}"></label>
   </div></fieldset>
   <div id="partyErr"></div></form>`,
   `<button class="btn" data-close>Cancel</button><button class="btn pri" id="saveParty">${id?"Save changes":"Add "+(isC?"customer":"vendor")}</button>`);
  const syncShip=()=>{const same=$("#p_same").checked;$("#shipWrap").querySelectorAll("input,select,textarea").forEach(el=>{el.disabled=same});if(same){["line","city","state","pin"].forEach(k=>$("#s_"+k).value=$("#b_"+k).value)}};
  $("#p_same").onchange=syncShip;["line","city","state","pin"].forEach(k=>$("#b_"+k).addEventListener("input",()=>{if($("#p_same").checked)syncShip()}));
  $("#b_state").addEventListener("change",()=>{if($("#p_same").checked)syncShip()});
  const chkG=()=>{const g=$("#p_gstin").value.trim().toUpperCase();const m=$("#gstinMsg");if(!g){m.textContent="Unregistered party: sales go to B2C in GSTR-1.";m.style.color="";return}
    if(!GSTIN_RE.test(g)){m.textContent="GSTIN format looks wrong: 15 characters, starting with the 2-digit state code.";m.style.color="var(--warn)";return}
    const sc=g.slice(0,2);m.textContent=`Valid format · State ${sc} ${STATE_NAME[sc]||""} · PAN ${g.slice(2,12)}`;m.style.color="var(--good)";
    if(!$("#b_state").value&&STATE_NAME[sc]){$("#b_state").value=sc;if($("#p_same").checked)syncShip()}if(!$("#p_pan").value)$("#p_pan").value=g.slice(2,12)};
  $("#p_gstin").addEventListener("input",chkG);chkG();syncShip();
  $("#saveParty").onclick=async()=>{
    const name=$("#p_name").value.trim(),gstin=$("#p_gstin").value.trim().toUpperCase(),bill=readAddr("b"),same=$("#p_same").checked;
    const errs=[];if(!name)errs.push("name");if(!bill.line)errs.push("address");if(!bill.state)errs.push("state");
    if(errs.length){$("#partyErr").innerHTML=`<div class="err">Fill in the ${errs.join(", ")}.</div>`;return}
    if(gstin&&gstin.slice(0,2)!==bill.state&&GSTIN_RE.test(gstin)){$("#partyErr").innerHTML=`<div class="err">GSTIN state code ${gstin.slice(0,2)} does not match the ${isC?"invoice":"billing"} address state ${bill.state}. Check either one.</div>`;return}
    const ship=same?{...bill}:readAddr("s");if(!same&&!ship.state){$("#partyErr").innerHTML=`<div class="err">Choose a state for the ${shipLbl.toLowerCase()}.</div>`;return}
    const o={...p,id:id||uid(),name,gstin,bill,ship,same,contact:$("#p_contact").value.trim(),phone:$("#p_phone").value.trim(),email:$("#p_email").value.trim(),pan:$("#p_pan").value.trim().toUpperCase()};
    await guard(()=>backend.put(coll,o));closeModal();toast(id?"Saved":(isC?"Customer added":"Vendor added"));if(after)after(o.id);
  };
}

/* ---------- Line editor (shared by sales + purchases) ---------- */
function lineEditor(kind,lines,getInter){
  const priceKey=kind==="sale"?"salePrice":"purchasePrice";
  const itemOpts=sel=>`<option value="">Select item</option>`+[...S.items].sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<option value="${i.id}"${i.id===sel?" selected":""}>${esc(i.name)} · ${esc(i.sku)}</option>`).join("");
  const wrap=$("#lines");
  function draw(){
    const inter=getInter(),c=calcLines(lines,inter);
    wrap.innerHTML=`<div class="tablewrap"><table class="lines"><thead><tr><th style="min-width:200px">Item</th><th>HSN</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Disc %</th><th class="num">GST %</th><th class="num">Taxable</th><th class="num">${inter?"IGST":"CGST + SGST"}</th><th class="num">Amount</th><th></th></tr></thead><tbody>${c.lines.map((l,i)=>{const st=l.itemId?stockOf(l.itemId).bal:null;return `<tr data-i="${i}">
     <td><select class="input" data-k="itemId">${itemOpts(l.itemId)}</select>${kind==="sale"&&l.itemId?`<div class="hint">${st!=null?`In stock: ${qtyf(st)}`:""}</div>`:""}</td>
     <td class="mono">${esc(l.hsn||"")}</td>
     <td><input class="input" style="width:80px;text-align:right" type="number" step="any" min="0" data-k="qty" value="${l.qty||""}"></td>
     <td><input class="input" style="width:100px;text-align:right" type="number" step="0.01" min="0" data-k="rate" value="${l.rate||""}"></td>
     <td><input class="input" style="width:66px;text-align:right" type="number" step="0.01" min="0" max="100" data-k="disc" value="${l.disc||""}"></td>
     <td><select class="input" style="width:76px" data-k="gst">${GST_RATES.map(r=>`<option value="${r}"${r===l.gst?" selected":""}>${r}</option>`).join("")}</select></td>
     <td class="num">${amt(l.taxable)}</td><td class="num">${amt(l.cgst+l.sgst+l.igst)}</td><td class="num"><b>${amt(l.total)}</b></td>
     <td><button class="x" data-del="${i}" aria-label="Remove line">×</button></td></tr>`}).join("")}</tbody></table></div>
     <div class="row" style="margin-top:8px"><button class="btn sm" id="addLine" type="button">+ Add line</button></div>
     <div class="sum"><div>Taxable value</div><div>${amt(c.taxable)}</div>${inter?`<div>IGST</div><div>${amt(c.igst)}</div>`:`<div>CGST</div><div>${amt(c.cgst)}</div><div>SGST</div><div>${amt(c.sgst)}</div>`}<div>Round off</div><div>${c.round>=0?"+":""}${amt(c.round)}</div><div class="gt">Total</div><div class="gt">${money(c.grand)}</div></div>`;
  }
  wrap.addEventListener("change",e=>{const tr=e.target.closest("tr[data-i]");if(!tr)return;const l=lines[+tr.dataset.i],k=e.target.dataset.k;
    if(k==="itemId"){const it=byId("items",e.target.value);l.itemId=e.target.value;if(it){l.name=it.name;l.sku=it.sku;l.hsn=it.hsn;l.unit=it.unit;l.gst=num(it.gstRate);l.rate=num(it[priceKey]);if(!l.qty)l.qty=1}}
    else l[k]=num(e.target.value);draw()});
  wrap.addEventListener("input",e=>{const tr=e.target.closest("tr[data-i]");if(!tr||e.target.tagName!=="INPUT")return;lines[+tr.dataset.i][e.target.dataset.k]=num(e.target.value);
    const c=calcLines(lines,getInter()),l=c.lines[+tr.dataset.i],tds=tr.children;tds[6].textContent=amt(l.taxable);tds[7].textContent=amt(l.cgst+l.sgst+l.igst);tds[8].innerHTML=`<b>${amt(l.total)}</b>`;
    const sum=wrap.querySelector(".sum");const inter=getInter();sum.innerHTML=`<div>Taxable value</div><div>${amt(c.taxable)}</div>${inter?`<div>IGST</div><div>${amt(c.igst)}</div>`:`<div>CGST</div><div>${amt(c.cgst)}</div><div>SGST</div><div>${amt(c.sgst)}</div>`}<div>Round off</div><div>${c.round>=0?"+":""}${amt(c.round)}</div><div class="gt">Total</div><div class="gt">${money(c.grand)}</div>`});
  wrap.addEventListener("click",e=>{const d=e.target.closest("[data-del]");if(d){lines.splice(+d.dataset.del,1);if(!lines.length)lines.push({qty:0,rate:0,disc:0,gst:18});draw()}
    if(e.target.id==="addLine"){lines.push({qty:0,rate:0,disc:0,gst:18});draw()}
});
  draw();return {draw,lines};
}

/* ---------- Sales ---------- */
function vSales(){
  const q=(sub.q||"").toLowerCase();const [d1,d2]=[sub.from||"",sub.to||""];
  const rows=S.sales.filter(s=>(!q||(s.no+" "+s.party?.name+" "+s.party?.gstin).toLowerCase().includes(q))&&(!d1||s.date>=d1)&&(!d2||s.date<=d2)).sort((a,b)=>(b.date+String(b.seq).padStart(6,"0")).localeCompare(a.date+String(a.seq).padStart(6,"0")));
  return `<div class="head"><div><h1>Sales invoices</h1><div class="sub">Numbers run in sequence per financial year: ${esc((S.settings.prefix??"INV/")+fyOf(todayISO()))}/0001, 0002… Cancel an invoice instead of deleting it so the series stays unbroken.</div></div><button class="btn pri" data-act="newSale">New sales invoice</button></div>

  ${S.sales.length?`<div class="tablewrap"><table><thead><tr><th>Invoice no</th><th>Date</th><th>Customer</th><th>Place of supply</th><th class="num">Taxable</th><th class="num">GST</th><th class="num">Total</th><th></th></tr></thead><tbody>${rows.map(s=>{const c=docCalc(s);const x=s.status==="cancelled";return `<tr><td class="mono"><button class="link" data-view-sale="${s.id}">${esc(s.no)}</button></td><td class="mono">${fmtDate(s.date)}</td><td>${esc(s.party?.name)} ${s.sample?'<span class="chip sample">Sample</span>':""} ${x?'<span class="chip bad">Cancelled</span>':""}<div class="hint mono">${esc(s.party?.gstin||"B2C")}</div></td><td>${esc(stateLabel(s.pos))}</td><td class="num">${amt(x?0:c.taxable)}</td><td class="num">${amt(x?0:c.tax)}</td><td class="num"><b>${amt(x?0:c.grand)}</b></td><td><button class="btn sm" data-view-sale="${s.id}">Open</button></td></tr>`}).join("")}</tbody></table></div>`:`<div class="tablewrap"><div class="empty"><b>No invoices yet</b>${S.customers.length&&S.items.length?"Create your first sales invoice.":"Add at least one item and one customer, then create an invoice."}<div style="margin-top:12px"><button class="btn pri" data-act="newSale">New sales invoice</button></div></div></div>`}`;
}

  openModal("New sales invoice",`<div class="grid g4">
    <label class="f req span2"><span>Customer</span><div class="row" style="flex-wrap:nowrap"><select class="input" id="so_cust">${custOpts()}</select><button class="btn sm" id="so_newc" type="button">+ New</button></div></label>

    <label class="f"><span>Payment</span><select class="input" id="so_pay"><option>Credit</option><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Card</option><option>Cheque</option></select></label>

  const le=lineEditor("sale",st.lines,inter);
  const pickCust=id=>{st.partyId=id;const c=byId("customers",id);if(c){st.pos=c.ship?.state||c.bill?.state||"";$("#so_pos").value=st.pos;$("#so_party").innerHTML=`<b>Bill to:</b> ${esc([c.bill?.line,c.bill?.city,STATE_NAME[c.bill?.state],c.bill?.pin].filter(Boolean).join(", "))} &nbsp;·&nbsp; <b>Ship to:</b> ${esc([c.ship?.line,c.ship?.city,STATE_NAME[c.ship?.state],c.ship?.pin].filter(Boolean).join(", "))}`}else $("#so_party").innerHTML="";showKind();le.draw()};
  $("#so_cust").onchange=e=>pickCust(e.target.value);
  $("#so_pos").onchange=e=>{st.pos=e.target.value;showKind();le.draw()};
  $("#so_newc").onclick=()=>{const snap={...st,lines:JSON.parse(JSON.stringify(st.lines))};openPartyForm("customers",null,id=>{openSaleFormRestore(snap,id)})};

}
function openSaleFormRestore(snap,custId){
  // reopen the invoice form after creating a customer inline
  setTimeout(()=>{openSaleForm();const sel=$("#so_cust");if(!sel)return;
    const waitFor=(n)=>{if(byId("customers",custId)||n>20){sel.innerHTML=`<option value="">Select customer</option>`+[...S.customers].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}">${esc(c.name)}${c.gstin?" · "+c.gstin:""}</option>`).join("");sel.value=custId;sel.dispatchEvent(new Event("change"))}else setTimeout(()=>waitFor(n+1),150)};waitFor(0)},50);
}
function wireSaleSave(st,inter){
  $("#saveSale").onclick=async()=>{
    const date=$("#so_date").value,cust=byId("customers",st.partyId);
    const lines=st.lines.filter(l=>l.itemId&&num(l.qty)>0);
    const err=m=>$("#saleErr").innerHTML=`<div class="err">${m}</div>`;
    if(!cust)return err("Choose a customer.");if(!date)return err("Choose an invoice date.");if(!st.pos)return err("Choose the place of supply.");if(!lines.length)return err("Add at least one item with a quantity.");
    const short=lines.map(l=>{const it=byId("items",l.itemId);const need=lines.filter(x=>x.itemId===l.itemId).reduce((a,x)=>a+num(x.qty),0);return stockOf(l.itemId).bal<need?it.name:null}).filter(Boolean);
    if(short.length&&!st.okShort){st.okShort=true;return err(`Not enough stock for ${[...new Set(short)].map(esc).join(", ")}. Press Save invoice again to bill anyway (stock will go negative).`)}
    $("#saveSale").disabled=true;
    try{
      const {fy,seq,no}=await allocInvoiceNo(date);
      const o={id:uid(),no,fy,seq,date,partyId:cust.id,party:{name:cust.name,gstin:cust.gstin||"",bill:cust.bill,ship:cust.ship,phone:cust.phone,email:cust.email},pos:st.pos,inter:inter(),
        lines:lines.map(l=>({itemId:l.itemId,name:l.name,sku:l.sku,hsn:l.hsn,unit:l.unit,qty:num(l.qty),rate:num(l.rate),disc:num(l.disc),gst:num(l.gst)})),
        payment:$("#so_pay").value,ref:$("#so_ref").value.trim(),notes:$("#so_notes").value.trim(),status:"active",created:new Date().toISOString()};
      o.grand=docCalc(o).grand;
      await guard(()=>backend.put("sales",o));closeModal();toast(`Invoice ${no} saved`);S.sales.some(x=>x.id===o.id)||S.sales.push(o);viewSale(o.id,true);
      const mode=S.settings.waMode||"open";
      if(NATIVE&&(mode==="open"||mode==="api")&&waNumber(o.party.phone))setTimeout(()=>sendWhatsApp(byId("sales",o.id)||o,{auto:true}),350);
      if(NATIVE&&S.settings.autoPrint)setTimeout(()=>printInvoice(o),mode==="off"?300:2500);
    }catch(e){$("#saveSale").disabled=false}
  };
}

   <div><div style="font-size:18px;font-weight:700">${esc(B.name||"Your Business Name")}</div><div>${esc(B.address||"")}${B.state?`, ${esc(STATE_NAME[B.state])}`:""}</div><div>${B.gstin?`GSTIN: <b>${esc(B.gstin)}</b>`:""}${B.phone?` · Ph: ${esc(B.phone)}`:""}${B.email?` · ${esc(B.email)}`:""}</div></div>
   <div style="text-align:right"><div style="font-size:16px;font-weight:700;letter-spacing:.08em">TAX INVOICE</div>${s.status==="cancelled"?`<div style="color:#b0281f;font-weight:700">CANCELLED</div>`:""}<div>Invoice No: <b>${esc(s.no)}</b></div><div>Date: <b>${fmtDate(s.date)}</b></div><div>Place of supply: ${esc(stateLabel(s.pos))}</div>${s.ref?`<div>Ref: ${esc(s.ref)}</div>`:""}</div>
  </div>
  <table style="margin-bottom:10px"><tr><th style="width:50%">Bill to</th><th>Ship to</th></tr><tr><td><b>${esc(s.party.name)}</b><br>${addr(s.party.bill)}<br>${s.party.gstin?`GSTIN: <b>${esc(s.party.gstin)}</b>`:"Unregistered"}${s.party.phone?`<br>Ph: ${esc(s.party.phone)}`:""}</td><td><b>${esc(s.party.name)}</b><br>${addr(s.party.ship)}<br>State code: ${esc(s.party.ship?.state||"")}</td></tr></table>
  <table><thead><tr><th>#</th><th>Item</th><th>HSN</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Disc%</th><th class="num">Taxable</th><th class="num">GST%</th>${inter?`<th class="num">IGST</th>`:`<th class="num">CGST</th><th class="num">SGST</th>`}<th class="num">Amount</th></tr></thead><tbody>
  ${c.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.name)}<div style="color:#666;font-size:11px">${esc(l.sku||"")}</div></td><td>${esc(l.hsn)}</td><td class="num">${qtyf(l.qty)} ${esc(l.unit||"")}</td><td class="num">${n(l.rate)}</td><td class="num">${l.disc||""}</td><td class="num">${n(l.taxable)}</td><td class="num">${l.gst}</td>${inter?`<td class="num">${n(l.igst)}</td>`:`<td class="num">${n(l.cgst)}</td><td class="num">${n(l.sgst)}</td>`}<td class="num">${n(l.total)}</td></tr>`).join("")}
  </tbody><tfoot><tr><td colspan="6"><b>Total</b></td><td class="num"><b>${n(c.taxable)}</b></td><td></td>${inter?`<td class="num"><b>${n(c.igst)}</b></td>`:`<td class="num"><b>${n(c.cgst)}</b></td><td class="num"><b>${n(c.sgst)}</b></td>`}<td class="num"><b>${n(c.raw)}</b></td></tr></tfoot></table>
  <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:10px">
   <div style="flex:1;min-width:240px"><div><b>Amount in words:</b> Rupees ${words(c.grand)} Only</div>
    <table style="margin-top:8px;width:auto"><thead><tr><th>HSN</th><th class="num">Taxable</th><th class="num">Rate</th>${inter?`<th class="num">IGST</th>`:`<th class="num">CGST</th><th class="num">SGST</th>`}</tr></thead><tbody>${Object.values(hsn).map(h=>`<tr><td>${esc(h.hsn)}</td><td class="num">${n(h.tx)}</td><td class="num">${h.gst}%</td>${inter?`<td class="num">${n(h.i)}</td>`:`<td class="num">${n(h.c)}</td><td class="num">${n(h.s)}</td>`}</tr>`).join("")}</tbody></table>

    <div style="margin-top:36px;text-align:right">For ${esc(B.name||"")}<br><br><br>Authorised signatory</div></div>
  </div>
  ${B.terms?`<div style="margin-top:10px;font-size:11px;color:#555;border-top:1px solid #ccc;padding-top:6px">${esc(B.terms)}</div>`:""}

function viewSale(id,justSaved){
  const s=byId("sales",id);if(!s)return;
  const x=s.status==="cancelled",phone=waNumber(s.party?.phone);
  const waBtn=!phone?`<button class="btn" id="waNoPhone">WhatsApp</button>`:NATIVE?`<button class="btn wa" id="waSend">Send on WhatsApp</button>`:`<a class="btn wa" id="waLinkBtn" href="${esc(waLink(s))}" target="_blank" rel="noopener">Send on WhatsApp</a>`;
  const sent=s.waSentAt?`<span class="chip good">Sent on WhatsApp ${new Date(s.waSentAt).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}</span>`:"";
  openModal(`Invoice ${s.no}`,`${justSaved?`<div class="row" style="margin-bottom:10px"><span class="chip good">Saved as ${esc(s.no)}</span>${!phone?`<span class="chip warn">No mobile number for this customer, so WhatsApp is off</span>`:""}</div>`:""}${sent?`<div style="margin-bottom:10px">${sent}</div>`:""}${invoiceHTML(s,false)}${!NATIVE&&phone?`<p class="hint" style="margin-top:8px">WhatsApp opens with the message ready. Download the PDF first and attach it in the chat. The tablet app attaches the PDF for you.</p>`:""}<div id="saleAct"></div>`,
   `${x?"":`<button class="btn danger" id="cancelSale" style="margin-right:auto">Cancel invoice</button>`}${waBtn}${NATIVE?`<button class="btn" id="printInv">Print</button>`:""}<button class="btn" id="dlPdf">Download PDF</button><button class="btn pri" data-close>Done</button>`,{wide:true});
  $("#dlPdf").onclick=async()=>{try{await saveFile(fileBase(s)+".pdf",await invoicePDF(s),"application/pdf")}catch(e){toast("Could not create the PDF. Check your connection and try again.")}};
  if($("#printInv"))$("#printInv").onclick=()=>printInvoice(s);
  if($("#waSend"))$("#waSend").onclick=()=>sendWhatsApp(s);

  if(!x)$("#cancelSale").onclick=()=>confirmIn("#saleAct",`Cancel ${s.no}? The number stays used, stock returns, and it is excluded from sales and GST totals.`,async()=>{await guard(()=>backend.put("sales",{...s,status:"cancelled",cancelledAt:new Date().toISOString()}));closeModal();toast(`${s.no} cancelled`)});
}

  if(!S.items.length){toast("Add an item first in Items & HSN");go("items");return}
  const ex=editId?byId("purchases",editId):null;
  const st=ex?{partyId:ex.partyId,lines:JSON.parse(JSON.stringify(ex.lines))}:{partyId:"",lines:[{qty:0,rate:0,disc:0,gst:18}]};
  const home=S.settings.state||"";
  openModal(ex?"Edit purchase":"New purchase",`<div class="grid g4">
   <label class="f req span2"><span>Vendor</span><div class="row" style="flex-wrap:nowrap"><select class="input" id="po_v"><option value="">Select vendor</option>${[...S.vendors].sort((a,b)=>a.name.localeCompare(b.name)).map(v=>`<option value="${v.id}"${v.id===st.partyId?" selected":""}>${esc(v.name)}${v.gstin?" · "+v.gstin:""}</option>`).join("")}</select><button class="btn sm" id="po_newv" type="button">+ New</button></div></label>
   <label class="f req"><span>Vendor bill no</span><input class="input" id="po_bill" value="${esc(ex?.billNo)}"></label>

  `${ex?`<button class="btn danger" id="delPur" style="margin-right:auto">Delete</button>`:""}<button class="btn" data-close>Cancel</button><button class="btn pri" id="savePur">${ex?"Save changes":"Save purchase"}</button>`,{wide:true});

    const v=byId("vendors",st.partyId),bill=$("#po_bill").value.trim(),date=$("#po_date").value,lines=st.lines.filter(l=>l.itemId&&num(l.qty)>0);

    if(!v)return err("Choose a vendor.");if(!bill)return err("Enter the vendor's bill number.");if(!date)return err("Choose the bill date.");if(!lines.length)return err("Add at least one item with a quantity.");
    if(S.purchases.some(p=>p.partyId===v.id&&p.billNo.toLowerCase()===bill.toLowerCase()&&p.id!==editId))return err(`Bill ${esc(bill)} from this vendor is already recorded.`);
    const o={...(ex||{}),id:editId||uid(),billNo:bill,date,partyId:v.id,party:{name:v.name,gstin:v.gstin||"",bill:v.bill,ship:v.ship},inter:inter(),lines:lines.map(l=>({itemId:l.itemId,name:l.name,sku:l.sku,hsn:l.hsn,unit:l.unit,qty:num(l.qty),rate:num(l.rate),disc:num(l.disc),gst:num(l.gst)})),notes:$("#po_notes").value.trim()};
    o.grand=docCalc(o).grand;
    await guard(()=>backend.put("purchases",o));closeModal();toast(editId?"Purchase updated":"Purchase saved · stock added");
  };
  if(ex)$("#delPur").onclick=()=>confirmIn("#purErr","Delete this purchase? Its quantities will be removed from stock.",async()=>{await guard(()=>backend.remove("purchases",editId));closeModal();toast("Purchase deleted")});

  const t=todayISO();const [lm1,lm2]=monthRange(-1),[tm1,tm2]=monthRange(0);
  const from=sub.from||tm1,to=sub.to||tm2;sub.from=from;sub.to=to;
  return `<div class="filters"><label class="f"><span>From</span><input class="input" type="date" id="rFrom" value="${from}"></label><label class="f"><span>To</span><input class="input" type="date" id="rTo" value="${to}"></label>
   <div class="row"><button class="btn sm" data-range="${tm1},${tm2}">This month</button><button class="btn sm" data-range="${lm1},${lm2}">Last month</button><button class="btn sm" data-range="${fyStart(t)},${t}">This FY</button><button class="btn sm" data-range="${t},${t}">Today</button></div></div>`;
}
const inRange=d=>d.date>=sub.from&&d.date<=sub.to;

function vReports(){
  const tab=sub.tab||"sales";
  const tabs=[["sales","Sales register"],["purchase","Purchase register"],["gstr1","GSTR-1"],["itemwise","Item-wise sales"],["stock","Stock summary"]];
  let body="";
  const T=tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join("");
  if(tab==="sales"||tab==="purchase"){
    const isS=tab==="sales";const docs=(isS?S.sales:S.purchases).filter(inRange).sort((a,b)=>(a.date+(a.no||a.billNo)).localeCompare(b.date+(b.no||b.billNo)));
    const tot={tx:0,c:0,s:0,i:0,g:0};
    const rows=docs.map(d=>{const c=docCalc(d),x=d.status==="cancelled";if(!x){tot.tx+=c.taxable;tot.c+=c.cgst;tot.s+=c.sgst;tot.i+=c.igst;tot.g+=c.grand}return {d,c,x}});
    sub._export=()=>[[isS?"Invoice No":"Bill No","Date",isS?"Customer":"Vendor","GSTIN",isS?"Place of Supply":"Vendor State","Taxable","CGST","SGST","IGST","Round off","Total","Status"],...rows.map(({d,c,x})=>[isS?d.no:d.billNo,fmtDate(d.date),d.party?.name,d.party?.gstin,isS?stateLabel(d.pos):stateLabel(d.party?.bill?.state),x?0:c.taxable,x?0:c.cgst,x?0:c.sgst,x?0:c.igst,x?0:c.round,x?0:c.grand,x?"Cancelled":"Active"]),["Total","","","","",r2(tot.tx),r2(tot.c),r2(tot.s),r2(tot.i),"",r2(tot.g),""]];
    sub._file=`${isS?"sales":"purchase"}-register_${sub.from}_to_${sub.to}.csv`;
    body=rangeFilters()+`<div class="tiles"><div class="tile"><div class="k">${isS?"Invoices":"Bills"}</div><div class="v">${rows.filter(r=>!r.x).length}</div>${isS?`<div class="n">${rows.filter(r=>r.x).length} cancelled</div>`:""}</div><div class="tile"><div class="k">Taxable value</div><div class="v">${money(tot.tx)}</div></div><div class="tile"><div class="k">${isS?"Output":"Input"} GST</div><div class="v">${money(tot.c+tot.s+tot.i)}</div><div class="n">CGST ${amt(tot.c)} · SGST ${amt(tot.s)} · IGST ${amt(tot.i)}</div></div><div class="tile"><div class="k">Total ${isS?"sales":"purchases"}</div><div class="v">${money(tot.g)}</div></div></div>
    <div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn sm" data-act="exportReport">Export CSV</button></div>
    <div class="tablewrap">${rows.length?`<table><thead><tr><th>${isS?"Invoice no":"Bill no"}</th><th>Date</th><th>${isS?"Customer":"Vendor"}</th><th>GSTIN</th><th class="num">Taxable</th><th class="num">CGST</th><th class="num">SGST</th><th class="num">IGST</th><th class="num">Total</th></tr></thead><tbody>${rows.map(({d,c,x})=>`<tr><td class="mono">${isS?`<button class="link" data-view-sale="${d.id}">${esc(d.no)}</button>`:esc(d.billNo)} ${x?'<span class="chip bad">Cancelled</span>':""}</td><td class="mono">${fmtDate(d.date)}</td><td>${esc(d.party?.name)}</td><td class="mono">${esc(d.party?.gstin||"—")}</td><td class="num">${amt(x?0:c.taxable)}</td><td class="num">${amt(x?0:c.cgst)}</td><td class="num">${amt(x?0:c.sgst)}</td><td class="num">${amt(x?0:c.igst)}</td><td class="num">${amt(x?0:c.grand)}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan="4">Total</td><td class="num">${amt(tot.tx)}</td><td class="num">${amt(tot.c)}</td><td class="num">${amt(tot.s)}</td><td class="num">${amt(tot.i)}</td><td class="num">${amt(tot.g)}</td></tr></tfoot></table>`:`<div class="empty"><b>Nothing in this period</b>Change the dates above.</div>`}</div>`;
  }
  else if(tab==="gstr1") body=gstr1();
  else if(tab==="itemwise"){
    const g={};for(const s of S.sales.filter(inRange))if(s.status!=="cancelled")for(const l of docCalc(s).lines){const k=l.itemId;(g[k]=g[k]||{name:l.name,sku:l.sku,hsn:l.hsn,unit:l.unit,q:0,tx:0,tax:0,t:0});g[k].q+=l.qty;g[k].tx+=l.taxable;g[k].tax+=l.cgst+l.sgst+l.igst;g[k].t+=l.total}
    const rows=Object.values(g).sort((a,b)=>b.tx-a.tx);
    sub._export=()=>[["SKU","Item","HSN","Unit","Qty sold","Taxable","GST","Total"],...rows.map(r=>[r.sku,r.name,r.hsn,r.unit,r.q,r2(r.tx),r2(r.tax),r2(r.t)])];sub._file=`item-wise-sales_${sub.from}_to_${sub.to}.csv`;
    body=rangeFilters()+`<div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn sm" data-act="exportReport">Export CSV</button></div><div class="tablewrap">${rows.length?`<table><thead><tr><th>SKU</th><th>Item</th><th>HSN</th><th class="num">Qty sold</th><th class="num">Taxable</th><th class="num">GST</th><th class="num">Total</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${esc(r.sku)}</td><td>${esc(r.name)}</td><td class="mono">${esc(r.hsn)}</td><td class="num">${qtyf(r.q)} ${esc(r.unit)}</td><td class="num">${amt(r.tx)}</td><td class="num">${amt(r.tax)}</td><td class="num">${amt(r.t)}</td></tr>`).join("")}</tbody></table>`:`<div class="empty"><b>No sales in this period</b>Change the dates above.</div>`}</div>`;
  }
  else if(tab==="stock"){
    const rows=S.items.map(i=>[i,stockOf(i.id)]);
    sub._export=()=>[["SKU","Item","HSN","Unit","Opening","Purchased","Sold","Closing","Cost price","Stock value"],...rows.map(([i,s])=>[i.sku,i.name,i.hsn,i.unit,s.open,s.inQ,s.outQ,s.bal,num(i.purchasePrice),r2(s.bal*num(i.purchasePrice))])];sub._file=`stock-summary_${todayISO()}.csv`;
    body=`<p class="muted">Current position across all dates. For live stock with status, see <button class="link" data-go="inventory">Inventory</button>.</p><div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn sm" data-act="exportReport">Export CSV</button></div><div class="tablewrap">${rows.length?`<table><thead><tr><th>SKU</th><th>Item</th><th class="num">Opening</th><th class="num">In</th><th class="num">Out</th><th class="num">Closing</th><th class="num">Value at cost</th></tr></thead><tbody>${rows.map(([i,s])=>`<tr><td class="mono">${esc(i.sku)}</td><td>${esc(i.name)}</td><td class="num">${qtyf(s.open)}</td><td class="num">${qtyf(s.inQ)}</td><td class="num">${qtyf(s.outQ)}</td><td class="num">${qtyf(s.bal)}</td><td class="num">${amt(s.bal*num(i.purchasePrice))}</td></tr>`).join("")}</tbody></table>`:`<div class="empty"><b>No items yet</b></div>`}</div>`;
  }
  return `<div class="head"><div><h1>Reports</h1><div class="sub">Filter by date, review, and export CSV for your accountant or the GST offline tool.</div></div></div><div class="tabs" role="tablist">${T}</div>${body}`;
}

function gstr1(){
  const home=S.settings.state;const part=sub.part||"b2b";
  const sales=S.sales.filter(inRange);const live=sales.filter(s=>s.status!=="cancelled");
  const b2b=live.filter(s=>s.party?.gstin);
  const B2CL_LIMIT=100000;
  const b2cl=live.filter(s=>!s.party?.gstin&&s.inter&&docCalc(s).grand>B2CL_LIMIT);
  const b2csSrc=live.filter(s=>!s.party?.gstin&&!b2cl.includes(s));
  // rate-wise rows per invoice
  const rateRows=s=>{const g={};for(const l of docCalc(s).lines){(g[l.gst]=g[l.gst]||{rate:l.gst,tx:0,c:0,sg:0,i:0});g[l.gst].tx+=l.taxable;g[l.gst].c+=l.cgst;g[l.gst].sg+=l.sgst;g[l.gst].i+=l.igst}return Object.values(g)};
  const b2bRows=[];for(const s of b2b){const c=docCalc(s);for(const r of rateRows(s))b2bRows.push({s,val:c.grand,...r})}
  const b2clRows=[];for(const s of b2cl){const c=docCalc(s);for(const r of rateRows(s))b2clRows.push({s,val:c.grand,...r})}
  const cs={};for(const s of b2csSrc)for(const r of rateRows(s)){const k=s.pos+"|"+r.rate;(cs[k]=cs[k]||{pos:s.pos,rate:r.rate,tx:0,c:0,sg:0,i:0,inter:s.inter});cs[k].tx+=r.tx;cs[k].c+=r.c;cs[k].sg+=r.sg;cs[k].i+=r.i}
  const b2csRows=Object.values(cs).sort((a,b)=>(a.pos+a.rate).localeCompare(b.pos+b.rate));
  const hsnOf=list=>{const h={};for(const s of list)for(const l of docCalc(s).lines){const k=l.hsn+"|"+l.gst+"|"+l.unit;(h[k]=h[k]||{hsn:l.hsn,desc:l.name,unit:l.unit,rate:l.gst,q:0,tx:0,c:0,sg:0,i:0});h[k].q+=l.qty;h[k].tx+=l.taxable;h[k].c+=l.cgst;h[k].sg+=l.sgst;h[k].i+=l.igst}return Object.values(h).sort((a,b)=>a.hsn.localeCompare(b.hsn))};
  const hsnB2B=hsnOf(b2b),hsnB2C=hsnOf(live.filter(s=>!s.party?.gstin));
  const series={};for(const s of sales){const k=s.no.slice(0,s.no.lastIndexOf("/")+1);(series[k]=series[k]||[]).push(s)}
  const docRows=Object.entries(series).map(([k,l])=>{l.sort((a,b)=>a.seq-b.seq);return {k,from:l[0].no,to:l[l.length-1].no,total:l.length,cancel:l.filter(x=>x.status==="cancelled").length}});
  const sumT=a=>a.reduce((o,r)=>({tx:o.tx+r.tx,c:o.c+r.c,sg:o.sg+r.sg,i:o.i+r.i}),{tx:0,c:0,sg:0,i:0});
  const parts=[["b2b",`4A · B2B (${b2b.length})`],["b2cl",`5 · B2CL (${b2cl.length})`],["b2cs",`7 · B2CS (${b2csRows.length})`],["hsn","12 · HSN summary"],["docs","13 · Documents"]];
  let tbl="",exp;
  const taxCols=r=>`<td class="num">${amt(r.tx)}</td><td class="num">${amt(r.i)}</td><td class="num">${amt(r.c)}</td><td class="num">${amt(r.sg)}</td>`;
  const taxFoot=t=>`<td class="num">${amt(t.tx)}</td><td class="num">${amt(t.i)}</td><td class="num">${amt(t.c)}</td><td class="num">${amt(t.sg)}</td>`;
  const TH=`<th class="num">Taxable</th><th class="num">IGST</th><th class="num">CGST</th><th class="num">SGST</th>`;
  if(part==="b2b"){exp=[["GSTIN of Recipient","Receiver Name","Invoice Number","Invoice date","Invoice Value","Place Of Supply","Reverse Charge","Invoice Type","Rate","Taxable Value","IGST","CGST","SGST","Cess Amount"],...b2bRows.map(r=>[r.s.party.gstin,r.s.party.name,r.s.no,fmtDate(r.s.date),r.val,stateLabel(r.s.pos),"N","Regular B2B",r.rate,r2(r.tx),r2(r.i),r2(r.c),r2(r.sg),0])];
    tbl=b2bRows.length?`<table><thead><tr><th>GSTIN</th><th>Receiver</th><th>Invoice</th><th>Date</th><th class="num">Inv value</th><th>POS</th><th class="num">Rate</th>${TH}</tr></thead><tbody>${b2bRows.map(r=>`<tr><td class="mono">${esc(r.s.party.gstin)}</td><td>${esc(r.s.party.name)}</td><td class="mono">${esc(r.s.no)}</td><td class="mono">${fmtDate(r.s.date)}</td><td class="num">${amt(r.val)}</td><td>${esc(stateLabel(r.s.pos))}</td><td class="num">${r.rate}%</td>${taxCols(r)}</tr>`).join("")}</tbody><tfoot><tr><td colspan="7">Total</td>${taxFoot(sumT(b2bRows))}</tr></tfoot></table>`:""}
  else if(part==="b2cl"){exp=[["Invoice Number","Invoice date","Invoice Value","Place Of Supply","Rate","Taxable Value","Cess Amount"],...b2clRows.map(r=>[r.s.no,fmtDate(r.s.date),r.val,stateLabel(r.s.pos),r.rate,r2(r.tx),0])];
    tbl=b2clRows.length?`<table><thead><tr><th>Invoice</th><th>Date</th><th class="num">Inv value</th><th>POS</th><th class="num">Rate</th>${TH}</tr></thead><tbody>${b2clRows.map(r=>`<tr><td class="mono">${esc(r.s.no)}</td><td class="mono">${fmtDate(r.s.date)}</td><td class="num">${amt(r.val)}</td><td>${esc(stateLabel(r.s.pos))}</td><td class="num">${r.rate}%</td>${taxCols(r)}</tr>`).join("")}</tbody><tfoot><tr><td colspan="5">Total</td>${taxFoot(sumT(b2clRows))}</tr></tfoot></table>`:""}
  else if(part==="b2cs"){exp=[["Type","Place Of Supply","Rate","Taxable Value","Cess Amount","E-Commerce GSTIN"],...b2csRows.map(r=>["OE",stateLabel(r.pos),r.rate,r2(r.tx),0,""])];
    tbl=b2csRows.length?`<table><thead><tr><th>Type</th><th>Place of supply</th><th>Supply</th><th class="num">Rate</th>${TH}</tr></thead><tbody>${b2csRows.map(r=>`<tr><td>OE</td><td>${esc(stateLabel(r.pos))}</td><td>${r.inter?"Inter-state":"Intra-state"}</td><td class="num">${r.rate}%</td>${taxCols(r)}</tr>`).join("")}</tbody><tfoot><tr><td colspan="4">Total</td>${taxFoot(sumT(b2csRows))}</tr></tfoot></table>`:""}
  else if(part==="hsn"){const which=sub.hsnTab||"b2b",rows=which==="b2b"?hsnB2B:hsnB2C;
    exp=[["HSN","Description","UQC","Total Quantity","Total Value","Rate","Taxable Value","Integrated Tax Amount","Central Tax Amount","State/UT Tax Amount","Cess Amount"],...rows.map(r=>[r.hsn,r.desc,r.unit,r.q,r2(r.tx+r.c+r.sg+r.i),r.rate,r2(r.tx),r2(r.i),r2(r.c),r2(r.sg),0])];
    tbl=`<div class="row" style="padding:10px"><button class="btn sm${which==="b2b"?" pri":""}" data-hsntab="b2b">B2B (to registered)</button><button class="btn sm${which==="b2c"?" pri":""}" data-hsntab="b2c">B2C (to unregistered)</button></div>`+(rows.length?`<table><thead><tr><th>HSN</th><th>Description</th><th>UQC</th><th class="num">Qty</th><th class="num">Total value</th><th class="num">Rate</th>${TH}</tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${esc(r.hsn)}</td><td>${esc(r.desc)}</td><td>${esc(r.unit)}</td><td class="num">${qtyf(r.q)}</td><td class="num">${amt(r.tx+r.c+r.sg+r.i)}</td><td class="num">${r.rate}%</td>${taxCols(r)}</tr>`).join("")}</tbody><tfoot><tr><td colspan="6">Total</td>${taxFoot(sumT(rows))}</tr></tfoot></table>`:`<div class="empty"><b>No ${which.toUpperCase()} supplies in this period</b></div>`);}
  else {exp=[["Nature of Document","Sr. No. From","Sr. No. To","Total Number","Cancelled"],...docRows.map(r=>["Invoices for outward supply",r.from,r.to,r.total,r.cancel])];
    tbl=docRows.length?`<table><thead><tr><th>Nature of document</th><th>From</th><th>To</th><th class="num">Total</th><th class="num">Cancelled</th><th class="num">Net issued</th></tr></thead><tbody>${docRows.map(r=>`<tr><td>Invoices for outward supply</td><td class="mono">${esc(r.from)}</td><td class="mono">${esc(r.to)}</td><td class="num">${r.total}</td><td class="num">${r.cancel}</td><td class="num">${r.total-r.cancel}</td></tr>`).join("")}</tbody></table>`:""}
  sub._export=()=>exp;sub._file=`GSTR1_${part}_${sub.from}_to_${sub.to}.csv`;
  const all=sumT([...b2bRows,...b2clRows,...b2csRows]);
  return rangeFilters()+(home?"":`<div class="banner">Set your business state in Settings; it decides intra- vs inter-state supplies.</div>`)+
  `<div class="tiles"><div class="tile"><div class="k">Taxable outward supplies</div><div class="v">${money(all.tx)}</div></div><div class="tile"><div class="k">IGST</div><div class="v">${money(all.i)}</div></div><div class="tile"><div class="k">CGST</div><div class="v">${money(all.c)}</div></div><div class="tile"><div class="k">SGST / UTGST</div><div class="v">${money(all.sg)}</div></div></div>
  <div class="tabs" role="tablist">${parts.map(([k,l])=>`<button role="tab" data-part="${k}" aria-selected="${part===k}">${l}</button>`).join("")}</div>
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="hint">${{b2b:"Invoices to registered customers, one row per invoice and tax rate.",b2cl:"Inter-state invoices to unregistered buyers above ₹1,00,000.",b2cs:"Other sales to unregistered buyers, summarised by place of supply and rate.",hsn:"HSN-wise summary of outward supplies, split B2B and B2C.",docs:"Invoice number series issued in the period, with cancellations."}[part]}</span><button class="btn sm" data-act="exportReport">Export CSV</button></div>
  <div class="tablewrap">${tbl||`<div class="empty"><b>No entries in this section</b>Nothing for this period.</div>`}</div>
  <p class="hint" style="margin-top:10px">Column headings follow the GST offline tool templates. Check figures with your tax adviser before filing.</p>`;
}

  <div id="stErr"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" id="saveSettings">Save settings</button></div></div>
  <div class="panel" style="max-width:860px;margin-top:16px"><h2>Data</h2>
   <p class="muted" style="margin-top:0">${backend?.kind==="db"?"Records are saved to this page's own storage and stay in sync wherever you open it.":NATIVE?"Records are saved on this tablet. Uninstalling the app or clearing its data deletes them.":"Records are saved in this browser only."} Download a backup regularly.</p>
   <div class="row"><button class="btn" data-act="backup">Download backup (.json)</button><label class="btn" for="restoreF">Restore from backup…</label><input type="file" id="restoreF" accept=".json,application/json" hidden></div>
   ${hasSample?`<div style="margin-top:14px"><p class="muted">Sample records are marked <span class="chip sample">Sample</span>. Remove them before you start real billing.</p><button class="btn danger" data-act="clearSample">Remove sample data</button></div>`:""}
   <div id="dataMsg"></div></div>`;
}

/* ---------- bindings ---------- */
function bindView(){
  const m=$("#main");
  const debounce=(id,key)=>{const el=$(id);if(!el)return;el.addEventListener("input",()=>{sub[key]=el.value;clearTimeout(el._t);el._t=setTimeout(()=>{const pos=el.selectionStart;renderView();const n=$(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}},180)})};
  debounce("#itemQ","q");debounce("#invQ","q");debounce("#partyQ","q");debounce("#saleQ","q");debounce("#purQ","q");
  for(const [id,k] of [["#sFrom","from"],["#sTo","to"],["#rFrom","from"],["#rTo","to"]]){const el=$(id);if(el)el.addEventListener("change",()=>{sub[k]=el.value;renderView()})}
  if($("#saveSettings"))$("#saveSettings").onclick=async()=>{
    const g=$("#st_gstin").value.trim().toUpperCase(),stc=$("#st_state").value;
    if(!$("#st_name").value.trim()||!stc){$("#stErr").innerHTML=`<div class="err">Enter the business name and choose your state.</div>`;return}
    if(g&&!GSTIN_RE.test(g)){$("#stErr").innerHTML=`<div class="err">GSTIN format looks wrong. It has 15 characters and starts with your state code.</div>`;return}
    if(g&&g.slice(0,2)!==stc){$("#stErr").innerHTML=`<div class="err">GSTIN starts with ${g.slice(0,2)} but the state is ${stc}. Make them match.</div>`;return}
    if($("#st_waMode").value==="api"&&(!$("#st_waPid").value.trim()||!$("#st_waTok").value.trim()||!$("#st_waTpl").value.trim())){$("#stErr").innerHTML=`<div class="err">Automatic sending needs the phone number ID, access token and template name from your Meta WhatsApp Business account.</div>`;return}
    await guard(()=>backend.saveSettings({...S.settings,name:$("#st_name").value.trim(),gstin:g,address:$("#st_addr").value.trim(),state:stc,phone:$("#st_phone").value.trim(),email:$("#st_email").value.trim(),prefix:$("#st_prefix").value.trim(),bank:$("#st_bank").value.trim(),invNote:$("#st_note").value.trim(),terms:$("#st_terms").value.trim(),
      waMode:$("#st_waMode").value,waMsg:$("#st_waMsg").value,printLayout:$("#st_print").value,autoPrint:$("#st_autoPrint").checked,
      waApiPhoneId:$("#st_waPid").value.trim(),waApiToken:$("#st_waTok").value.trim(),waApiTemplate:$("#st_waTpl").value.trim(),waApiLang:$("#st_waLang").value.trim(),waApiVars:$("#st_waVars").value.trim()}));toast("Settings saved");
  };
  if($("#st_waMode"))$("#st_waMode").onchange=e=>{$("#apiBox").hidden=e.target.value!=="api"};
  if($("#restoreF"))$("#restoreF").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.items))throw 0;
    $("#dataMsg").innerHTML=`<div class="confirm"><span>Restore ${d.items.length} items, ${d.customers?.length||0} customers, ${d.vendors?.length||0} vendors, ${d.purchases?.length||0} purchases and ${d.sales?.length||0} invoices? Existing records with the same IDs are overwritten.</span><button class="btn sm danger" id="doRestore">Restore</button></div>`;
    $("#doRestore").onclick=async()=>{for(const c of COLLS)for(const o of d[c]||[])await backend.put(c,o);if(d.settings)await backend.saveSettings(d.settings);if(d.counters)await backend.resetCounters(d.counters);$("#dataMsg").innerHTML="";toast("Backup restored")}}catch(err){$("#dataMsg").innerHTML=`<div class="err">That file is not a Ledgerbook backup.</div>`}};rd.readAsText(f)};
}
$("#main").addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-go]");if(!t)return;
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.tab){sub={...sub,tab:t.dataset.tab,part:sub.part};return renderView()}
  if(t.dataset.part){sub.part=t.dataset.part;return renderView()}
  if(t.dataset.hsntab){sub.hsnTab=t.dataset.hsntab;return renderView()}
  if(t.dataset.range){const [a,b]=t.dataset.range.split(",");sub.from=a;sub.to=b;return renderView()}
  if(t.dataset.editItem)return openItemForm(t.dataset.editItem);
  if(t.dataset.editParty){const [c,id]=t.dataset.editParty.split(":");return openPartyForm(c,id)}
  if(t.dataset.viewSale)return viewSale(t.dataset.viewSale);
  if(t.dataset.viewPur)return openPurchaseForm(t.dataset.viewPur);
  const a=t.dataset.act;if(!a)return;
  if(a==="newItem")openItemForm();
  if(a==="newSale")openSaleForm();
  if(a==="newPurchase")openPurchaseForm();
  if(a==="newCustomer")openPartyForm("customers");
  if(a==="newVendor")openPartyForm("vendors");
  if(a==="exportReport"&&sub._export)saveFile(sub._file,csv(sub._export()),"text/csv");
  if(a==="exportStock")saveFile(`stock_${todayISO()}.csv`,csv([["SKU","Item","HSN","Unit","Opening","Purchased","Sold","In stock","Value at cost"],...S.items.map(i=>{const s=stockOf(i.id);return [i.sku,i.name,i.hsn,i.unit,s.open,s.inQ,s.outQ,s.bal,r2(s.bal*num(i.purchasePrice))]})]),"text/csv");
  if(a==="backup"){const counters={};for(const s of S.sales)counters[s.fy]=Math.max(counters[s.fy]||0,num(s.seq));saveFile(`ledgerbook-backup_${todayISO()}.json`,JSON.stringify({app:"ledgerbook",v:1,at:new Date().toISOString(),settings:S.settings,counters:{...counters,...S.counters},items:S.items,customers:S.customers,vendors:S.vendors,purchases:S.purchases,sales:S.sales},null,1),"application/json")}
  if(a==="clearSample"){confirmIn("#dataMsg","Remove every record marked Sample? Real records stay.",async()=>{
    for(const c of COLLS)for(const o of S[c].filter(x=>x.sample))await backend.remove(c,o.id);
    const counters={};for(const s of S.sales.filter(x=>!x.sample))counters[s.fy]=Math.max(counters[s.fy]||0,num(s.seq));
    const fys=new Set([...S.sales.map(s=>s.fy),fyOf(todayISO())]);for(const f of fys)counters[f]=counters[f]||0;
    await backend.resetCounters(counters);$("#dataMsg").innerHTML="";toast("Sample data removed · invoice numbering restarts at 0001")})}
});

window.__onBack=()=>{if($("#modalRoot").firstChild){closeModal();return true}if(view!=="dashboard"){go("dashboard");return true}return false};
/* ---------- boot ---------- */
(async function boot(){
  try{const h=(location.hash||"").slice(1);if(VIEWS.some(v=>v[0]===h))view=h}catch(e){}
  let db=null;
  if(!NATIVE&&window.claude&&typeof window.claude.use==="function"){
    try{db=await window.claude.use("db")}catch(e){db=null}
    try{downloadsNS=await window.claude.use("downloads")}catch(e){}
  }
  if(db){backend=dbBackend(db);$("#storeDot").className="dot ok";$("#storeText").textContent="Saved to this page's storage · synced"}
  else{backend=await localBackend();$("#storeDot").className="dot "+(NATIVE?"ok":"local");$("#storeText").textContent=NATIVE?"Saved on this tablet":"Saved in this browser only";}
  if(NATIVE)setTimeout(()=>loadPdfLib().catch(()=>{}),1500);
  renderShell();renderView();
})();
</script>
